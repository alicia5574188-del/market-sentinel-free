name: Validate Frozen Regime Causal Top30
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-frozen-regime-causal-top30.mjs"
      - ".github/workflows/validate-frozen-regime-causal-top30.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Run frozen five-regime external-symbol audit
        run: node --max-old-space-size=6144 scripts/research-frozen-regime-causal-top30.mjs
      - name: Print summary
        run: jq '{decision,systems,combined:{external:.combined.external.base,core11Baseline:.combined.core11Baseline.base}}' /tmp/frozen-regime-top30-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-regime-causal-top30
          path: |
            /tmp/frozen-regime-top30-summary.json
            /tmp/frozen-regime-top30-result.json
          retention-days: 7