name: Verify proportional live risk

on:
  push:
    branches:
      - chatgpt/proportional-live-risk
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Signal and engine tests
        run: npm run test:signals

      - name: Build and UI tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit --incremental false
