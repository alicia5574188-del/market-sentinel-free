name: Sentinel V2 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Keep only the newest validation run for each PR. This does not reduce test
# coverage: every latest PR revision still runs the full suite, while stale
# in-progress revisions are cancelled instead of generating redundant failures.
# Production/main runs are never cancelled by a newer PR revision.
concurrency:
  group: sentinel-v2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Strategy, risk and migration tests
        run: npm run test:signals
      - name: Production build and UI safety tests
        run: npm test
      - name: Wrangler production deploy dry-run
        run: npx wrangler deploy --dry-run --config dist/server/wrangler.json


  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify deployment credential
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Build release
        run: npm run build
      - name: Apply additive D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
      - name: Deploy Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Verify immutable asset and bounded health
        shell: bash
        run: |
          set -euo pipefail
          base="https://market-sentinel-free.alicia5574188.workers.dev"
          expected_asset="$(find dist/client/assets -maxdepth 1 -type f -name 'page-*.js' -printf '%f\n' | head -1)"
          expected_version="$(sed -n 's/^export const DIRECT_MARKET_BRAIN_VERSION = "\([^"]*\)";/\1/p' lib/direct-market-types.ts)"
          [[ -n "$expected_version" ]]
          ready=0
          for attempt in {1..12}; do
            code="$(curl -sS --max-time 10 -o /tmp/release-page.js -w '%{http_code}' "$base/assets/$expected_asset" || true)"
            if [[ "$code" == "200" ]] && grep -Fq "$expected_version" /tmp/release-page.js && grep -q '每12小时总结' /tmp/release-page.js; then
              ready=1
              break
            fi
            sleep 10
          done
          [[ "$ready" == "1" ]]
          health_ready=0
          for attempt in {1..12}; do
            code="$(curl -sS --max-time 5 -o /tmp/health-ready.json -w '%{http_code}' "$base/__health" || true)"
            if [[ "$code" == "200" ]] && jq -e '
              .ok == true and
              .schedulerError == null and
              .schedulers.position.state == "live" and
              .schedulers.position.lastError == null and
              (.schedulers.scanner.state == "live" or .schedulers.scanner.state == "starting") and
              .schedulers.scanner.lastSuccessAt != null and
              ((now * 1000 - .schedulers.scanner.lastSuccessAt) < 180000) and
              .schedulers.scanner.lastError == null and
              .schedulers.scanner.circuitOpen == false
            ' /tmp/health-ready.json >/dev/null; then
              health_ready=1
              break
            fi
            sleep 10
          done
          [[ "$health_ready" == "1" ]]
          for attempt in 1 2 3; do
            curl -fsS --max-time 5 "$base/__health" -o "/tmp/health-$attempt.json"
            jq -e '
              .ok == true and
              .schedulerError == null and
              .schedulers.position.state == "live" and
              .schedulers.position.lastError == null and
              (.schedulers.scanner.state == "live" or .schedulers.scanner.state == "starting") and
              .schedulers.scanner.lastSuccessAt != null and
              ((now * 1000 - .schedulers.scanner.lastSuccessAt) < 180000) and
              .schedulers.scanner.lastError == null and
              .schedulers.scanner.circuitOpen == false
            ' "/tmp/health-$attempt.json"
            sleep 5
          done
      - name: Verify paper strategy cutover
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(sed -n 's/^export const DIRECT_MARKET_BRAIN_VERSION = "\([^"]*\)";.*/\1/p' lib/direct-market-types.ts)"
          cutover_ready=0
          for attempt in {1..12}; do
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command \
              "SELECT reset.status, reset.active_brain_version, reset.target_brain_version, (SELECT COUNT(*) FROM hte31_trades paper_trade WHERE paper_trade.status = 'holding' AND (paper_trade.brain_version IS NULL OR paper_trade.brain_version != reset.active_brain_version OR paper_trade.entry_at < reset.completed_at)) AS legacy_open_positions FROM hte31_paper_reset_state reset WHERE reset.id = 'singleton'" \
              > /tmp/paper-cutover.json
            cutover_row="$(jq -c 'if type == "array" then .[0].results[0] else .results[0] end' /tmp/paper-cutover.json)"
            echo "Paper cutover state: $cutover_row"
            if jq -e --arg version "$expected_version" '
              .status == "completed" and
              .active_brain_version == $version and
              .target_brain_version == null and
              ((.legacy_open_positions | tonumber) == 0)
            ' <<< "$cutover_row" >/dev/null; then
              cutover_ready=1
              break
            fi
            sleep 10
          done
          [[ "$cutover_ready" == "1" ]]
