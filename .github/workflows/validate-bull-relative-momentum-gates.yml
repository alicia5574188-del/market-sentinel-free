name: Validate Bull Relative Momentum Structural Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-bull-relative-momentum-gates.mjs"
      - ".github/workflows/validate-bull-relative-momentum-gates.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Fetch 44-month Gate 5m core universe
        env:
          RESEARCH_INTERVAL: 5m
          RESEARCH_DATASET: /tmp/gate-history-bull-rm-44m.json
          RESEARCH_MONTHS: 202301,202302,202303,202304,202305,202306,202307,202308,202309,202310,202311,202312,202401,202402,202403,202404,202405,202406,202407,202408,202409,202410,202411,202412,202501,202502,202503,202504,202505,202506,202507,202508,202509,202510,202511,202512,202601,202602,202603,202604,202605,202606,202607,202608
          RESEARCH_SYMBOLS: BTC_USDT,ETH_USDT,SOL_USDT,XRP_USDT,BNB_USDT,DOGE_USDT,ADA_USDT,LINK_USDT,LTC_USDT,AVAX_USDT,BCH_USDT
          RESEARCH_MIN_CONTRACTS: 11
          RESEARCH_MIN_MONTH_COVERAGE: 0.70
          RESEARCH_CONCURRENCY: 16
        run: node scripts/fetch-gate-history.mjs
      - name: Audit frozen bull relative momentum structural gates
        env:
          RESEARCH_DATASET: /tmp/gate-history-bull-rm-44m.json
          RESEARCH_OUTPUT: /tmp/bull-relative-momentum-gates.json
          RESEARCH_FRICTION: 0.0014
          RESEARCH_STRESS_FRICTION: 0.0022
          RESEARCH_ENTRY_SLIPPAGE: 0.00025
        run: node scripts/research-bull-relative-momentum-gates.mjs
      - name: Print compact result
        run: jq '{decision,parity,rawSignalTrades,segmentsTested,triplePassCount,triplePass,top:(.leaderboard[0:8]|map({id,discovery,validation,evaluation,gates,triplePass}))}' /tmp/bull-relative-momentum-gates.json
      - uses: actions/upload-artifact@v4
        with:
          name: bull-relative-momentum-structural-gates
          path: /tmp/bull-relative-momentum-gates.json
          retention-days: 7
