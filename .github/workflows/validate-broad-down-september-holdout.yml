name: Validate Broad Down September Holdout
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-broad-down-september-holdout.mjs"
      - ".github/workflows/validate-broad-down-september-holdout.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Check syntax
        run: node --check scripts/research-broad-down-september-holdout.mjs
      - name: Run untouched September holdout
        run: node --max-old-space-size=4096 scripts/research-broad-down-september-holdout.mjs
      - name: Print result
        run: jq '{decision,period,activeSymbols,primary,comparison,rankExpansion,candidateCount,eventCount}' /tmp/broad-down-september-holdout.json
      - uses: actions/upload-artifact@v4
        with:
          name: broad-down-september-holdout
          path: |
            /tmp/broad-down-september-holdout.json
            /tmp/broad-down-september-events.json
            /tmp/broad-down-september-trades.json
          retention-days: 7
