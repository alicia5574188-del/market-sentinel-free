name: Validate Consensus State Cells Upper Bound
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-consensus-state-cells-upper-bound.mjs"
      - ".github/workflows/validate-consensus-state-cells-upper-bound.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Check syntax
        run: node --check scripts/research-consensus-state-cells-upper-bound.mjs
      - name: Run consensus state-cell upper-bound portfolio
        run: node scripts/research-consensus-state-cells-upper-bound.mjs
      - name: Print focused result
        if: always()
        run: |
          test -f /tmp/consensus-state-cells-upper-bound-report.json && node -e "const r=require('/tmp/consensus-state-cells-upper-bound-report.json'); console.log(JSON.stringify({decision:r.decision,activeSymbols:r.data?.activeSymbols?.length,eligibleSignalCount:r.eligibleSignalCount,base:r.base&&{avgMonthReturn:r.base.avgMonthReturn,positiveMonths:r.base.positiveMonths,monthsAtLeast5pct:r.base.monthsAtLeast5pct,avgTradesPerDay:r.base.avgTradesPerDay,totalCompounded:r.base.totalCompounded,maxDD:r.base.maxDD},stress:r.stress&&{avgMonthReturn:r.stress.avgMonthReturn,positiveMonths:r.stress.positiveMonths,monthsAtLeast5pct:r.stress.monthsAtLeast5pct,avgTradesPerDay:r.stress.avgTradesPerDay,totalCompounded:r.stress.totalCompounded,maxDD:r.stress.maxDD},calibration:r.calibration&&{avgMonthReturn:r.calibration.avgMonthReturn,positiveMonths:r.calibration.positiveMonths,avgTradesPerDay:r.calibration.avgTradesPerDay},validation:r.validation&&{avgMonthReturn:r.validation.avgMonthReturn,positiveMonths:r.validation.positiveMonths,avgTradesPerDay:r.validation.avgTradesPerDay},cellStats:r.cellStats},null,2))" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consensus-state-cells-upper-bound-report
          path: /tmp/consensus-state-cells-upper-bound-report.json
          if-no-files-found: warn
          retention-days: 7
