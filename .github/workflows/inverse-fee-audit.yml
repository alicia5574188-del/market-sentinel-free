name: Inverse fee attribution public read
on:
  push:
    branches: [verify/20261001-inverse-cutover]
    paths: [.github/workflows/inverse-fee-audit.yml]
permissions: {}
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read public health and separate paid costs from open valuation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from datetime import datetime,timezone
          url='https://market-sentinel-free.alicia5574188.workers.dev/__health'
          raw=subprocess.check_output(['curl','--silent','--show-error','--max-time','25','--write-out','\n%{http_code}',url],text=True)
          body,status=raw.rsplit('\n',1);d=json.loads(body);r=d.get('runtime') or {};f=r.get('forward') or {};x=f.get('shadowInverse') or {}
          print('COST_OBSERVATION '+json.dumps({'observedAt':datetime.now(timezone.utc).isoformat(),'http':status,'ok':d.get('ok'),'buildSha':r.get('buildSha'),'storage':f.get('storage'),'account':{k:f.get(k) for k in ['startedAt','balance','initialEquity','resolved','openCount','fees']},'paired':{k:v for k,v in x.items() if k!='curve'}},ensure_ascii=False),flush=True)
          if x:
              gap=-(x['sourceNet']+x['inverseNet']);paid=x['sourceFees']+x['inverseFees'];fund=x['sourceFunding']+x['inverseFunding'];settled=x['realizedSpreadDrag']
              print('COST_BRIDGE '+json.dumps({'valuationGap':gap,'sourcePaidFees':x['sourceFees'],'inversePaidFees':x['inverseFees'],'bothPaidFees':paid,'bothChargedFundingAllowance':fund,'settledSpreadAttribution':settled,'remainingOpenSpreadAndEstimatedCloseFees_NOT_PAID':gap-paid-fund-settled,'note':'Last category needs paired positions and current quotes to separate. This is a current sample, not a reconstruction of screenshot time.'}),flush=True)
              target=int(datetime(2026,10,1,4,51,19,tzinfo=timezone.utc).timestamp()*1000)
              print('CURVE_NEAR_SCREENSHOT '+json.dumps(sorted(x.get('curve',[]),key=lambda p:abs(p['at']-target))[:4]),flush=True)
          PY
