name: Validate Regime Core Satellite V1.1

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/validate-regime-core-satellite-v1-1.mjs"
      - ".github/workflows/validate-regime-core-satellite-v1-1.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Fetch 12-month Gate 5m validation universe
        env:
          RESEARCH_INTERVAL: 5m
          RESEARCH_DATASET: /tmp/gate-history-expanded-12m.json
          RESEARCH_MONTHS: 202509,202510,202511,202512,202601,202602,202603,202604,202605,202606,202607,202608
          RESEARCH_SYMBOLS: BTC_USDT,ETH_USDT,SOL_USDT,XRP_USDT,BNB_USDT,DOGE_USDT,ADA_USDT,LINK_USDT,LTC_USDT,AVAX_USDT,BCH_USDT,SUI_USDT,UNI_USDT,DOT_USDT,ZEC_USDT,STORJ_USDT,LSK_USDT
          RESEARCH_MIN_CONTRACTS: 12
          RESEARCH_MIN_MONTH_COVERAGE: 0.98
          RESEARCH_CONCURRENCY: 12
        run: node scripts/fetch-gate-history.mjs
      - name: Replay final production module
        env:
          RESEARCH_DATASET: /tmp/gate-history-expanded-12m.json
          VALIDATION_OUTPUT: /tmp/regime-core-satellite-v1-1.json
        run: node --experimental-strip-types scripts/validate-regime-core-satellite-v1-1.mjs
      - name: Require production gates
        run: |
          jq . /tmp/regime-core-satellite-v1-1.json
          jq -e '.productionCandidate == true' /tmp/regime-core-satellite-v1-1.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: regime-core-satellite-v1-1-validation
          path: /tmp/regime-core-satellite-v1-1.json
          retention-days: 7
