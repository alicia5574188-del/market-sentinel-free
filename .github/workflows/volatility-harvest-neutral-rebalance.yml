name: Volatility Harvest Neutral Rebalance

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/research-volatility-harvest-neutral-rebalance.mjs'
      - '.github/workflows/volatility-harvest-neutral-rebalance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Syntax check
        run: node --check scripts/research-volatility-harvest-neutral-rebalance.mjs
      - name: Fetch 37-month Gate 1h futures prices
        env:
          RESEARCH_INTERVAL: 1h
          RESEARCH_DATASET: /tmp/gate-vol-harvest-37m.json
          RESEARCH_MONTHS: 202308,202309,202310,202311,202312,202401,202402,202403,202404,202405,202406,202407,202408,202409,202410,202411,202412,202501,202502,202503,202504,202505,202506,202507,202508,202509,202510,202511,202512,202601,202602,202603,202604,202605,202606,202607,202608
          RESEARCH_SYMBOLS: BTC_USDT,ETH_USDT,SOL_USDT,XRP_USDT,BNB_USDT,DOGE_USDT,ADA_USDT,LINK_USDT,LTC_USDT,AVAX_USDT,BCH_USDT,SUI_USDT,UNI_USDT,FIL_USDT,AAVE_USDT,ARB_USDT,APT_USDT,PEPE_USDT,WLD_USDT
          RESEARCH_MIN_CONTRACTS: '15'
          RESEARCH_MIN_MONTH_COVERAGE: '0.98'
          RESEARCH_CONCURRENCY: '16'
        run: node scripts/fetch-gate-history.mjs
      - name: Run volatility-harvest neutral rebalance research
        env:
          RESEARCH_DATASET: /tmp/gate-vol-harvest-37m.json
          RESEARCH_OUTPUT: /tmp/volatility-harvest-neutral-rebalance.json
        run: node scripts/research-volatility-harvest-neutral-rebalance.mjs
      - name: Print result
        run: jq '{research,objective,data,periods,protocol,grid,diagnostics,frozen,frontier,evaluation,topQualified:(.topQualified[:5]),topDiagnostics:(.topDiagnostics[:8]),note}' /tmp/volatility-harvest-neutral-rebalance.json
      - uses: actions/upload-artifact@v4
        with:
          name: volatility-harvest-neutral-rebalance
          path: /tmp/volatility-harvest-neutral-rebalance.json
          retention-days: 7
