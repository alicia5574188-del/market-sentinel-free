name: UI Copy Cleanup Once

on:
  push:
    branches:
      - ui/remove-dev-copy-20260831
    paths:
      - .github/workflows/ui-copy-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[ui-copy-cleanup-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/remove-dev-copy-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Apply product copy cleanup
        run: python3 scripts/apply-ui-copy-cleanup-temp.py
      - name: Install
        run: npm run install:ci
      - name: Focused UI tests
        run: node --test tests/human-trader-ui.test.mjs tests/mobile-navigation.test.mjs tests/responsive-layout.test.mjs
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Remove temporary applicator and workflow
        run: rm scripts/apply-ui-copy-cleanup-temp.py .github/workflows/ui-copy-cleanup-once.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[ui-copy-cleanup-applied] Remove migration copy from product UI"
          git push origin HEAD:ui/remove-dev-copy-20260831
