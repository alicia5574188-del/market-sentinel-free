name: Verify Persistent Equity Reopen
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/persistent-equity-stage.yml', 'scripts/persistent-equity-part-*.b64']
permissions:
  contents: write
jobs:
  stage:
    if: github.head_ref == 'fix/equity-persistent-reopen' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply only the exact tested browser-cache changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/persistent-equity-verified
          python3 - <<'PY'
          import pathlib,json,base64,bz2,hashlib,subprocess
          root=pathlib.Path.cwd();out=pathlib.Path('/tmp/persistent-equity-verified')
          packed=''.join((root/f'scripts/persistent-equity-part-{i}.b64').read_text().strip() for i in range(1,5))
          print('Payload',len(packed),hashlib.sha256(packed.encode()).hexdigest())
          assert len(packed)==15372 and hashlib.sha256(packed.encode()).hexdigest()=='ba3229424e12dd01895ed867484699d163c1a472bf6790fa8f801b90be94836e'
          data=json.loads(bz2.decompress(base64.b64decode(packed,validate=True)))
          assert set(data['hashes'])=={'app/equity-curve.tsx','app/page.tsx','lib/equity-cache.ts','research/EQUITY_CACHE_INCREMENTAL.md','tests/equity-cache.test.ts'}
          for p,h in data['hashes'].items():assert hashlib.sha256((root/p).read_bytes()).hexdigest()==h['before'],p
          subprocess.run(['git','apply','--check','-'],input=data['patch'].encode(),check=True)
          subprocess.run(['git','apply','-'],input=data['patch'].encode(),check=True)
          for p,h in data['hashes'].items():assert hashlib.sha256((root/p).read_bytes()).hexdigest()==h['after'],p
          (out/'source-hashes.json').write_text(json.dumps(data['hashes'],indent=2))
          (out/'browser-fixture.json').write_text(json.dumps({k:data[k] for k in ['host','browser','html']}))
          (out/'source.patch').write_text(data['patch'])
          PY
          git rm scripts/persistent-equity-transfer.b64 scripts/persistent-equity-part-*.b64 .github/workflows/persistent-equity-stage.yml
      - name: Verify frozen trading, exact dependencies and cache regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci > /tmp/persistent-equity-verified/install.log 2>&1
          npm run test:direct > /tmp/persistent-equity-verified/direct.log 2>&1
          npm test > /tmp/persistent-equity-verified/build-test.log 2>&1
          npm run typecheck > /tmp/persistent-equity-verified/typecheck.log 2>&1
          npm run lint > /tmp/persistent-equity-verified/lint.log 2>&1
          npx wrangler deploy --dry-run --config dist/server/wrangler.json > /tmp/persistent-equity-verified/dry-run.log 2>&1
          git diff --check
      - name: Close and relaunch real Chromium three times using native persistent browser storage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright==1.55.0 > /tmp/persistent-equity-verified/playwright-install.log 2>&1
          python3 - <<'PY'
          import pathlib,json
          out=pathlib.Path('/tmp/persistent-equity-verified');data=json.loads((out/'browser-fixture.json').read_text())
          site=pathlib.Path('work/persistent-browser');site.mkdir(parents=True,exist_ok=True)
          (site/'index.tsx').write_text(data['host']);(site/'index.html').write_text(data['html']);(out/'browser-test.py').write_text(data['browser'])
          PY
          node_modules/.bin/esbuild work/persistent-browser/index.tsx --bundle --format=esm --outfile=work/persistent-browser/app.js --jsx=automatic --log-level=warning
          python3 -m http.server 8765 --bind 127.0.0.1 --directory work/persistent-browser > /tmp/persistent-equity-verified/browser-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; rm -rf /tmp/persistent-equity-verified/browser-profile' EXIT
          sleep 1
          python3 /tmp/persistent-equity-verified/browser-test.py /tmp/persistent-equity-verified | tee /tmp/persistent-equity-verified/browser-test.log
      - name: Store verified source blobs, never a branch mutation or production deploy
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');
            const {owner,repo}=context.repo,parent=context.payload.pull_request.head.sha,branch=context.payload.pull_request.head.ref;
            const current=await github.rest.repos.getBranch({owner,repo,branch});
            if(current.data.commit.sha!==parent)throw new Error('Head changed during verification');
            const expected=JSON.parse(fs.readFileSync('/tmp/persistent-equity-verified/source-hashes.json'));
            for(const [path,h] of Object.entries(expected))if(crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex')!==h.after)throw new Error('Source changed after test: '+path);
            cp.execFileSync('git',['add','-A']);cp.execFileSync('git',['diff','--cached','--check']);
            const base=await github.rest.git.getCommit({owner,repo,commit_sha:parent});
            const names=cp.execFileSync('git',['diff','--cached','--name-only','-z']).toString().split('\0').filter(Boolean),tree=[],sha256={};
            for(const path of names){
              if(!fs.existsSync(path)){tree.push({path,mode:'100644',type:'blob',sha:null});continue;}
              if(!expected[path])throw new Error('Unexpected changed source: '+path);
              const bytes=fs.readFileSync(path),blob=await github.rest.git.createBlob({owner,repo,content:bytes.toString('base64'),encoding:'base64'});
              const check=crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex');
              if(blob.data.sha!==check)throw new Error('Blob mismatch: '+path);
              tree.push({path,mode:'100644',type:'blob',sha:blob.data.sha});sha256[path]=crypto.createHash('sha256').update(bytes).digest('hex');
            }
            const result={parent,baseTree:base.data.tree.sha,tree,sha256,runId:context.runId,branchRefUnchanged:true,productionUnchanged:true};
            fs.writeFileSync('/tmp/persistent-equity-verified/verified-tree.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistent-equity-verified-${{ github.run_id }}
          path: /tmp/persistent-equity-verified/
          retention-days: 7
          if-no-files-found: error
