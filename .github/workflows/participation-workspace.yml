name: Participation Research Workspace
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/participation-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    if: github.head_ref == 'fix/forward-participation'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Capture public forward evidence, no private calls or mutations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/participation-workspace
          git archive HEAD -o /tmp/participation-workspace/source.tar
          base='https://market-sentinel-free.alicia5574188.workers.dev'
          curl -fsS --retry 3 --max-time 20 "$base/api/forward/export" > /tmp/participation-workspace/export-before.json
          curl -fsS --retry 3 --max-time 20 "$base/api/runtime" > /tmp/participation-workspace/runtime-before.json
          curl -fsS --retry 3 --max-time 20 "$base/__health" > /tmp/participation-workspace/health-before.json
          python - <<'PY'
          import json,pathlib,subprocess,urllib.parse
          root=pathlib.Path('/tmp/participation-workspace');cursor=None;items=[];complete=False
          for i in range(24):
              url='https://market-sentinel-free.alicia5574188.workers.dev/api/forward/archive'
              if cursor:url+='?'+urllib.parse.urlencode({'cursor':cursor})
              raw=subprocess.check_output(['curl','-fsS','--retry','2','--max-time','20',url])
              page=json.loads(raw);items+=page['items'];cursor=page['nextCursor']
              if cursor is None:complete=True;break
          (root/'archives.json').write_text(json.dumps({'items':items,'complete':complete,'nextCursor':cursor},ensure_ascii=False))
          print(json.dumps({'packets':len(items),'complete':complete}))
          PY
          date -u +'%Y-%m-%dT%H:%M:%SZ' > /tmp/participation-workspace/time.txt
          git rev-parse HEAD > /tmp/participation-workspace/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: participation-workspace-${{ github.run_id }}
          path: /tmp/participation-workspace/
          retention-days: 7
