name: Validate Capitulation Market State Router
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-capitulation-market-state-router.mjs"
      - ".github/workflows/validate-capitulation-market-state-router.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Check syntax
        run: node --check scripts/research-capitulation-market-state-router.mjs
      - name: Run frozen market state router audit
        run: node --max-old-space-size=4096 scripts/research-capitulation-market-state-router.mjs
      - name: Print result
        run: jq '{decision,events,discoveryShortlist,accepted,gates,baseline:.states.ALL,negativeControls:{broadAccel:.states.BROAD_ACCEL,broadDown:.states.BROAD_DOWN}}' /tmp/capitulation-market-state-router.json
      - uses: actions/upload-artifact@v4
        with:
          name: capitulation-market-state-router
          path: |
            /tmp/capitulation-market-state-router.json
            /tmp/capitulation-market-state-events.json
            /tmp/capitulation-market-state-trades.json
          retention-days: 7
