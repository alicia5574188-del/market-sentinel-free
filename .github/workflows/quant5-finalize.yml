name: Quant5 verified source publisher

on:
  push:
    branches:
      - codex/quant5-sizing-live-continuity-final

permissions:
  contents: write

jobs:
  publish-verified-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/quant5-sizing-live-continuity-final
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply locally verified source
        env:
          VERIFIED_DIFF_B64: 
        run: |
          printf '%s' "$VERIFIED_DIFF_B64" | base64 --decode > "$RUNNER_TEMP/quant5.diff"
          git apply --check "$RUNNER_TEMP/quant5.diff"
          git apply "$RUNNER_TEMP/quant5.diff"

      - run: npm ci
      - run: npm run test:all-regime
      - run: npm run test:direct
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx wrangler deploy --dry-run --config dist/server/wrangler.json

      - name: Publish verified source
        run: |
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add .codex/goal-to-done/DECISIONS.md .codex/goal-to-done/GOAL.md .codex/goal-to-done/STATUS.md README.md lib/arena-live.ts lib/gate-live.ts lib/strategy-arena.ts tests/architecture.test.mjs tests/arena-live.test.ts tests/gate-live.test.ts tests/runtime-faults.test.ts tests/strategy-arena.test.ts worker/index-clean.ts
          git diff --cached --check
          git commit -m "Fix meaningful sizing and continuous LIVE mirroring"
          git push origin HEAD:codex/quant5-sizing-live-continuity-final
