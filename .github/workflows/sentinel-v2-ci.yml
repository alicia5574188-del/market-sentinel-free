name: Sentinel V2 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Keep only the newest validation run for each PR. This does not reduce test
# coverage: every latest PR revision still runs the full suite, while stale
# in-progress revisions are cancelled instead of generating redundant failures.
# Production/main runs are never cancelled by a newer PR revision.
concurrency:
  group: sentinel-v2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Strategy, risk and migration tests
        run: npm run test:signals
      - name: Production build and UI safety tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee ci-ui.log
      - name: Upload UI diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resonance-ui-ci-log
          path: ci-ui.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Wrangler production deploy dry-run
        run: npx wrangler deploy --dry-run --config dist/server/wrangler.json
