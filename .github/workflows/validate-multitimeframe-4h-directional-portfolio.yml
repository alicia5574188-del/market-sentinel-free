name: Validate Multi-timeframe 4h Directional Portfolio
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-multitimeframe-4h-directional-portfolio.mjs"
      - ".github/workflows/validate-multitimeframe-4h-directional-portfolio.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Check syntax
        run: node --check scripts/research-multitimeframe-4h-directional-portfolio.mjs
      - name: Run multi-timeframe 4h directional portfolio
        run: node scripts/research-multitimeframe-4h-directional-portfolio.mjs
      - name: Print focused result
        if: always()
        run: |
          test -f /tmp/multitimeframe-4h-directional-portfolio-report.json && node -e "const r=require('/tmp/multitimeframe-4h-directional-portfolio-report.json'); console.log(JSON.stringify({decision:r.decision,activeSymbols:r.data?.activeSymbols?.length,candidateCount:r.candidateCount,candidateCountBySleeve:r.candidateCountBySleeve,rawBySleeve:r.rawBySleeve,frontier:r.frontier?.map(x=>({fraction:x.base?.fraction,base:x.base&&{avgMonthReturn:x.base.avgMonthReturn,positiveMonths:x.base.positiveMonths,monthsAtLeast5pct:x.base.monthsAtLeast5pct,avgTradesPerDay:x.base.avgTradesPerDay,totalCompounded:x.base.totalCompounded,maxDD:x.base.maxDD,periods:x.base.periods},stress:x.stress&&{avgMonthReturn:x.stress.avgMonthReturn,positiveMonths:x.stress.positiveMonths,monthsAtLeast5pct:x.stress.monthsAtLeast5pct,avgTradesPerDay:x.stress.avgTradesPerDay,totalCompounded:x.stress.totalCompounded,maxDD:x.stress.maxDD,periods:x.stress.periods}}))},null,2))" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multitimeframe-4h-directional-portfolio-report
          path: /tmp/multitimeframe-4h-directional-portfolio-report.json
          if-no-files-found: warn
          retention-days: 7
