name: Copy Coverage and Turnover Public Receipt
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/copy-turnover-production-receipt.yml']
permissions:
  contents: read
jobs:
  receipt:
    if: github.head_ref == 'verify/copy-turnover-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read actual next compressed checkpoint and confirmed-fill readiness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p copy-turnover-receipt
          base='https://market-sentinel-free.alicia5574188.workers.dev'
          ready=0
          for attempt in {1..45};do
            code="$(curl -sS --max-time 12 -o copy-turnover-receipt/health-first.json -w '%{http_code}' "$base/__health" || true)"
            if [[ "$code" == 200 ]] && jq -e '.runtime.buildSha == "01b3093b9807dd3395d40271b7957e68662d53e9" and .runtime.resourceAccounting.policy == "cloudflare-utc-day-v1" and .runtime.resourceAccounting.forwardCompression.encoding == "gzip" and .runtime.forward.lastCycleAt > 1789695391212 and .runtime.forward.storage.error == null and .runtime.liveTurnover.available == true and .runtime.liveTurnover.confirmedFillCount > 0 and .runtime.liveTurnover.hasError == false' copy-turnover-receipt/health-first.json >/dev/null;then ready=1;break;fi
            sleep 10
          done
          [[ "$ready" == 1 ]]
          curl -fsS --retry 2 --max-time 20 "$base/api/runtime" > copy-turnover-receipt/runtime-first.json
          curl -fsS --retry 2 --max-time 20 "$base/api/forward/export" > copy-turnover-receipt/export-first.json
          curl -sS --max-time 20 -o copy-turnover-receipt/private-source-denied.json -w '%{http_code}' "$base/api/live/source?id=verification-no-order" > copy-turnover-receipt/private-source-status.txt
          python - <<'PY'
          import pathlib,json,datetime
          p=pathlib.Path('copy-turnover-receipt');r=json.loads((p/'runtime-first.json').read_text());h=json.loads((p/'health-first.json').read_text())['runtime'];f=r['forward'];m=r['liveMirror'];a=h['resourceAccounting']
          assert r['buildSha']=='01b3093b9807dd3395d40271b7957e68662d53e9'
          assert f['startedAt']==1789556791436 and f['initialEquity']==1000 and f['policyVersion']=='participation-execution-v1.2'
          assert m['source']=='CURRENT_FORWARD_ACCOUNT' and m['newOrdersOnly'] is True
          assert r['liveMode']['requestedEnabled'] is True and m['enabledAt']==1789688633482
          assert f['storage']['error'] is None and f['storage']['persistedAt']>1789695391212
          assert a['day']==datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d')
          assert a['cap']==8000 and a['nonAlarmWrites']<8000
          assert a['previous']['from']=='2026-09-17' and a['previous']['nonAlarmWrites']>=7995
          c=a['forwardCompression'];assert c['encoding']=='gzip' and c['storedBytes']<c['rawBytes']
          assert r.get('live') is None and not any(k in r['liveTurnover'] for k in ['total','opening','closing','systemTagged'])
          assert (p/'private-source-status.txt').read_text()=='401'
          assert m['eligibleCopiedCount']+m['eligibleMissingCount']==m['eligibleSourceCount']
          by={x['id']:x for x in f['positions']};assert set(by)=={x['sourceId'] for x in m['rows']}
          for row in m['rows']:
              if row['eligible']:assert by[row['sourceId']]['openedAt']>m['enabledAt']
          print(json.dumps({'owner':r['liveMode'],'resources':a,'mirror':m,'turnoverStatus':r['liveTurnover']},ensure_ascii=False))
          PY
      - name: Verify six-tab published UI without private values or mutations
        shell: bash
        run: |
          python -m pip install playwright==1.55.0
          python - <<'PY'
          import pathlib,json,shutil
          from playwright.sync_api import sync_playwright
          root=pathlib.Path('copy-turnover-receipt');results=[];chrome=shutil.which('google-chrome') or shutil.which('chromium');assert chrome
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path=chrome,headless=True,args=['--no-sandbox'])
              for width in [320,393,768,1440]:
                  page=b.new_page(viewport={'width':width,'height':900});errors=[];dialogs=[];mutations=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.on('dialog',lambda d:(dialogs.append(d.message),d.dismiss()))
                  def guard(route):
                      if route.request.method not in ['GET','HEAD','OPTIONS']:
                          mutations.append(route.request.method+' '+route.request.url);route.abort()
                      else:route.continue_()
                  page.route('**/*',guard)
                  response=page.goto('https://market-sentinel-free.alicia5574188.workers.dev',wait_until='domcontentloaded',timeout=45000)
                  assert response and response.status==200
                  page.wait_for_selector('.fr-app[data-ui-version="dark-live-v1"]',timeout=25000);page.wait_for_timeout(1500)
                  for name in ['总览','规则','模拟','实盘','演变','系统']:
                      page.locator('nav.fr-nav button').filter(has_text=name).click();page.wait_for_timeout(400)
                      assert page.locator('nav.fr-nav button[aria-current="page"] b').inner_text()==name
                      assert not page.evaluate('document.documentElement.scrollWidth>innerWidth+1'),(width,name)
                      if name=='实盘':
                          page.get_by_text('本次开启后已复制 / 应跟随',exact=True).wait_for(timeout=15000)
                          assert page.get_by_text('应跟随但尚未复制',exact=True).is_visible()
                          assert page.locator('[data-testid="live-turnover"]').count()==0
                          if width in [393,1440]:page.screenshot(path=str(root/f'{width}-public-live-coverage.png'),full_page=True)
                      results.append({'width':width,'tab':name,'pageErrors':list(errors),'dialogs':list(dialogs),'mutationRequests':list(mutations)})
                  assert not errors and not dialogs and not mutations,(errors,dialogs,mutations);page.close()
              b.close()
          (root/'browser-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2));print('24 actual public UI checks passed; no private amounts accessed')
          PY
      - name: Confirm advancing actual execution and analytics receipts
        shell: bash
        run: |
          set -euo pipefail
          base='https://market-sentinel-free.alicia5574188.workers.dev'
          sleep 12
          curl -fsS --retry 2 --max-time 20 "$base/api/runtime" > copy-turnover-receipt/runtime-final.json
          curl -fsS --retry 2 --max-time 20 "$base/__health" > copy-turnover-receipt/health-final.json
          curl -fsS --retry 2 --max-time 20 "$base/api/forward/export" > copy-turnover-receipt/export-final.json
          python - <<'PY'
          import pathlib,json,time
          p=pathlib.Path('copy-turnover-receipt');first=json.loads((p/'runtime-first.json').read_text());r=json.loads((p/'runtime-final.json').read_text());h=json.loads((p/'health-final.json').read_text())['runtime'];m=r['liveMirror'];f=r['forward'];t=r['liveTurnover']
          assert r['liveMode']['requestedEnabled']==first['liveMode']['requestedEnabled']
          assert m['enabledAt']==first['liveMirror']['enabledAt']==1789688633482
          assert h['state']=='LIVE' and h['stale'] is False and h['lastError'] is None and h['lastSuccessAt']>first['lastSuccessAt']
          assert f['storage']['error'] is None and f['lastCycleAt']>1789695391212
          assert t['available'] is True and t['hasError'] is False and t['confirmedFillCount']>0
          a={x['id']:x for x in first['forward']['history']};b={x['id']:x for x in f['history']};common=set(a)&set(b)
          for key in common:assert a[key]==b[key],key
          assert m['eligibleCopiedCount']+m['eligibleMissingCount']==m['eligibleSourceCount']
          summary={'checkedAt':int(time.time()*1000),'build':r['buildSha'],'owner':r['liveMode'],'resources':h['resourceAccounting'],'mirror':m,'turnoverStatus':t,'unchangedClosedRecords':len(common),'paper':{'start':f['startedAt'],'policy':f['policyVersion'],'closed':f['resolved'],'open':len(f['positions']),'equity':f['equity'],'storage':f['storage']},'privateNumericAccountViewed':False,'ownerToggleRequests':0,'directRealTestOrders':0}
          (p/'receipt.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2));print(json.dumps(summary,ensure_ascii=False))
          PY
          date -u +'%Y-%m-%dT%H:%M:%SZ' > copy-turnover-receipt/time.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copy-turnover-production-${{ github.run_id }}
          path: copy-turnover-receipt/
          retention-days: 7
          if-no-files-found: error
