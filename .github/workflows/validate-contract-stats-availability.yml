name: Validate Contract Stats Availability
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-contract-stats-availability.mjs"
      - ".github/workflows/validate-contract-stats-availability.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: node --check scripts/research-contract-stats-availability.mjs
      - run: node scripts/research-contract-stats-availability.mjs | tee /tmp/contract-stats-availability.json
      - uses: actions/upload-artifact@v4
        with:
          name: contract-stats-availability
          path: /tmp/contract-stats-availability.json
          retention-days: 7