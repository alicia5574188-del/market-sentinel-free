name: Validate Turnover Frontier
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-turnover-frontier.mjs"
      - "scripts/research-turnover-adaptive-router.mjs"
      - ".github/workflows/validate-turnover-frontier.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Check syntax
        run: node --check scripts/research-turnover-frontier.mjs
      - name: Run 1x to 5x turnover frontier
        run: node --max-old-space-size=4096 scripts/research-turnover-frontier.mjs
      - name: Print focused result
        run: jq '{decision,question,cost,frontier,staticVerdict,adaptiveVerdict}' /tmp/turnover-frontier-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: turnover-frontier-report
          path: /tmp/turnover-frontier-report.json
          retention-days: 7
