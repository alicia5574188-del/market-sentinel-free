name: Anomaly Clean Lab
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/anomaly-clean-lab.yml"
permissions:
  contents: read
jobs:
  active-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Probe S3-style prefix listings
        run: |
          cat > /tmp/probe.mjs <<'EOF'
          import { writeFileSync } from 'node:fs';
          const months=['202301','202401','202501','202601','202608'];
          const out=[];
          for(const month of months){
            const prefix=`futures_usdt/candlesticks_5m/${month}/`;
            const urls=[
              `https://download.gatedata.org/?list-type=2&prefix=${encodeURIComponent(prefix)}&max-keys=1000`,
              `https://download.gatedata.org/?prefix=${encodeURIComponent(prefix)}&max-keys=1000`,
            ];
            const tries=[];
            for(const url of urls){try{const r=await fetch(url);const text=await r.text();const keys=[...text.matchAll(/<Key>([^<]+)<\/Key>/g)].map(m=>m[1]);const syms=[...new Set(keys.map(k=>k.match(/\/([A-Za-z0-9_\u0080-\uffff]+_USDT)-\d{6}\.csv\.gz$/)?.[1]).filter(Boolean))];tries.push({url,status:r.status,type:r.headers.get('content-type'),length:text.length,keyCount:keys.length,symbolCount:syms.length,symbols:syms.slice(0,100),isTruncated:/<IsTruncated>true<\/IsTruncated>/.test(text),next:text.match(/<NextContinuationToken>([^<]+)<\/NextContinuationToken>/)?.[1]??null,head:text.slice(0,300)});}catch(e){tries.push({url,error:String(e)});}}
            out.push({month,tries});
          }
          writeFileSync('/tmp/prefix-probe.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));
          EOF
          node /tmp/probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gate-prefix-probe
          path: /tmp/prefix-probe.json
          retention-days: 3
