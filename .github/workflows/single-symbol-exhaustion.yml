name: Single Symbol Exhaustion Frontier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Syntax check
        run: node --check scripts/research-single-symbol-exhaustion.mjs
