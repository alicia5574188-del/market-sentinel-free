name: Diagnose Heterogeneous 1h State Direction
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/diagnose-heterogeneous-1h-state-direction.mjs"
      - ".github/workflows/diagnose-heterogeneous-1h-state-direction.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Check syntax
        run: node --check scripts/diagnose-heterogeneous-1h-state-direction.mjs
      - name: Diagnose market-state direction behavior
        run: node scripts/diagnose-heterogeneous-1h-state-direction.mjs
      - name: Print focused result
        if: always()
        run: |
          test -f /tmp/heterogeneous-1h-state-direction.json && node -e "const r=require('/tmp/heterogeneous-1h-state-direction.json'); console.log(JSON.stringify({decision:r.decision,activeSymbols:r.data?.activeSymbols?.length,candidateCount:r.candidateCount,stateCounts:r.stateCounts,stableCount:r.stable?.length,stable:r.stable?.map(x=>({sleeve:x.sleeve,state:x.state,stratum:x.stratum,h:x.h,orientation:x.orientation,calNet:x.calibration.meanNet,valNet:x.validation.meanNet,calMonths:x.calibration.positiveMonths,valMonths:x.validation.positiveMonths}))},null,2))" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heterogeneous-1h-state-direction
          path: /tmp/heterogeneous-1h-state-direction.json
          if-no-files-found: warn
          retention-days: 7
