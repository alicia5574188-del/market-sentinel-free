name: Sentinel CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - sentinel-v2-upgrade-2026-08-26
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Signal and safety tests
        run: npm run test:signals
      - name: Build and UI tests
        run: npm test
