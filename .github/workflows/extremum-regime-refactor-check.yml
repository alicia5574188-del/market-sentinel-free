name: Extremum Regime Stage 1

on:
  push:
    branches: [refactor-20260926]

permissions:
  contents: read

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Strategy core typecheck
        run: npm run typecheck
      - name: Closed-loop strategy tests
        run: node --experimental-strip-types --test tests/extremum-regime-engine.test.ts
      - name: Multi-source input tests
        run: node --experimental-strip-types --test tests/market-data-hub.test.ts
      - name: Cutover continuity tests
        run: node --experimental-strip-types --test --test-name-pattern="strategy migration|summary exposes the extremum regime lifecycle|manual PAPER reset preserves" tests/adaptive-ten-core.test.ts
      - name: Persistent account compatibility
        run: node --experimental-strip-types --test tests/forward-compact-store.test.ts
      - name: Diff integrity
        run: git diff --check
