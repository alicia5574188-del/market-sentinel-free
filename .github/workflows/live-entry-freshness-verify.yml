name: Verify stale live-entry guard

on:
  push:
    branches:
      - chatgpt/live-entry-freshness-guard

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/live-entry-freshness-guard
      - name: Use Node.js 22.15
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Signal and risk tests
        run: npm run test:signals
      - name: Build and UI tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/live-entry-freshness-verify.yml
          git commit -m "Remove one-shot stale-entry verification workflow"
          git push origin HEAD:chatgpt/live-entry-freshness-guard
