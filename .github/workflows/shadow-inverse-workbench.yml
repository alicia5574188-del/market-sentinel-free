name: Shadow inverse isolated workbench
on:
  push:
    branches: [feat/20261001-shadow-inverse]
    paths:
      - scripts/shadow-inverse-refinements.b64
      - .github/workflows/shadow-inverse-workbench.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/20261001-shadow-inverse'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/20261001-shadow-inverse
          fetch-depth: 0
      - name: Validate exact storage refinement and test sources
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path('.')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          payload=''.join((root/'scripts/shadow-inverse-refinements.b64').read_text().split())
          assert sha(payload.encode())=='16c9582e78ffd6273c3365b94262375833ff1e382a22da34912927f4d23ffd63','Transport digest mismatch'
          raw=lzma.decompress(base64.b64decode(payload,validate=True))
          assert sha(raw)=='44568810a02b01e367e93675038412246dd3fce47b3daaf6cd5362bd1d03a0b8','Edit digest mismatch'
          edits=json.loads(raw)
          allowed=set('lib/forward-store.ts tests/shadow-inverse.test.ts research/SHADOW_INVERSE_2026-10-01.md'.split())
          assert len(edits)==3 and {e['path'] for e in edits}==allowed
          ready=[]
          for e in edits:
              p=root/e['path']; prior=p.read_bytes()
              if sha(prior)==e['after']:continue
              assert sha(prior)==e['before'],f"Preimage mismatch: {p}"
              lines=prior.decode().splitlines(keepends=True)
              for i,j,text in reversed(e['edits']):
                  assert 0<=i<=j<=len(lines)
                  lines[i:j]=text.splitlines(keepends=True)
              new=''.join(lines).encode()
              assert sha(new)==e['after'],f"Postimage mismatch: {p}"
              ready.append((p,new))
          for p,new in ready:p.write_bytes(new)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          print(f'All refinement digests verified; {len(ready)} files staged.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Keep dual-ledger active financial state ahead of duplicate closed narratives; verify full source pipeline'
            git push origin HEAD:refs/heads/feat/20261001-shadow-inverse
          fi
          mkdir -p "$RUNNER_TEMP/inverse-checks"
          git rev-parse HEAD | tee "$RUNNER_TEMP/inverse-checks/head.txt"
          git diff 9b8b31532aa01589b7c797388f6c3d5fcac88164 --stat > "$RUNNER_TEMP/inverse-checks/diff-stat.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Strategy, funds, LIVE, member, equity and actual workerd regressions
        run: |
          set -uo pipefail
          failed=0
          for suite in test:direct test:live-parity test:members test:equity test:feed:workerd; do
            npm run "$suite" 2>&1 | tee "$RUNNER_TEMP/inverse-checks/${suite//:/-}.log" || failed=1
          done
          exit "$failed"
      - name: Build, types, lint, architecture and deployment dry-run
        if: always() && steps.apply.outcome == 'success' && steps.install.outcome == 'success'
        run: |
          set -uo pipefail
          failed=0
          for suite in build typecheck lint; do
            npm run "$suite" 2>&1 | tee "$RUNNER_TEMP/inverse-checks/$suite.log" || failed=1
          done
          node --test tests/architecture.test.mjs tests/migration.test.mjs 2>&1 | tee "$RUNNER_TEMP/inverse-checks/architecture.log" || failed=1
          git diff --check || failed=1
          npx wrangler deploy --dry-run --config dist/server/wrangler.json 2>&1 | tee "$RUNNER_TEMP/inverse-checks/dry-run.log" || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-inverse-checks
          path: ${{ runner.temp }}/inverse-checks
          retention-days: 3
