name: One-shot PAPER reset 2026-09-22

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/paper-reset-once-20260922.yml"

permissions:
  contents: read

env:
  WORKER_BASE_URL: https://market-sentinel-free.alicia5574188.workers.dev
  WRANGLER_SEND_METRICS: "false"
  RESET_WORKER_NAME: market-sentinel-paper-reset-once

jobs:
  reset-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci

      - name: Wait for this exact production build and confirm LIVE OFF
        run: |
          set -euo pipefail
          ready=0
          for attempt in {1..90}; do
            code="$(curl -sS --max-time 12 -o "$RUNNER_TEMP/health-before.json" -w '%{http_code}' "$WORKER_BASE_URL/__health" || true)"
            if [[ "$code" == "200" || "$code" == "503" ]]; then
              if jq -e --arg sha "$GITHUB_SHA" '
                .runtime.buildSha == $sha and
                .runtime.liveMode.requestedEnabled == false and
                .runtime.liveMode.operational == false
              ' "$RUNNER_TEMP/health-before.json" >/dev/null; then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          [[ "$ready" == "1" ]]
          jq -c '{buildSha:.runtime.buildSha,state:.runtime.state,stale:.runtime.stale,liveMode:.runtime.liveMode,
            forward:{startedAt:.runtime.forward.startedAt,initialEquity:.runtime.forward.initialEquity,
              balance:.runtime.forward.balance,equity:.runtime.forward.equity,
              positions:(.runtime.forward.positions|length),history:(.runtime.forward.history|length),
              resolved:.runtime.forward.resolved,netPnl:.runtime.forward.netPnl}}' "$RUNNER_TEMP/health-before.json"

      - name: Deploy isolated reset bridge and reset PAPER
        run: |
          set -euo pipefail
          mkdir -p .ops-reset
          cat > .ops-reset/paper-reset-once.mjs <<'JS'
          export default {
            async fetch(_request, env) {
              const stub = env.MARKET_STREAM.getByName("primary");
              return stub.fetch("https://market-stream/paper-reset", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: "{}",
              });
            },
          };
          JS
          cat > .ops-reset/wrangler.toml <<EOF
          name = "$RESET_WORKER_NAME"
          main = "paper-reset-once.mjs"
          compatibility_date = "2026-09-22"
          workers_dev = true

          [[durable_objects.bindings]]
          name = "MARKET_STREAM"
          class_name = "MarketStream"
          script_name = "market-sentinel-free"
          EOF
          cleanup() {
            npx wrangler delete --config .ops-reset/wrangler.toml --force >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx wrangler deploy --config .ops-reset/wrangler.toml

          reset_url="https://$RESET_WORKER_NAME.alicia5574188.workers.dev/"
          code=""
          for attempt in {1..12}; do
            code="$(curl -sS --max-time 30 -X POST -o "$RUNNER_TEMP/reset-result.json" -w '%{http_code}' "$reset_url" || true)"
            if [[ -s "$RUNNER_TEMP/reset-result.json" ]]; then
              jq -c 'if .ok == true then {ok,equity,forward:{startedAt:.forward.startedAt,
                initialEquity:.forward.initialEquity,balance:.forward.balance,equity:.forward.equity,
                positions:(.forward.positions|length),history:(.forward.history|length),
                resolved:.forward.resolved,netPnl:.forward.netPnl}} else {ok,error} end'                 "$RUNNER_TEMP/reset-result.json" || true
            fi
            if [[ "$code" == "200" ]] && jq -e '
              .ok == true and .equity == 1000 and
              .forward.initialEquity == 1000 and .forward.balance == 1000 and
              (.forward.positions | length) == 0 and
              (.forward.history | length) == 0 and
              .forward.resolved == 0 and .forward.netPnl == 0
            ' "$RUNNER_TEMP/reset-result.json" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "reset_http=$code"
          cat "$RUNNER_TEMP/reset-result.json" || true
          exit 1

      - name: Verify reset generation and LIVE remains OFF
        run: |
          set -euo pipefail
          ok=0
          for attempt in {1..18}; do
            code="$(curl -sS --max-time 10 -o "$RUNNER_TEMP/health-after.json" -w '%{http_code}' "$WORKER_BASE_URL/__health" || true)"
            if [[ "$code" == "200" || "$code" == "503" ]]; then
              if jq -e '
                .runtime.liveMode.requestedEnabled == false and
                .runtime.liveMode.operational == false and
                .runtime.forward.initialEquity == 1000 and
                .runtime.forward.resolved == 0 and
                (.runtime.forward.history | length) == 0
              ' "$RUNNER_TEMP/health-after.json" >/dev/null; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          [[ "$ok" == "1" ]]
          jq -c '{state:.runtime.state,stale:.runtime.stale,liveMode:.runtime.liveMode,
            forward:{startedAt:.runtime.forward.startedAt,initialEquity:.runtime.forward.initialEquity,
              balance:.runtime.forward.balance,equity:.runtime.forward.equity,
              positions:(.runtime.forward.positions|length),history:(.runtime.forward.history|length),
              resolved:.runtime.forward.resolved,netPnl:.runtime.forward.netPnl}}' "$RUNNER_TEMP/health-after.json"
