name: Audit live winding entry

on:
  push:
    branches: ["fix/winding-anchor-space-20260922"]
    paths:
      - ".github/workflows/audit-winding-entry.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect live winding candidates
        run: |
          set -euo pipefail
          url="https://market-sentinel-free.alicia5574188.workers.dev/api/forward/export"
          for attempt in {1..8}; do
            curl -fsS --max-time 15 "$url" > "$RUNNER_TEMP/forward.json"
            jq -c '{
              exportedAt,
              forward:{
                startedAt:.forward.startedAt,
                lastCycleAt:.forward.lastCycleAt,
                updatedAt:.forward.updatedAt,
                openCount:(.forward.positions|length),
                resolved:.forward.resolved,
                entryDiagnostics:.forward.entryDiagnostics,
                candidateCount:(.forward.entryOpportunities|length),
                v3Count:([.forward.entryOpportunities[]|select(.version=="winding-anchor-entry-v3")]|length),
                eligibleCount:([.forward.entryOpportunities[]|select(.version=="winding-anchor-entry-v3" and .eligible==true)]|length),
                candidates:[.forward.entryOpportunities[]|select(.version=="winding-anchor-entry-v3")|{
                  symbol,timeframe,side,score,eligible,anchorPrice,distanceFromAnchorRate,
                  targetPrice,targetType,targetDistanceRate,edgeRatio,netRemainingSpaceRate,reason
                }]
              }
            }' "$RUNNER_TEMP/forward.json"
            if jq -e '.forward.entryOpportunities | any(.version=="winding-anchor-entry-v3")' "$RUNNER_TEMP/forward.json" >/dev/null; then
              exit 0
            fi
            sleep 15
          done
          exit 0
