name: Extremum Regime Refactor Check

on:
  push:
    branches: [refactor-20260926]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:direct
      - run: npm run test:live-parity
      - run: npm run build
      - run: git diff --check
