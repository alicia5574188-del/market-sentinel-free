name: Verify Current PAPER LIVE Parity
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/live-parity-transfer-*.b64'
      - 'scripts/live-parity-apply-release.py'
      - '.github/workflows/live-parity-stage.yml'
permissions:
  contents: write
jobs:
  stage:
    if: github.head_ref == 'feat/forward-live-parity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply exact SHA256-verified local edits
        run: python scripts/live-parity-apply-release.py
      - name: Remove all temporary transfer and workspace files
        run: git rm --ignore-unmatch scripts/live-parity-transfer-*.b64 scripts/live-parity-apply-release.py .github/workflows/live-parity-stage.yml .github/workflows/live-parity-workspace.yml
      - name: Independently verify actual Worker using fake Gate only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/live-parity-verification
          npm ci 2>&1 | tee /tmp/live-parity-verification/install.log
          npm run test:live-parity 2>&1 | tee /tmp/live-parity-verification/parity.log
          npm run test:direct 2>&1 | tee /tmp/live-parity-verification/direct.log
          npm test 2>&1 | tee /tmp/live-parity-verification/test-build.log
          npm run typecheck 2>&1 | tee /tmp/live-parity-verification/typecheck.log
          npm run lint 2>&1 | tee /tmp/live-parity-verification/lint.log
          npx wrangler deploy --dry-run --config dist/server/wrangler.json 2>&1 | tee /tmp/live-parity-verification/dry-run.log
          git diff --check
          git add -A
          git diff --cached --check
      - name: Read public owner intent only, no session or Gate access
        run: |
          curl -fsS --retry 2 --max-time 20 'https://market-sentinel-free.alicia5574188.workers.dev/__health' > /tmp/live-parity-verification/health-before.json
          jq -e '.runtime.liveMode.requestedEnabled == false' /tmp/live-parity-verification/health-before.json >/dev/null
      - name: Store verified content blobs only; authorized connector handles trees and refs
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');
            const {owner,repo}=context.repo;
            const parent=context.payload.pull_request.head.sha;
            const branch=context.payload.pull_request.head.ref;
            const current=await github.rest.repos.getBranch({owner,repo,branch});
            if(current.data.commit.sha!==parent)throw new Error('Head changed during verification');
            const base=await github.rest.git.getCommit({owner,repo,commit_sha:parent});
            const names=cp.execFileSync('git',['diff','--cached','--name-only','-z']).toString().split('\0').filter(Boolean);
            const tree=[],sha256={};
            for(const path of names){
              if(!fs.existsSync(path)){tree.push({path,mode:'100644',type:'blob',sha:null});continue;}
              const bytes=fs.readFileSync(path);
              const blob=await github.rest.git.createBlob({owner,repo,content:bytes.toString('base64'),encoding:'base64'});
              const expected=crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex');
              if(blob.data.sha!==expected)throw new Error('Blob mismatch: '+path);
              tree.push({path,mode:'100644',type:'blob',sha:blob.data.sha});
              sha256[path]=crypto.createHash('sha256').update(bytes).digest('hex');
            }
            const evidence={parent,baseTree:base.data.tree.sha,tree,sha256,runId:context.runId,branchRefUnchanged:true,productionUnchanged:true};
            fs.writeFileSync('/tmp/live-parity-verification/verified-tree-elements.json',JSON.stringify(evidence,null,2));
            console.log('VERIFIED_TREE_ELEMENTS='+JSON.stringify(evidence));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-parity-verified-${{ github.run_id }}
          path: /tmp/live-parity-verification/
          retention-days: 7
          if-no-files-found: warn
