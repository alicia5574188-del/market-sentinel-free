name: Snapshot diagnostics workspace
on:
  push:
    branches: [diagnostics/snapshot-v2-20260930]
    paths: [.github/workflows/snapshot-workspace.yml]
permissions:
  contents: write
jobs:
  verify-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Apply hash-verified source edits on feature branch only
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/diagnostics/snapshot-v2-20260930'
          python3 - <<'PY'
          import base64,gzip,json,hashlib,pathlib
          parts=[pathlib.Path('.snapshot-edits.'+name+'.txt').read_text().strip() for name in ['1a','1b','2a','2b']]
          # Remove one duplicated transport segment; the full bundle hash is mandatory.
          c=parts[2]
          if 'X9zyIRuO7' in c:
              c=c[:c.index('X9zyIRuO7')+6]+c[c.index('X9zyIRGb')+6:]
          parts[2]=c
          data=''.join(parts)
          print('Chunk lengths:',[len(p) for p in parts])
          print('Bundle SHA256:',hashlib.sha256(data.encode()).hexdigest())
          assert hashlib.sha256(data.encode()).hexdigest()=='ce52738b52f44b03263188662da309ac15cd4a0a7f3d7bdb12f261bcfedc1145'
          edits=json.loads(gzip.decompress(base64.b64decode(data)))
          allowed={'app/forward-dashboard.tsx','lib/forward-relations.ts','lib/forward-store.ts','lib/market-intelligence-research.ts','lib/market-intelligence-shadow-research.ts','lib/research-snapshot.ts','lib/review-trace.ts','package.json','tests/architecture.test.mjs','tests/frontend-density.test.mjs','tests/research-snapshot-v2.test.ts','vite.config.ts','worker/index-clean.ts'}
          assert set(edits)==allowed
          for name,spec in edits.items():
              path=pathlib.Path(name)
              old=path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None)==spec['before'],name
              lines=(old.decode() if old is not None else '').splitlines(True)
              for start,end,text in reversed(spec['edits']):lines[start:end]=[text]
              content=''.join(lines).encode()
              assert hashlib.sha256(content).hexdigest()==spec['after'],name
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(content)
          pathlib.Path('/tmp/snapshot-paths').write_text('\n'.join(sorted(allowed)))
          print('Applied 13 hash-verified source files; no account data or secrets used.')
          PY
      - run: npm ci
      - name: Full verification
        shell: bash
        run: |
          set -euo pipefail
          for command in 'npm run test:direct' 'npm run test:live-parity' 'npm run test:members' 'npm run test:equity' 'npm run test:feed:workerd' 'npm run build' 'npm run typecheck' 'npm run lint' 'node --test tests/architecture.test.mjs tests/migration.test.mjs' 'git diff --check'; do
            echo "CHECK: $command"
            if bash -c "$command" > /tmp/snapshot-check.log 2>&1; then
              echo 'PASS'
            else
              grep -n -E 'error TS|error|not ok|FAIL|AssertionError' /tmp/snapshot-check.log | head -35 | cut -c1-350 || true
              tail -35 /tmp/snapshot-check.log | cut -c1-350
              exit 1
            fi
          done
      - name: Commit tested source to feature branch, never main
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < /tmp/snapshot-paths
          git add -- "${paths[@]}"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add scoped read-only review snapshot and bounded causal diagnostics'
          git push origin HEAD:diagnostics/snapshot-v2-20260930
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)"
