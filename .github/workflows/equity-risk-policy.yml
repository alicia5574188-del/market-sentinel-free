name: Equity-scaled risk policy migration

on:
  push:
    branches:
      - chatgpt/equity-scaled-risk-policy

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/equity-scaled-risk-policy
      - name: Apply policy patch
        run: python scripts/apply-equity-risk-policy.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Already patched"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Scale all monetary risk limits with account equity"
            git push origin HEAD:chatgpt/equity-scaled-risk-policy
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
          cache: npm
      - run: npm ci
      - name: Audit legacy fixed-USDT runtime references
        run: |
          if grep -R -n -E 'settings\.(maxRiskPerAlertUsdt|dailyPauseUsdt|maxDrawdownUsdt)' app lib worker; then exit 1; fi
          if grep -n -E 'maxRiskPerAlertUsdt|dailyPauseUsdt|maxDrawdownUsdt' app/page.tsx; then exit 1; fi
      - run: npm run test:signals
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
