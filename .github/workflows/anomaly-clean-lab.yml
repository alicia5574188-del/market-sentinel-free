name: Anomaly Clean Lab
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/anomaly-clean-lab.yml"
permissions:
  contents: read
jobs:
  active-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Probe archive indexes and current Gate catalog
        run: |
          cat > /tmp/probe.mjs <<'EOF'
          import { writeFileSync } from 'node:fs';
          const months=['202301','202401','202501','202601','202608'];
          const archives=[];
          for(const month of months){
            const url=`https://download.gatedata.org/futures_usdt/candlesticks_5m/${month}/`;
            try{
              const r=await fetch(url);
              const text=await r.text();
              const symbols=[...text.matchAll(/([A-Z0-9_]+_USDT)-\d{6}\.csv\.gz/g)].map(m=>m[1]);
              archives.push({month,status:r.status,contentType:r.headers.get('content-type'),length:text.length,symbolCount:new Set(symbols).size,symbols:[...new Set(symbols)].sort().slice(0,200),head:text.slice(0,500)});
            }catch(error){archives.push({month,error:String(error)});}
          }
          let current={};
          try{
            const [cr,tr]=await Promise.all([
              fetch('https://api.gateio.ws/api/v4/futures/usdt/contracts'),
              fetch('https://api.gateio.ws/api/v4/futures/usdt/tickers')]);
            const contracts=await cr.json(),tickers=await tr.json();
            current={contractStatus:cr.status,tickerStatus:tr.status,contractCount:Array.isArray(contracts)?contracts.length:0,tickerCount:Array.isArray(tickers)?tickers.length:0,
              sampleContracts:Array.isArray(contracts)?contracts.slice(0,5):contracts,
              topByVolume:Array.isArray(tickers)?tickers.map(x=>({contract:x.contract,volume_24h_usd:Number(x.volume_24h_usd??0)})).sort((a,b)=>b.volume_24h_usd-a.volume_24h_usd).slice(0,40):[]};
          }catch(error){current={error:String(error)};}
          const out={archives,current};writeFileSync('/tmp/archive-probe.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));
          EOF
          node /tmp/probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gate-archive-universe-probe
          path: /tmp/archive-probe.json
          retention-days: 3
