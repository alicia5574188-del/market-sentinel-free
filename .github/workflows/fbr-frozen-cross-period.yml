name: FBR Frozen Cross Period

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-fbr-frozen-replay.mjs"
      - "research/frozen-fbr-rank123.json"
      - ".github/workflows/fbr-frozen-cross-period.yml"

permissions:
  contents: read

jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: current19
            months: 202509,202510,202511,202512,202601,202602,202603,202604,202605,202606,202607,202608
            min_contracts: 19
            min_coverage: 0.98
          - profile: backward19
            months: 202409,202410,202411,202412,202501,202502,202503,202504,202505,202506,202507,202508
            min_contracts: 19
            min_coverage: 0.92
          - profile: backward12
            months: 202409,202410,202411,202412,202501,202502,202503,202504,202505,202506,202507,202508
            min_contracts: 12
            min_coverage: 0.98
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Syntax check
        run: node --check scripts/research-fbr-frozen-replay.mjs
      - name: Fetch 12-month Gate 5m universe
        env:
          RESEARCH_INTERVAL: 5m
          RESEARCH_DATASET: /tmp/fbr-${{ matrix.profile }}.json
          RESEARCH_MONTHS: ${{ matrix.months }}
          RESEARCH_SYMBOLS: BTC_USDT,ETH_USDT,SOL_USDT,XRP_USDT,BNB_USDT,DOGE_USDT,ADA_USDT,LINK_USDT,LTC_USDT,AVAX_USDT,BCH_USDT,SUI_USDT,UNI_USDT,FIL_USDT,AAVE_USDT,ARB_USDT,APT_USDT,PEPE_USDT,WLD_USDT
          RESEARCH_MIN_CONTRACTS: ${{ matrix.min_contracts }}
          RESEARCH_MIN_MONTH_COVERAGE: ${{ matrix.min_coverage }}
          RESEARCH_CONCURRENCY: 16
        run: node scripts/fetch-gate-history.mjs
      - name: Replay exact frozen FBR lanes
        env:
          RESEARCH_DATASET: /tmp/fbr-${{ matrix.profile }}.json
          RESEARCH_CONFIG: research/frozen-fbr-rank123.json
          RESEARCH_OUTPUT: /tmp/fbr-frozen-${{ matrix.profile }}.json
        run: node scripts/research-fbr-frozen-replay.mjs
      - name: Print result
        run: jq '{period,universe,minCross,frozenLaneCount,raw,unique,overlapRate,monthly,rankSummary,note}' /tmp/fbr-frozen-${{ matrix.profile }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: fbr-frozen-${{ matrix.profile }}
          path: /tmp/fbr-frozen-${{ matrix.profile }}.json
          retention-days: 7
