name: Sentinel CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - sentinel-v2-upgrade-2026-08-26
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Legacy signal suite (advisory until stale baseline assertion is retired)
        continue-on-error: true
        run: npm run test:signals
      - name: Sentinel V2 required safety gates
        run: >-
          node --experimental-strip-types --test
          tests/sentinel-v2-engine.test.ts
          tests/sentinel-v2-migration.test.mjs
          tests/live-entry-freshness.test.ts
          tests/live-deployment-safety.test.ts
          tests/live-portfolio-risk.test.ts
          tests/live-performance-gate.test.ts
          tests/gate-futures-only-permission.test.ts
          tests/gate-position-mode.test.ts
          tests/live-isolated-available.test.ts
      - name: Build and UI tests
        run: npm test
