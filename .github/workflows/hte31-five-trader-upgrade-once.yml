name: HTE31 Five Trader Upgrade Once

on:
  push:
    branches: [feature/hte31-five-trader-reversal-intelligence]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - name: Apply deterministic HTE31 upgrade
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          # Domain types: preserve the existing three base traders while adding two
          # independent strategy IDs and explicit per-timeframe structure inputs.
          replace_once("lib/hte31-types.ts",
              '  multiTimeframeTrend: number | null;\n  benchmarkMomentum: number | null;\n  macroEventRisk: number | null;',
              '  multiTimeframeTrend: number | null;\n  timeframeTrend15m: number | null;\n  timeframeTrend1h: number | null;\n  timeframeTrend4h: number | null;\n  benchmarkMomentum: number | null;\n  optionsIvPercentile: number | null;\n  macroEventRisk: number | null;')
          replace_once("lib/hte31-types.ts",
              'export type Hte31StrategyId = "trend_breakout" | "trend_pullback" | "failed_breakout";',
              'export type Hte31StrategyId = "trend_breakout" | "trend_pullback" | "failed_breakout" | "trend_exhaustion_reversal" | "higher_timeframe_swing";')

          # D1 columns are unconstrained TEXT; widening the Drizzle TypeScript enum
          # needs no destructive or remote schema migration.
          schema = read("db/hte31-schema.ts")
          old_enum = 'enum: ["dennis_trend", "raschke_pullback", "turtle_soup"]'
          if schema.count(old_enum) < 3:
              raise SystemExit("expected three HTE31 trader enum declarations")
          schema = schema.replace(old_enum, 'enum: ["dennis_trend", "raschke_pullback", "turtle_soup", "exhaustion_reversal", "higher_timeframe_swing"]')
          write("db/hte31-schema.ts", schema)

          # Expose individual 15m/1h/4h structure and use short position-monitoring
          # candles. Existing composite trend stays for HT1-HT3 compatibility.
          replace_once("lib/gate-client.ts",
              '  multiTimeframeTrend: number | null;\n  macroEventRisk: number | null;',
              '  multiTimeframeTrend: number | null;\n  timeframeTrend15m: number | null;\n  timeframeTrend1h: number | null;\n  timeframeTrend4h: number | null;\n  macroEventRisk: number | null;')
          replace_once("lib/gate-client.ts",
              '  candleTime: number | null;\n  volumeUsd: number;',
              '  candleTime: number | null;\n  recentCandles?: Candle[];\n  volumeUsd: number;')
          gate = read("lib/gate-client.ts")
          marker = 'function benchmarkChange(...payloads: unknown[]) {'
          if marker not in gate:
              raise SystemExit("gate-client insertion marker missing")
          helper = '''export function computeTimeframeTrends(payloads: unknown[], observedAt?: number) {\n  const intervalsMs = [15 * 60_000, 60 * 60_000, 4 * 60 * 60_000];\n  const values = payloads.slice(0, 3).map((payload, index) => {\n    const parsed = parseCandles(payload);\n    const completed = observedAt == null ? parsed : parsed.filter((candle) => {\n      const startedAt = candle.time > 10_000_000_000 ? candle.time : candle.time * 1000;\n      return startedAt + intervalsMs[index] <= observedAt;\n    });\n    return timeframeTrend(completed);\n  });\n  return {\n    trend15m: values[0] ?? null,\n    trend1h: values[1] ?? null,\n    trend4h: values[2] ?? null,\n  };\n}\n\n'''
          gate = gate.replace(marker, helper + marker, 1)
          gate = gate.replace(
              '    const multiTimeframeTrend = computeMultiTimeframeTrend([data.candles15m, data.candles1h, data.candles4h], observedAt);',
              '    const multiTimeframeTrend = computeMultiTimeframeTrend([data.candles15m, data.candles1h, data.candles4h], observedAt);\n    const timeframeTrends = computeTimeframeTrends([data.candles15m, data.candles1h, data.candles4h], observedAt);', 1)
          gate = gate.replace(
              '        multiTimeframeTrend,\n        macroEventRisk:',
              '        multiTimeframeTrend,\n        timeframeTrend15m: timeframeTrends.trend15m,\n        timeframeTrend1h: timeframeTrends.trend1h,\n        timeframeTrend4h: timeframeTrends.trend4h,\n        macroEventRisk:', 1)
          gate = gate.replace('interval=5m&limit=2', 'interval=10s&limit=4', 1)
          gate = gate.replace(
              '      const candle = candleResult.status === "fulfilled" ? parseCandles(candleResult.value).at(-1) : null;',
              '      const recentCandles = candleResult.status === "fulfilled" ? parseCandles(candleResult.value) : [];\n      const candle = recentCandles.at(-1) ?? null;', 1)
          gate = gate.replace(
              '        candleTime: candle?.time ?? null,\n        volumeUsd:',
              '        candleTime: candle?.time ?? null,\n        recentCandles,\n        volumeUsd:', 1)
          write("lib/gate-client.ts", gate)

          # Scanner: real macro/IV context, five independent signals, explicit
          # timeframe conflict. HT1-HT3 retain their original evaluator.
          scanner = read("lib/hte31-scanner.ts")
          scanner = scanner.replace(
              'import { evaluateHumanTraderPool } from "./hte31-human-trader-engine.ts";',
              'import { evaluateHumanTraderPool } from "./hte31-human-trader-engine.ts";\nimport { evaluateAdvancedHumanTraders } from "./hte31-advanced-traders.ts";\nimport { getGlobalRiskContext } from "./global-risk.ts";', 1)
          old_deep = '''    const packet = await analyzeGateSymbol(job.target.symbol, {\n      global: {\n        benchmarkMomentum: job.market.benchmarkMomentum,\n        macroEventRisk: null,\n        macroEventLabel: null,\n        optionsIvPercentile: null,\n        etfFlowScore: null,\n      },'''
          new_deep = '''    const globalRisk = await getGlobalRiskContext();\n    const packet = await analyzeGateSymbol(job.target.symbol, {\n      global: {\n        benchmarkMomentum: globalRisk.benchmarkMomentum ?? job.market.benchmarkMomentum,\n        macroEventRisk: globalRisk.macroEventRisk,\n        macroEventLabel: globalRisk.macroEventLabel,\n        optionsIvPercentile: globalRisk.optionsIvPercentile,\n        etfFlowScore: globalRisk.etfFlowScore,\n      },'''
          if old_deep not in scanner:
              raise SystemExit("scanner deep block missing")
          scanner = scanner.replace(old_deep, new_deep, 1)
          scanner = scanner.replace('    const signals = evaluateHumanTraderPool({', '    const baseSignals = evaluateHumanTraderPool({', 1)
          insertion = '''    const advancedSignals = evaluateAdvancedHumanTraders({\n      symbol: packet.symbol,\n      observedAt: packet.observedAt,\n      futuresPrice: packet.market.futuresPrice,\n      volumeUsd: packet.market.volumeUsd,\n      changePercentage: packet.market.changePercentage,\n      fundingRate: packet.market.fundingRate,\n      openInterestChangePct: packet.market.openInterestChangePct,\n      spotCvdRatio: packet.market.spotCvdRatio,\n      orderBookImbalance: packet.market.orderBookImbalance,\n      liquidationImbalance: packet.market.liquidationImbalance,\n      multiTimeframeTrend: packet.market.multiTimeframeTrend,\n      timeframeTrend15m: packet.market.timeframeTrend15m,\n      timeframeTrend1h: packet.market.timeframeTrend1h,\n      timeframeTrend4h: packet.market.timeframeTrend4h,\n      benchmarkMomentum: job.market.benchmarkMomentum,\n      optionsIvPercentile: packet.market.optionsIvPercentile,\n      macroEventRisk: packet.market.macroEventRisk,\n      dataQuality: packet.decision.dataQuality,\n      candles5m: job.candles,\n      crossSectionRank: crossSectionRank(job.universe, packet.symbol),\n      rotationVelocity: 0,\n      marketAdvancingRatio: job.market.advancingRatio,\n      marketDecliningRatio: job.market.decliningRatio,\n    });\n    const signals = [...baseSignals, ...advancedSignals];\n'''
          record_marker = '    await recordHte31Evaluations(packet, signals);'
          if record_marker not in scanner:
              raise SystemExit("scanner record marker missing")
          scanner = scanner.replace(record_marker, insertion + record_marker, 1)
          # Base traders now also receive the explicit fields (unused by them but
          # keeps one complete input contract and makes diagnostics reproducible).
          scanner = scanner.replace(
              '      multiTimeframeTrend: packet.market.multiTimeframeTrend,\n      benchmarkMomentum: job.market.benchmarkMomentum,\n      macroEventRisk:',
              '      multiTimeframeTrend: packet.market.multiTimeframeTrend,\n      timeframeTrend15m: packet.market.timeframeTrend15m,\n      timeframeTrend1h: packet.market.timeframeTrend1h,\n      timeframeTrend4h: packet.market.timeframeTrend4h,\n      benchmarkMomentum: job.market.benchmarkMomentum,\n      optionsIvPercentile: packet.market.optionsIvPercentile,\n      macroEventRisk:', 1)
          write("lib/hte31-scanner.ts", scanner)

          # Paper sizing: 1R is now the NET loss at the structural stop including
          # configured round-trip cost, instead of price loss with fees added later.
          sizing = read("lib/hte31-position-sizing.ts")
          old_sizing = '''  const desiredNotionalUsdt = targetRiskUsdt / stopDistanceRate;\n  const requiredLeverage = Math.max(1, Math.ceil(desiredNotionalUsdt / marginCap));\n  const leverage = clamp(requiredLeverage, 1, leverageCap);\n  const notionalUsdt = Math.min(desiredNotionalUsdt, marginCap * leverage);\n  const marginUsdt = notionalUsdt / leverage;\n  const quantity = notionalUsdt / entryPrice;\n  const plannedRiskUsdt = notionalUsdt * stopDistanceRate;\n\n  const roundTripCostRate = Math.max(0, Number.isFinite(input.roundTripCostBps) ? input.roundTripCostBps : 0) / 10_000;'''
          new_sizing = '''  const roundTripCostRate = Math.max(0, Number.isFinite(input.roundTripCostBps) ? input.roundTripCostBps : 0) / 10_000;\n  const netStopLossRate = stopDistanceRate + roundTripCostRate;\n  const desiredNotionalUsdt = targetRiskUsdt / netStopLossRate;\n  const requiredLeverage = Math.max(1, Math.ceil(desiredNotionalUsdt / marginCap));\n  const leverage = clamp(requiredLeverage, 1, leverageCap);\n  const notionalUsdt = Math.min(desiredNotionalUsdt, marginCap * leverage);\n  const marginUsdt = notionalUsdt / leverage;\n  const quantity = notionalUsdt / entryPrice;\n  const plannedRiskUsdt = notionalUsdt * netStopLossRate;'''
          if old_sizing not in sizing:
              raise SystemExit("paper sizing block missing")
          sizing = sizing.replace(old_sizing, new_sizing, 1)
          sizing = sizing.replace('let reason = `计划风险 ${plannedRiskUsdt.toFixed(2)}U，TP2预计净利润', 'let reason = `计划净风险(含费用) ${plannedRiskUsdt.toFixed(2)}U，TP2预计净利润', 1)
          write("lib/hte31-position-sizing.ts", sizing)

          # Repository: five trader guards, scratch-aware learning, and time-ordered
          # TP1 protection that never retroactively uses an earlier candle low/high.
          repo = read("lib/hte31-repository.ts")
          repo = repo.replace(
              'import type { HumanTraderId } from "./hte31-human-trader-engine.ts";',
              'import type { HumanTraderId } from "./hte31-human-trader-engine.ts";\nimport type { AdvancedTraderId } from "./hte31-advanced-traders.ts";\n\ntype Hte31TraderId = HumanTraderId | AdvancedTraderId;', 1)
          repo = repo.replace(
              'const TRADERS: HumanTraderId[] = ["dennis_trend", "raschke_pullback", "turtle_soup"];',
              'const TRADERS: Hte31TraderId[] = ["dennis_trend", "raschke_pullback", "turtle_soup", "exhaustion_reversal", "higher_timeframe_swing"];', 1)
          repo = repo.replace('function traderIdForSignal(signal: Hte31Signal): HumanTraderId | null {', 'function traderIdForSignal(signal: Hte31Signal): Hte31TraderId | null {', 1)
          repo = repo.replace('  if (signal.strategyId === "failed_breakout") return "turtle_soup";\n  return null;', '  if (signal.strategyId === "failed_breakout") return "turtle_soup";\n  if (signal.strategyId === "trend_exhaustion_reversal") return "exhaustion_reversal";\n  if (signal.strategyId === "higher_timeframe_swing") return "higher_timeframe_swing";\n  return null;', 1)
          repo = repo.replace('function learningIdFor(traderId: HumanTraderId,', 'function learningIdFor(traderId: Hte31TraderId,', 1)
          repo = repo.replace('Record<HumanTraderId, Hte31TraderGuard>', 'Record<Hte31TraderId, Hte31TraderGuard>')
          repo = repo.replace('traderId: HumanTraderId }', 'traderId: Hte31TraderId }')
          helper_marker = 'export type Hte31TraderGuard = {'
          failure_helper = '''function isHte31FailureLoss(row: { netPnlUsdt: number | null; exitCode: string | null }) {\n  return (row.netPnlUsdt ?? 0) < 0 && row.exitCode !== "breakeven";\n}\n\n'''
          repo = repo.replace(helper_marker, failure_helper + helper_marker, 1)
          repo = repo.replace('if ((row.netPnlUsdt ?? 0) < 0) lossStreak += 1;', 'if (isHte31FailureLoss(row)) lossStreak += 1;', 1)
          repo = repo.replace('    if ((row.netPnlUsdt ?? 0) < 0) {', '    if (isHte31FailureLoss(row)) {', 1)
          repo = repo.replace(
              'async function updateLearningAfterClose(trade: typeof hte31Trades.$inferSelect, netPnlUsdt: number, mfePct: number, maePct: number, now: number) {',
              'async function updateLearningAfterClose(trade: typeof hte31Trades.$inferSelect, netPnlUsdt: number, mfePct: number, maePct: number, now: number, exitCode: string | null, target1Hit: boolean) {', 1)
          repo = repo.replace(
              '  const r = trade.riskBudgetUsdt > 0 ? netPnlUsdt / trade.riskBudgetUsdt : 0;\n  const riskPct =',
              '  const r = trade.riskBudgetUsdt > 0 ? netPnlUsdt / trade.riskBudgetUsdt : 0;\n  const protectedScratch = exitCode === "breakeven" || (target1Hit && r > -0.35);\n  const countedLoss = netPnlUsdt < 0 && !protectedScratch;\n  const riskPct =', 1)
          repo = repo.replace('      losses: netPnlUsdt < 0 ? 1 : 0,', '      losses: countedLoss ? 1 : 0,', 1)
          repo = repo.replace('    losses: existing.losses + (netPnlUsdt < 0 ? 1 : 0),', '    losses: existing.losses + (countedLoss ? 1 : 0),', 1)
          repo = repo.replace(
              '    await updateLearningAfterClose(trade, netPnlUsdt, excursion.mfe, excursion.mae, quote.observedAt);',
              '    await updateLearningAfterClose(trade, netPnlUsdt, excursion.mfe, excursion.mae, quote.observedAt, exitCode, Boolean(target1HitAt));', 1)
          pattern = re.compile(r'  const high = quote\.highPrice \?\? quote\.price;[\s\S]*?  const grossPct = grossMovePct\(trade\.side, trade\.entryPrice, quote\.price\);')
          match = pattern.search(repo)
          if not match:
              raise SystemExit("position quote ordering block missing")
          new_ordering = '''  const barTime = (time: number) => time > 10_000_000_000 ? time : time * 1000;\n  const freshBars = (quote.recentCandles ?? []).filter((bar) => {\n    const startedAt = barTime(bar.time);\n    return startedAt >= trade.lastEvaluatedAt && startedAt >= trade.entryAt && startedAt <= quote.observedAt;\n  });\n  const legacyBarFresh = quote.candleTime != null\n    && barTime(quote.candleTime) >= trade.lastEvaluatedAt\n    && barTime(quote.candleTime) >= trade.entryAt;\n  const observedHighs = [quote.price, ...freshBars.map((bar) => bar.high), ...(legacyBarFresh && quote.highPrice != null ? [quote.highPrice] : [])];\n  const observedLows = [quote.price, ...freshBars.map((bar) => bar.low), ...(legacyBarFresh && quote.lowPrice != null ? [quote.lowPrice] : [])];\n  const high = Math.max(...observedHighs);\n  const low = Math.min(...observedLows);\n  const maxPriceSeen = Math.max(trade.maxPriceSeen, high, quote.price);\n  const minPriceSeen = Math.min(trade.minPriceSeen, low, quote.price);\n  let target1HitAt = trade.target1HitAt;\n  let currentStopPrice = trade.currentStopPrice;\n  const stopBeforeObservation = trade.currentStopPrice;\n  const previouslyProtected = trade.target1HitAt != null;\n  const stopHit = trade.side === "LONG" ? low <= stopBeforeObservation : high >= stopBeforeObservation;\n  const tp1Hit = trade.side === "LONG" ? high >= trade.takeProfit1Price : low <= trade.takeProfit1Price;\n  const tp2Hit = trade.side === "LONG" ? high >= trade.takeProfit2Price : low <= trade.takeProfit2Price;\n  const timeout = quote.observedAt - trade.entryAt >= trade.maxHoldingMinutes * 60_000;\n  const currentExcursion = excursionPct(trade.side, trade.entryPrice, maxPriceSeen, minPriceSeen);\n  const initialRiskPct = Math.abs(trade.entryPrice - trade.initialStopPrice) / trade.entryPrice * 100;\n  const maximumFavorableR = initialRiskPct > 0 ? currentExcursion.mfe / initialRiskPct : 0;\n  let exitCode: string | null = null;\n  let exitReason: string | null = null;\n  let exitPrice: number | null = null;\n  // The stop that existed BEFORE this observation owns same-bar priority. A new\n  // TP1 breakeven stop is installed only for future observations, so a low/high\n  // from before TP1 can never retroactively trigger it.\n  if (stopHit) {\n    exitCode = previouslyProtected && stopBeforeObservation === trade.entryPrice ? "breakeven" : "stop_loss";\n    exitReason = exitCode === "breakeven" ? "TP1 后保护止损被触发" : "结构止损被触发";\n    exitPrice = stopBeforeObservation;\n  } else if (tp2Hit) {\n    exitCode = "take_profit";\n    exitReason = "第二目标完成，按交易员计划退出";\n    exitPrice = trade.takeProfit2Price;\n  } else if (timeout) {\n    exitCode = "timeout";\n    exitReason = hte31TimeoutExitReason({\n      maxHoldingMinutes: trade.maxHoldingMinutes,\n      target1Hit: Boolean(target1HitAt || tp1Hit),\n      maximumFavorableR,\n    });\n    exitPrice = quote.price;\n  } else if (!target1HitAt && tp1Hit) {\n    target1HitAt = quote.observedAt;\n    currentStopPrice = trade.side === "LONG"\n      ? Math.max(trade.currentStopPrice, trade.entryPrice)\n      : Math.min(trade.currentStopPrice, trade.entryPrice);\n  }\n\n  const grossPct = grossMovePct(trade.side, trade.entryPrice, quote.price);'''
          repo = repo[:match.start()] + new_ordering + repo[match.end():]
          repo = repo.replace(
              '      wins: closed.filter((row) => (row.netPnlUsdt ?? 0) > 0).length,\n      losses: closed.filter((row) => (row.netPnlUsdt ?? 0) < 0).length,',
              '      wins: closed.filter((row) => (row.netPnlUsdt ?? 0) > 0).length,\n      scratches: closed.filter((row) => row.exitCode === "breakeven").length,\n      losses: closed.filter((row) => isHte31FailureLoss(row)).length,', 1)
          write("lib/hte31-repository.ts", repo)

          # New HT4/HT5 remain paper-only until their own samples validate them.
          # This preserves the existing real-money authority of HT1-HT3.
          live_repo = read("lib/live-trading-repository.ts")
          live_repo = live_repo.replace(
              'const ACTIVE_LIVE_STATES: LiveOrderState[] = ["submitting", "open", "protected", "closing"];',
              'const ACTIVE_LIVE_STATES: LiveOrderState[] = ["submitting", "open", "protected", "closing"];\nconst HTE31_LIVE_VALIDATED_TRADERS = new Set(["dennis_trend", "raschke_pullback", "turtle_soup"]);', 1)
          live_repo = live_repo.replace(
              '  const [trade] = await getDb().select({ id: hte31Trades.id }).from(hte31Trades).where(eq(hte31Trades.id, tradeId)).limit(1);\n  if (!trade) throw new Error("HTE 3.1 实盘候选已不存在，禁止创建 Gate 订单");\n  return trade;',
              '  const [trade] = await getDb().select({ id: hte31Trades.id, traderId: hte31Trades.traderId }).from(hte31Trades).where(eq(hte31Trades.id, tradeId)).limit(1);\n  if (!trade) throw new Error("HTE 3.1 实盘候选已不存在，禁止创建 Gate 订单");\n  if (!HTE31_LIVE_VALIDATED_TRADERS.has(trade.traderId)) throw new Error("HT4/HT5 仍在模拟验证阶段，禁止直接进入 Gate 实盘");\n  return trade;', 1)
          write("lib/live-trading-repository.ts", live_repo)

          # Chart API computes the counterfactual observer from the immutable trade
          # plus saved/fresh candles; no new D1 table or migration is required.
          chart = read("app/api/hte31/chart/route.ts")
          chart = chart.replace(
              'import { getHte31Trade, getHte31TradeChart } from "../../../../lib/hte31-repository";',
              'import { getHte31Trade, getHte31TradeChart } from "../../../../lib/hte31-repository";\nimport { buildHte31Counterfactual } from "../../../../lib/hte31-counterfactual";\nimport { getSettings } from "../../../../lib/settings-repository";', 1)
          chart = chart.replace(
              '  const candles = mergeCandles(\n    stored?.entryCandles ?? [],\n    stored?.holdingCandles ?? [],\n    stored?.postExitCandles ?? [],\n    fresh,\n  );',
              '  const candles = mergeCandles(\n    stored?.entryCandles ?? [],\n    stored?.holdingCandles ?? [],\n    stored?.postExitCandles ?? [],\n    fresh,\n  );\n  const settings = await getSettings();\n  const counterfactual = buildHte31Counterfactual(trade, candles, settings.roundTripCostBps, now);', 1)
          chart = chart.replace('    observations,\n    diagnosis:', '    observations,\n    counterfactual,\n    diagnosis:', 1)
          write("app/api/hte31/chart/route.ts", chart)

          # UI: five traders are visible and expanded trade review shows the
          # original-vs-opposite / confirmed-reversal counterfactual evidence.
          page = read("app/page.tsx")
          page = page.replace('type TraderId = "dennis_trend" | "raschke_pullback" | "turtle_soup";', 'type TraderId = "dennis_trend" | "raschke_pullback" | "turtle_soup" | "exhaustion_reversal" | "higher_timeframe_swing";', 1)
          page = page.replace(
              '  turtle_soup: { code: "HT3", name: "Turtle Soup", setup: "假突破", copy: "只做成熟极值被扫后重新收回区间的失败突破。" },\n};',
              '  turtle_soup: { code: "HT3", name: "Turtle Soup", setup: "假突破", copy: "只做成熟极值被扫后重新收回区间的失败突破。" },\n  exhaustion_reversal: { code: "HT4", name: "Exhaustion", setup: "反拥挤衰竭", copy: "不机械反做；等共识拥挤、趋势延伸过度且继续推进失败后再站到反面。" },\n  higher_timeframe_swing: { code: "HT5", name: "Swing", setup: "大周期结构", copy: "1h/4h 决定数小时方向，15m/5m 只负责等待逆向回撤结束与精确入场。" },\n};', 1)
          page = page.replace('  stats: { sampleCount: number; wins: number; losses: number; profitFactor: number | null; totalNetPnlUsdt: number };', '  stats: { sampleCount: number; wins: number; scratches: number; losses: number; profitFactor: number | null; totalNetPnlUsdt: number };', 1)
          page = page.replace(
              '  diagnosis: {',
              '  counterfactual: { generatedAt: number; horizons: { minutes: number; observedAt: number; originalR: number; oppositeR: number }[]; reversals: { key: string; label: string; triggeredAt: number; triggerPrice: number; side: "LONG" | "SHORT"; observedMinutes: number; terminalR: number; maxFavorableR: number; maxAdverseR: number }[]; summary: string } | null;\n  diagnosis: {', 1)
          page = page.replace(
              '      <p className="order-thesis"><b>{chart.diagnosis.label ?? "出场后观察中"}</b>',
              '      {chart.counterfactual && <><div className="review-grid">{chart.counterfactual.horizons.filter((item)=>item.minutes===120||item.minutes===240||item.minutes===480).map((item)=><div key={item.minutes}><span>{horizonLabel(item.minutes)} 原 / 反</span><b>{fmtR(item.originalR)} / {fmtR(item.oppositeR)}</b></div>)}</div><div className="observer-timeline">{chart.counterfactual.reversals.map((item)=><div className="observer-chip" key={item.key}><b>{item.label}</b><span>终值 {fmtR(item.terminalR)}</span><br/><span>MFE {fmtR(item.maxFavorableR)}</span></div>)}</div><p className="order-thesis"><b>Counterfactual Observer</b> · {chart.counterfactual.summary}</p></>}\n      <p className="order-thesis"><b>{chart.diagnosis.label ?? "出场后观察中"}</b>', 1)
          page = page.replace('n={samples} · Expectancy', 'n={samples} · W/S/L {learning.reduce((sum,row)=>sum+row.wins,0)}/{learning.reduce((sum,row)=>sum+Math.max(0,row.sampleCount-row.wins-row.losses),0)}/{learning.reduce((sum,row)=>sum+row.losses,0)} · Expectancy', 1)
          page = page.replace('HUMAN TRADER ENGINE 3.1 CLEAN</small>', 'HUMAN TRADER ENGINE 3.1 CLEAN · 5 TRADERS</small>', 1)
          page = page.replace('三交易员评估', '五交易员评估')
          page = page.replace('3 INDEPENDENT TRADERS', '5 INDEPENDENT TRADERS')
          page = page.replace('三位独立交易员', '五位独立交易员')
          page = page.replace('<TraderCard id="turtle_soup" dashboard={dashboard}/></div>', '<TraderCard id="turtle_soup" dashboard={dashboard}/><TraderCard id="exhaustion_reversal" dashboard={dashboard}/><TraderCard id="higher_timeframe_swing" dashboard={dashboard}/></div>', 1)
          page = page.replace('HT1/HT2/HT3 判断', 'HT1–HT5 判断')
          write("app/page.tsx", page)

          # Tests: make the new unit suites part of standard signal CI and lock the
          # user-visible five-trader/counterfactual boundary.
          package = read("package.json")
          package = package.replace('tests/hte31-regime-parity.test.ts tests/gate-client.test.ts', 'tests/hte31-regime-parity.test.ts tests/hte31-advanced-traders.test.ts tests/hte31-counterfactual.test.ts tests/gate-client.test.ts', 1)
          write("package.json", package)
          ui_test = read("tests/human-trader-ui.test.mjs")
          ui_test = ui_test.replace('  assert.match(page, /Turtle Soup/);', '  assert.match(page, /Turtle Soup/);\n  assert.match(page, /HT4/);\n  assert.match(page, /Exhaustion/);\n  assert.match(page, /HT5/);\n  assert.match(page, /Counterfactual Observer/);', 1)
          write("tests/human-trader-ui.test.mjs", ui_test)
          clean_test = read("tests/hte31-clean-rebuild.test.mjs")
          clean_test = clean_test.replace('  assert.match(scanner, /evaluateHumanTraderPool/);', '  assert.match(scanner, /evaluateHumanTraderPool/);\n  assert.match(scanner, /evaluateAdvancedHumanTraders/);\n  assert.match(scanner, /getGlobalRiskContext/);', 1)
          clean_test = clean_test.replace('  assert.match(api, /observations/);', '  assert.match(api, /observations/);\n  assert.match(api, /buildHte31Counterfactual/);', 1)
          write("tests/hte31-clean-rebuild.test.mjs", clean_test)

          # Update durable project decisions/status and remove this one-shot helper
          # from the final tree before committing.
          decisions = read(".codex/goal-to-done/DECISIONS.md")
          decisions += '''\n## 2026-08-30 — Expand analysis, not execution latency\n\n- Choice: Keep 5m tactical execution for HT1-HT3, expose 15m/1h/4h separately, and add HT4 Exhaustion plus HT5 Higher-Timeframe Swing as independent paper traders.\n- Reason: Recent trades often had short-term favorable excursion while the larger subsequent move ran the other way; averaging timeframes into one scalar hid that conflict.\n- Evidence: Four new paper trades all showed initial profit; two reached TP1, while two later hit valid structural stops and continued adverse.\n- Revisit when: Counterfactual and post-exit samples are large enough to compare original direction, direct opposite, and confirmed reversal paths by trader/regime.\n\n## 2026-08-30 — Fix measurement before tuning setup thresholds\n\n- Choice: Make paper 1R include round-trip fees, classify TP1-protected breakevens as scratches rather than failure losses, and prevent a newly moved TP1 stop from using pre-trigger intrabar history.\n- Reason: Otherwise loss R is overstated, protected trades contaminate loss streaks, and impossible same-candle ordering can create false breakeven exits.\n- Evidence: BTC planned -39.10U realized -48.64U and HYPE planned -39.87U realized -45.29U were explained by fees outside the old risk budget.\n- Revisit when: Real exchange slippage modeling or finer event/tick data is introduced.\n'''
          write(".codex/goal-to-done/DECISIONS.md", decisions)
          status = read(".codex/goal-to-done/STATUS.md")
          status = re.sub(r'- State: .*', '- State: implementation verification', status, count=1)
          status = re.sub(r'- Updated UTC: .*', '- Updated UTC: 2026-08-30T23:45:00+00:00', status, count=1)
          status += '''\n## 2026-08-30 five-trader reversal intelligence\n\n- Added HT4 Exhaustion / Anti-Crowd and HT5 Higher-Timeframe Swing as independent paper traders; max simultaneous paper positions remains 2.\n- Exposed 15m/1h/4h separately instead of using only the composite trend and connected the existing macro/DVOL risk context to the active HTE31 scanner.\n- Paper planned risk now includes round-trip fees; TP1 breakeven exits are scratches for streak/gate classification.\n- Position monitoring uses 10s candles and never retroactively applies a newly moved breakeven stop to earlier intrabar prices.\n- Added Counterfactual Observer for original/opposite and +0.5R/TP1/stop reversal paths.\n- HT4/HT5 are deliberately paper-only until their own samples validate them; HT1-HT3 live authority is unchanged.\n'''
          write(".codex/goal-to-done/STATUS.md", status)

          Path('.github/workflows/hte31-five-trader-upgrade-once.yml').unlink()
          PY
      - name: Install
        run: npm ci
      - name: Focused advanced tests
        run: node --experimental-strip-types --test tests/hte31-advanced-traders.test.ts tests/hte31-counterfactual.test.ts tests/hte31-position-sizing.test.ts tests/human-trader-engine.test.ts
      - name: Full signal tests
        run: npm run test:signals
      - name: Production build and UI regression
        run: npm test
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Diff sanity
        run: git diff --check
      - name: Commit verified upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add five-trader reversal intelligence"
          git push origin HEAD:${GITHUB_REF_NAME}
