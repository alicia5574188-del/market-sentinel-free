name: Unified research isolated workbench
on:
  push:
    branches: [fix/20261001-unified-research-plan]
    paths: [.github/workflows/unified-research-workbench.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/20261001-unified-research-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20261001-unified-research-plan
          fetch-depth: 0
      - name: Apply preimage and postimage checked source edits
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path('.')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          payload=''.join(''.join((root/f'scripts/unified-research-edits-{i}.b64').read_text().split()) for i in (1,2,3))
          assert sha(payload.encode())=='9eb3e6439aab7162f4d25703e4cdc3f230dc4e5b3e3ecddb0b933c01b7bda5cf','Transport digest mismatch'
          raw=lzma.decompress(base64.b64decode(payload,validate=True))
          assert sha(raw)=='2a1594e45bcbb8a40526d9ea00bebe2986cf2d1711b4acb95a69041d80d3295f','Edit digest mismatch'
          edits=json.loads(raw)
          allowed=set('AGENTS.md app/market-intelligence-execution.tsx lib/forward-protection-checkpoint.ts lib/forward-relations.ts lib/research-plan.ts lib/research-snapshot.ts lib/review-trace.ts lib/winner-policy.ts package.json research/UNIFIED_PLAN_2026-10-01.md tests/architecture.test.mjs tests/frontend-density.test.mjs tests/research-plan.test.ts tests/research-snapshot-v2.test.ts vite.config.ts worker/index-clean.ts'.split())
          assert len(edits)==16 and {e['path'] for e in edits}==allowed
          ready=[]
          for e in edits:
              p=root/e['path']; prior=p.read_bytes() if p.exists() else None
              if prior is not None and sha(prior)==e['after']:continue
              assert (sha(prior) if prior is not None else None)==e['before'],f"Preimage mismatch: {p}"
              lines=(prior or b'').decode().splitlines(keepends=True)
              for i,j,text in reversed(e['edits']):
                  assert 0<=i<=j<=len(lines)
                  lines[i:j]=text.splitlines(keepends=True)
              new=''.join(lines).encode()
              assert sha(new)==e['after'],f"Postimage mismatch: {p}"
              ready.append((p,new))
          for p,new in ready:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(new)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          print(f'All {len(edits)} source images verified; {len(ready)} source files staged.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate graded research into frozen winner plans and version-accurate causal review'
            git push origin HEAD:refs/heads/fix/20261001-unified-research-plan
          fi
          mkdir -p "$RUNNER_TEMP/unified-checks"
          git rev-parse HEAD | tee "$RUNNER_TEMP/unified-checks/head.txt"
          git diff 2b4fd60f77c9b78526bd5087940945fe7e86fab8 --stat > "$RUNNER_TEMP/unified-checks/diff-stat.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Strategy, financial, LIVE, member and storage checks
        run: |
          set -uo pipefail
          failed=0
          for suite in test:direct test:live-parity test:members test:equity test:feed:workerd; do
            npm run "$suite" 2>&1 | tee "$RUNNER_TEMP/unified-checks/${suite//:/-}.log" || failed=1
          done
          exit "$failed"
      - name: Build, types, lint, architecture and deploy dry-run
        if: always() && steps.apply.outcome == 'success' && steps.install.outcome == 'success'
        run: |
          set -uo pipefail
          failed=0
          for suite in build typecheck lint; do
            npm run "$suite" 2>&1 | tee "$RUNNER_TEMP/unified-checks/$suite.log" || failed=1
          done
          node --test tests/architecture.test.mjs tests/migration.test.mjs 2>&1 | tee "$RUNNER_TEMP/unified-checks/architecture.log" || failed=1
          git diff --check || failed=1
          npx wrangler deploy --dry-run --config dist/server/wrangler.json 2>&1 | tee "$RUNNER_TEMP/unified-checks/dry-run.log" || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-research-checks
          path: ${{ runner.temp }}/unified-checks
          retention-days: 3
