name: Direct Brain Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/direct-brain-production-smoke.yml

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed manifest, Direct Brain asset and health
        shell: bash
        run: |
          set -euo pipefail
          base="https://market-sentinel-free.alicia5574188.workers.dev"
          for attempt in {1..12}; do
            manifest_code="$(curl -sS --max-time 10 -o /tmp/manifest.json -w '%{http_code}' "$base/.vite/manifest.json" || true)"
            echo "attempt=$attempt manifest_http=$manifest_code"
            if [[ "$manifest_code" == "200" ]]; then
              asset="$(jq -r '.["app/page.tsx"].file // empty' /tmp/manifest.json)"
              echo "asset=$asset"
              asset_code="$(curl -sS --max-time 10 -o /tmp/page.js -w '%{http_code}' "$base/$asset" || true)"
              echo "asset_http=$asset_code"
              if [[ "$asset_code" == "200" ]] && grep -q 'direct-market-brain-v1' /tmp/page.js && grep -q '成交额前十五' /tmp/page.js; then
                break
              fi
            fi
            sleep 10
          done
          grep -q 'direct-market-brain-v1' /tmp/page.js
          for attempt in 1 2 3; do
            code="$(curl -sS --max-time 5 -o "/tmp/health-$attempt.json" -w '%{http_code}' "$base/__health")"
            echo "health_attempt=$attempt http=$code"
            cat "/tmp/health-$attempt.json"
            [[ "$code" == "200" ]]
            jq -e '
              .ok == true and
              .schedulerError == null and
              .schedulers.position.state == "live" and
              .schedulers.position.lastError == null and
              .schedulers.scanner.state == "live" and
              .schedulers.scanner.lastError == null and
              .schedulers.scanner.circuitOpen == false
            ' "/tmp/health-$attempt.json"
            sleep 5
          done
