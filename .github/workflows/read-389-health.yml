name: Read 389 production health

on:
  push:
    branches: [strategy/dynamic-pool-anchor-score-stop-20260922]
    paths:
      - ".github/workflows/read-389-health.yml"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Read production health
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 15 -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "https://market-sentinel-free.alicia5574188.workers.dev/__health" || true)"
          echo "http=$code"
          jq -c '{
            ok,ready,version,mode,
            buildSha:.runtime.buildSha,
            state:.runtime.state,
            stale:.runtime.stale,
            lastError:.runtime.lastError,
            lastSuccessAt:.runtime.lastSuccessAt,
            liveMode:.runtime.liveMode,
            limits:.runtime.limits,
            forward:{
              startedAt:.runtime.forward.startedAt,
              equity:.runtime.forward.equity,
              resolved:.runtime.forward.resolved,
              openCount:.runtime.forward.openCount,
              strategyAuthorityVersion:.runtime.forward.strategyAuthorityVersion,
              storage:.runtime.forward.storage
            }
          }' "$RUNNER_TEMP/health.json"
