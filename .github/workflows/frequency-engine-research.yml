name: Frequency Engine Research

on:
  workflow_dispatch:
  push:
    branches:
      - research/replacement-engine-scan-20260914
    paths:
      - 'scripts/research-frequency-engine.mjs'
      - 'scripts/fetch-gate-history.mjs'
      - '.github/workflows/frequency-engine-research.yml'

permissions:
  contents: read

jobs:
  frequency-study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RESEARCH_DATASET: /tmp/gate-history-frequency-12m.json
      FREQUENCY_OUTPUT: /tmp/frequency-engine-research.json
      RESEARCH_MONTHS: 202509,202510,202511,202512,202601,202602,202603,202604,202605,202606,202607,202608
      RESEARCH_SYMBOLS: BTC_USDT,ETH_USDT,SOL_USDT,XRP_USDT,BNB_USDT,DOGE_USDT,ADA_USDT,LINK_USDT,LTC_USDT,AVAX_USDT,BCH_USDT,SUI_USDT,UNI_USDT,DOT_USDT,TRX_USDT,TON_USDT,ETC_USDT,AAVE_USDT,NEAR_USDT,ICP_USDT,FIL_USDT,ATOM_USDT,ARB_USDT,OP_USDT,INJ_USDT,HBAR_USDT,XLM_USDT,ALGO_USDT,PEPE_USDT,WIF_USDT,APT_USDT,SEI_USDT,TIA_USDT,CRV_USDT,LDO_USDT,GRT_USDT,FET_USDT,SHIB_USDT
      RESEARCH_INTERVAL: 5m
      RESEARCH_MIN_CONTRACTS: 28
      RESEARCH_MIN_MONTH_COVERAGE: 0.98
      RESEARCH_CONCURRENCY: 8
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch 12-month Gate 5m frequency universe
        run: node scripts/fetch-gate-history.mjs
      - name: Run frequency architecture study
        run: node scripts/research-frequency-engine.mjs
      - name: Upload frequency research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frequency-engine-research
          path: /tmp/frequency-engine-research.json
          if-no-files-found: warn
