name: Paid fee public health boundary
on:
  push:
    branches: [fix/20261001-paid-fee-display]
    paths: [.github/workflows/paid-fee-privacy.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/fix/20261001-paid-fee-display'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20261001-paid-fee-display
      - name: Keep detailed pairs on authenticated view only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib
          p=pathlib.Path('worker/index-clean.ts');raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='89a044063fb5e174eaf3f3fe81b75b78c9696260'
          old='const {curve:_,...summary}=v;return summary;'
          new='const {curve:_,...summary}=v;return{...summary,paidCost:summary.paidCost?{...summary.paidCost,rows:undefined}:null};'
          text=raw.decode();assert text.count(old)==1
          p.write_text(text.replace(old,new))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/index-clean.ts
          git rm .github/workflows/paid-fee-privacy.yml
          git commit -m 'Omit detailed paid-cost order rows from unauthenticated health; keep authenticated order view'
          git push origin HEAD:refs/heads/fix/20261001-paid-fee-display
