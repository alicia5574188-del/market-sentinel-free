name: Forward Relation 2.0 Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pull-requests: read

env:
  WORKER_NAME: market-sentinel-free
  WORKER_BASE_URL: https://market-sentinel-free.alicia5574188.workers.dev
  D1_DATABASE_ID: 9863619f-afc7-4dfa-8798-b4445e41c013
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Core and execution tests
        run: |
          set -euo pipefail
          npm run test:direct
          npm run test:live-parity
          npm run test:members
          npm run test:equity
          npm run test:feed:workerd
      - name: Build, typecheck and lint
        run: |
          set -euo pipefail
          npm run build
          npm run typecheck
          npm run lint
          node --test tests/architecture.test.mjs tests/migration.test.mjs
          git diff --check
          npx wrangler deploy --dry-run --config dist/server/wrangler.json
      # Diagnostic rerun after realtime BBO deployment.
      # BBO post-deploy observation: read-only production sampling.
      - name: Observe current production without mutating it
        if: github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          body="$(curl -sS --max-time 15 "$WORKER_BASE_URL/__health" || true)"
          if jq -e . >/dev/null 2>&1 <<<"$body"; then
            jq -c '{ok,version,mode,runtime:{state:.runtime.state,stale:.runtime.stale,lastError:.runtime.lastError,
              lastSuccessAt:.runtime.lastSuccessAt,forward:.runtime.forward,realtimeReadiness:.runtime.realtimeReadiness,
              marketDataTransport:.runtime.marketDataTransport,feedQuality:.runtime.feedQuality,symbols:.runtime.symbols,
              radar:.runtime.radar,liveMode:.runtime.liveMode,limits:.runtime.limits}}' <<<"$body"
          else
            echo '{"runtimeSnapshot":"unavailable"}'
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: adaptive-ten-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify persistent platform shape
        run: |
          jq -e --arg database "$D1_DATABASE_ID" '
            .d1_databases[0].database_id == $database and
            .durable_objects.bindings == [
              {name:"MARKET_STREAM",class_name:"MarketStream"},
              {name:"MEMBERS",class_name:"MemberDirectory"},
              {name:"MEMBER_EXECUTION",class_name:"MemberExecutor"}
            ] and (.migrations|length)==8
          ' wrangler.jsonc >/dev/null
      - name: Deploy exact main
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Verify Forward Relation 2.0 production health
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            body="$(curl -sS --max-time 15 "$WORKER_BASE_URL/__health" || true)"
            if jq -e --arg sha "$GITHUB_SHA" '
              .runtime.buildSha == $sha and
              .runtime.authorityReady == true and
              .runtime.stale == false and
              .runtime.lastError == null and
              .runtime.forward.version == "forward-relations-v1.0" and
              .runtime.forward.strategyAuthorityVersion == "forward-relation-v2" and
              .runtime.forward.executionVersion == "forward-relation-v2" and
              .runtime.forward.positionLimit == null and
              .runtime.forward.executionBboCapacity == 30 and
              .runtime.forward.minuteConfirmationCapacity == 11 and
              .runtime.forward.storage.error == null and
              (.runtime.forward.storage.persistedAt|type) == "number" and .runtime.forward.storage.persistedAt > 0 and
              (.runtime.forward.lastCycleAt|type) == "number" and .runtime.forward.lastCycleAt > 0 and
              .runtime.realtimeReadiness.capacity == 30 and
              .runtime.realtimeReadiness.protectedMarketsReady == true and
              .runtime.multiSourceMarket.healthySources >= 3 and
              ((.runtime.forward.participationEligibleCount == 0) or (.runtime.realtimeReadiness.actionableMarkets >= 1)) and
              .runtime.radar.scanned > 0 and .runtime.radar.scanned <= 30 and
              .runtime.limits.scanUniverse == 30 and
              .runtime.limits.realtimeCapacity == 30 and
              (.runtime.liveMode.requestedEnabled|type) == "boolean" and
              (.runtime.liveMode.operational|type) == "boolean"
            ' <<<"$body" >/dev/null 2>&1; then
              jq -c '{ok,buildSha:.runtime.buildSha,state:.runtime.state,lastError:.runtime.lastError,
                forward:.runtime.forward,realtimeReadiness:.runtime.realtimeReadiness,
                multiSourceMarket:.runtime.multiSourceMarket,liveMode:.runtime.liveMode,scanned:.runtime.radar.scanned}' <<<"$body"
              exit 0
            fi
            sleep 10
          done
          echo "$body"
          exit 1

  scheduled-reconcile:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: adaptive-ten-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Deploy only when production is not current main
        shell: bash
        run: |
          set -euo pipefail
          remote="$(curl -sS --max-time 15 "$WORKER_BASE_URL/__health" || true)"
          deployed="$(jq -r '.runtime.buildSha // empty' <<<"$remote" 2>/dev/null || true)"
          head="$(git rev-parse HEAD)"
          if [[ "$deployed" == "$head" ]]; then
            echo "production already matches main $head"
            exit 0
          fi
          npm run test:direct
          npm run build
          npm run typecheck
          npx wrangler deploy --config dist/server/wrangler.json
          for i in $(seq 1 18); do
            body="$(curl -sS --max-time 15 "$WORKER_BASE_URL/__health" || true)"
            if jq -e --arg sha "$head" '
              .runtime.buildSha == $sha and
              .runtime.authorityReady == true and .runtime.stale == false and .runtime.lastError == null and
              .runtime.forward.strategyAuthorityVersion == "forward-relation-v2" and
              .runtime.forward.positionLimit == null and .runtime.forward.executionBboCapacity == 30 and .runtime.forward.minuteConfirmationCapacity == 11 and .runtime.forward.storage.error == null and
              .runtime.forward.lastCycleAt > 0 and .runtime.realtimeReadiness.capacity == 30 and
              .runtime.realtimeReadiness.protectedMarketsReady == true and .runtime.multiSourceMarket.healthySources >= 3 and
              ((.runtime.forward.participationEligibleCount == 0) or (.runtime.realtimeReadiness.actionableMarkets >= 1)) and
              .runtime.radar.scanned > 0 and .runtime.radar.scanned <= 30
            ' <<<"$body" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "$body"
          exit 1
