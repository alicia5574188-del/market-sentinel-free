name: FBR Frozen Backward OOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/frozen-fbr-rank123.json'
      - 'scripts/research-fbr-frozen-backward-oos.mjs'
      - 'scripts/fetch-gate-history.mjs'
      - '.github/workflows/fbr-frozen-backward-oos.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Syntax check
        run: node --check scripts/research-fbr-frozen-backward-oos.mjs
      - name: Fetch independent backward 12-month Gate 5m universe
        env:
          RESEARCH_INTERVAL: 5m
          RESEARCH_DATASET: /tmp/gate-fbr-backward-12m.json
          RESEARCH_MONTHS: 202409,202410,202411,202412,202501,202502,202503,202504,202505,202506,202507,202508
          RESEARCH_SYMBOLS: BTC_USDT,ETH_USDT,SOL_USDT,XRP_USDT,BNB_USDT,DOGE_USDT,ADA_USDT,LINK_USDT,LTC_USDT,AVAX_USDT,BCH_USDT,SUI_USDT,UNI_USDT,FIL_USDT,AAVE_USDT,ARB_USDT,APT_USDT,PEPE_USDT,WLD_USDT
          RESEARCH_MIN_CONTRACTS: '19'
          RESEARCH_MIN_MONTH_COVERAGE: '0.93'
          RESEARCH_CONCURRENCY: '16'
        run: node scripts/fetch-gate-history.mjs
      - name: Replay exact frozen FBR lanes on backward OOS
        env:
          RESEARCH_DATASET: /tmp/gate-fbr-backward-12m.json
          RESEARCH_CONFIG: research/frozen-fbr-rank123.json
          RESEARCH_OUTPUT: /tmp/fbr-frozen-backward-oos.json
        run: node scripts/research-fbr-frozen-backward-oos.mjs
      - name: Print result
        run: jq '{research,period,protocol,universe,minCross,unique,overlapRate,stressPositiveMonths,adversePositiveMonths,backwardRobust,target12OrderLegs,monthly,rankSummary,note}' /tmp/fbr-frozen-backward-oos.json
      - uses: actions/upload-artifact@v4
        with:
          name: fbr-frozen-backward-oos
          path: /tmp/fbr-frozen-backward-oos.json
          retention-days: 7
