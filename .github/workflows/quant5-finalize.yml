name: Quant5 verified source publisher

on:
  push:
    branches:
      - codex/quant5-sizing-live-continuity-final

permissions:
  contents: write

jobs:
  publish-verified-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/quant5-sizing-live-continuity-final
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply locally verified commit
        env:
          VERIFIED_PATCH_B64: 
        run: |
          printf '%s' "$VERIFIED_PATCH_B64" | base64 --decode > "$RUNNER_TEMP/quant5.patch"
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git am "$RUNNER_TEMP/quant5.patch"

      - run: npm ci
      - run: npm run test:all-regime
      - run: npm run test:direct
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx wrangler deploy --dry-run --config dist/server/wrangler.json

      - name: Publish source and remove bootstrap
        run: |
          git rm .github/workflows/quant5-finalize.yml
          git commit -m "chore: remove verified source publisher [skip ci]"
          git push origin HEAD:codex/quant5-sizing-live-continuity-final
