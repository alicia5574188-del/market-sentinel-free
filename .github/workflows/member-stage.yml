name: Verify Isolated Member Keys
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/member-stage.yml'
      - 'scripts/member-apply.py'
      - 'scripts/member-segment-*.b64'
permissions:
  contents: write
jobs:
  stage:
    if: github.head_ref == 'feature/isolated-member-keys' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply exact source checksums then remove all temporary transport
        run: |
          mkdir -p /tmp/member-verified
          cp scripts/member-segment-*.b64 /tmp/member-verified/
          python scripts/member-apply.py
          git rm --ignore-unmatch scripts/member-segment-*.b64 scripts/member-release-1.b64 scripts/member-apply.py .github/workflows/member-stage.yml .github/workflows/member-baseline-capture.yml
      - name: Independently verify isolation, original primary methods and compiled SQLite namespaces
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee /tmp/member-verified/install.log
          npm run test:direct 2>&1 | tee /tmp/member-verified/direct.log
          npm test 2>&1 | tee /tmp/member-verified/test-build.log
          npm run typecheck 2>&1 | tee /tmp/member-verified/typecheck.log
          npm run lint 2>&1 | tee /tmp/member-verified/lint.log
          npm run test:members:workerd 2>&1 | tee /tmp/member-verified/local-workerd.log
          npx wrangler deploy --dry-run --config dist/server/wrangler.json 2>&1 | tee /tmp/member-verified/dry-run.log
          git diff --check
          git add -A
          git diff --cached --check
      - name: Retain only public primary baseline, never owner login or LIVE writes
        shell: bash
        run: |
          curl -fsS --retry 2 --max-time 20 'https://market-sentinel-free.alicia5574188.workers.dev/__health' > /tmp/member-verified/primary-health-before.json
          jq '{build:.runtime.buildSha,owner:.runtime.liveMode,source:.runtime.forward.startedAt,activation:.runtime.liveMirror.enabledAt}' /tmp/member-verified/primary-health-before.json
      - name: Store verified content blobs only; connector performs reviewed source commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');
            const {owner,repo}=context.repo,parent=context.payload.pull_request.head.sha,branch=context.payload.pull_request.head.ref;
            const current=await github.rest.repos.getBranch({owner,repo,branch});
            if(current.data.commit.sha!==parent)throw new Error('Head changed during verification');
            const base=await github.rest.git.getCommit({owner,repo,commit_sha:parent});
            const names=cp.execFileSync('git',['diff','--cached','--name-only','-z']).toString().split('\0').filter(Boolean),tree=[],sha256={};
            for(const path of names){
              if(!fs.existsSync(path)){tree.push({path,mode:'100644',type:'blob',sha:null});continue;}
              const bytes=fs.readFileSync(path),blob=await github.rest.git.createBlob({owner,repo,content:bytes.toString('base64'),encoding:'base64'});
              const expected=crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex');
              if(blob.data.sha!==expected)throw new Error('Blob mismatch: '+path);
              tree.push({path,mode:'100644',type:'blob',sha:blob.data.sha});sha256[path]=crypto.createHash('sha256').update(bytes).digest('hex');
            }
            const result={parent,baseTree:base.data.tree.sha,tree,sha256,runId:context.runId,branchRefUnchanged:true,productionUnchanged:true};
            fs.writeFileSync('/tmp/member-verified/verified-tree.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-member-verified-${{ github.run_id }}
          path: /tmp/member-verified/
          retention-days: 7
          if-no-files-found: warn
