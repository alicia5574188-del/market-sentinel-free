name: Anomaly Clean Lab
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/anomaly-clean-lab.yml"
permissions:
  contents: read
jobs:
  active-research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Fetch frozen active research script
        run: |
          git fetch origin research/v12-44m-frozen-audit --depth=1
          git show FETCH_HEAD:scripts/research-specialness-selector-quality.mjs > /tmp/active-anomaly.mjs
      - name: Fetch canonical 44-month Gate 5m core universe
        env:
          RESEARCH_INTERVAL: 5m
          RESEARCH_DATASET: /tmp/gate-history-selector-quality-44m-5m.json
          RESEARCH_MONTHS: 202301,202302,202303,202304,202305,202306,202307,202308,202309,202310,202311,202312,202401,202402,202403,202404,202405,202406,202407,202408,202409,202410,202411,202412,202501,202502,202503,202504,202505,202506,202507,202508,202509,202510,202511,202512,202601,202602,202603,202604,202605,202606,202607,202608
          RESEARCH_SYMBOLS: BTC_USDT,ETH_USDT,SOL_USDT,XRP_USDT,BNB_USDT,DOGE_USDT,ADA_USDT,LINK_USDT,LTC_USDT,AVAX_USDT,BCH_USDT
          RESEARCH_MIN_CONTRACTS: 11
          RESEARCH_MIN_MONTH_COVERAGE: 0.70
          RESEARCH_CONCURRENCY: 16
        run: node scripts/fetch-gate-history.mjs
      - name: Assert canonical hash
        run: test "$(jq -r .sha256 /tmp/gate-history-selector-quality-44m-5m.json)" = "9e5fd7d06eeee420d60318bee72de3b16e7e877247102a2b505453ab0b8a4522"
      - name: Run active anomaly research
        env:
          RESEARCH_DATASET: /tmp/gate-history-selector-quality-44m-5m.json
          RESEARCH_OUTPUT: /tmp/active-anomaly-result.json
        run: node /tmp/active-anomaly.mjs
      - name: Print result
        run: jq '{decision,eventCounts,qualified,heldOutChecks,accepted}' /tmp/active-anomaly-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: anomaly-clean-lab-result
          path: /tmp/active-anomaly-result.json
          retention-days: 7
