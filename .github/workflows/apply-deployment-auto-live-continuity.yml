name: Apply deployment Auto Live continuity patch

on:
  push:
    branches:
      - deployment-auto-live-continuity-2026-08-26
    paths:
      - scripts/apply-deployment-auto-live-continuity.mjs
      - .github/workflows/apply-deployment-auto-live-continuity.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[deployment-continuity-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deployment-auto-live-continuity-2026-08-26
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: node scripts/apply-deployment-auto-live-continuity.mjs
      - name: Commit patched production code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.ts lib/live-trading-engine.ts tests/live-deployment-safety.test.ts
          git commit -m "[deployment-continuity-applied] Preserve Auto Live across deployments"
          git push origin HEAD:deployment-auto-live-continuity-2026-08-26
