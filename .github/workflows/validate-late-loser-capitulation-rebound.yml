name: Validate Late Loser Capitulation Rebound
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-late-loser-capitulation-rebound.mjs"
      - ".github/workflows/validate-late-loser-capitulation-rebound.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Run frozen capitulation rebound audit
        run: node --max-old-space-size=4096 scripts/research-late-loser-capitulation-rebound.mjs
      - name: Print result
        run: jq '{decision,eventCount,capitulationCount,discoverySelected,selected:.grid[.discoverySelected]}' /tmp/late-loser-capitulation-rebound.json
      - uses: actions/upload-artifact@v4
        with:
          name: late-loser-capitulation-rebound
          path: |
            /tmp/late-loser-capitulation-rebound.json
            /tmp/late-loser-capitulation-trades.json
          retention-days: 7
