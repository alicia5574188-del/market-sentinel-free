name: Extremum Regime Research

on:
  pull_request:
    paths:
      - "research/collect-extremum-regime-dataset.mjs"
      - ".github/workflows/extremum-regime-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Collect independent public futures candles
        run: node research/collect-extremum-regime-dataset.mjs
      - name: Upload research dataset
        uses: actions/upload-artifact@v4
        with:
          name: extremum-regime-dataset
          path: extremum-regime-dataset.json
          if-no-files-found: error
          retention-days: 7
