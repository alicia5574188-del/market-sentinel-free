name: Membership Baseline Read Only
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/member-baseline-capture.yml']
permissions:
  contents: read
jobs:
  capture:
    if: github.head_ref == 'feature/isolated-member-keys'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read existing primary source and owner intent only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p member-baseline
          base='https://market-sentinel-free.alicia5574188.workers.dev'
          curl -fsS --retry 2 --max-time 20 "$base/__health" > member-baseline/health.json
          curl -fsS --retry 2 --max-time 20 "$base/api/forward/export" > member-baseline/export.json
          curl -fsS --retry 2 --max-time 20 "$base/api/runtime" > member-baseline/runtime.json
          git rev-parse HEAD > member-baseline/source.txt
          date -u +'%Y-%m-%dT%H:%M:%SZ' > member-baseline/time.txt
          jq '{buildSha,owner:.liveMode,activation:.liveMirror.enabledAt,paper:{start:.forward.startedAt,policy:.forward.policyVersion,resolved:.forward.resolved,positions:(.forward.positions|length),storage:.forward.storage}}' member-baseline/runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member-baseline-${{ github.run_id }}
          path: member-baseline/
          retention-days: 7
          if-no-files-found: error
