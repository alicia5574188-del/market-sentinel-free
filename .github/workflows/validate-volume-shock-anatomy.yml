name: Validate Volume Shock Anatomy
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-volume-shock-anatomy.mjs"
      - ".github/workflows/validate-volume-shock-anatomy.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Check syntax
        run: node --check scripts/research-volume-shock-anatomy.mjs
      - name: Run volume shock anatomy audit
        run: node --max-old-space-size=4096 scripts/research-volume-shock-anatomy.mjs
      - name: Print focused result
        run: jq '{decision,rule,rawEvents,accepted,configs,combined}' /tmp/volume-shock-anatomy.json
      - uses: actions/upload-artifact@v4
        with:
          name: volume-shock-anatomy
          path: |
            /tmp/volume-shock-anatomy.json
            /tmp/volume-shock-events.json
          retention-days: 7
