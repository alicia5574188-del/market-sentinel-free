name: Verify Operational Records and Settlement
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ui-records-stage.yml'
      - 'scripts/ui-records-apply.py'
      - 'scripts/ui-records-transfer-*.b64'
permissions:
  contents: write
jobs:
  stage:
    if: github.head_ref == 'fix/clean-ui-records-pnl' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply exact tested bytes and remove temporary capture/transfer
        run: |
          mkdir -p /tmp/ui-records-verified
          cp scripts/ui-records-transfer-*.b64 /tmp/ui-records-verified/
          python scripts/ui-records-apply.py
          git rm --ignore-unmatch scripts/ui-records-transfer-1.b64 scripts/ui-records-transfer-2.b64 scripts/ui-records-apply.py .github/workflows/ui-records-stage.yml .github/workflows/ui-records-workspace.yml
      - name: Verify member isolation, original ten methods and read-only settlement
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee /tmp/ui-records-verified/install.log
          npm run test:direct 2>&1 | tee /tmp/ui-records-verified/direct.log
          npm test 2>&1 | tee /tmp/ui-records-verified/build-test.log
          npm run typecheck 2>&1 | tee /tmp/ui-records-verified/typecheck.log
          npm run lint 2>&1 | tee /tmp/ui-records-verified/lint.log
          npx wrangler deploy --dry-run --config dist/server/wrangler.json 2>&1 | tee /tmp/ui-records-verified/dry-run.log
          git diff --check
          git add -A
          git diff --cached --check
      - name: Read public primary baseline only
        run: |
          curl -fsS --retry 2 --max-time 20 'https://market-sentinel-free.alicia5574188.workers.dev/__health' > /tmp/ui-records-verified/health-before.json
          date -u +'%Y-%m-%dT%H:%M:%SZ' > /tmp/ui-records-verified/time.txt
      - name: Store independently verified blobs; no ref or production mutation
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');
            const {owner,repo}=context.repo,parent=context.payload.pull_request.head.sha,branch=context.payload.pull_request.head.ref;
            const current=await github.rest.repos.getBranch({owner,repo,branch});
            if(current.data.commit.sha!==parent)throw new Error('Head changed during verification');
            const base=await github.rest.git.getCommit({owner,repo,commit_sha:parent});
            const names=cp.execFileSync('git',['diff','--cached','--name-only','-z']).toString().split('\0').filter(Boolean),tree=[],sha256={};
            for(const path of names){
              if(!fs.existsSync(path)){tree.push({path,mode:'100644',type:'blob',sha:null});continue;}
              const bytes=fs.readFileSync(path),blob=await github.rest.git.createBlob({owner,repo,content:bytes.toString('base64'),encoding:'base64'});
              const expected=crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex');
              if(blob.data.sha!==expected)throw new Error('Blob mismatch: '+path);
              tree.push({path,mode:'100644',type:'blob',sha:blob.data.sha});sha256[path]=crypto.createHash('sha256').update(bytes).digest('hex');
            }
            const result={parent,baseTree:base.data.tree.sha,tree,sha256,runId:context.runId,branchRefUnchanged:true,productionUnchanged:true};
            fs.writeFileSync('/tmp/ui-records-verified/verified-tree.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-records-verified-${{ github.run_id }}
          path: /tmp/ui-records-verified/
          retention-days: 7
          if-no-files-found: warn
