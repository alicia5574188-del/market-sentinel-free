name: HTE31 Paper Epoch Reset Once

on:
  push:
    branches:
      - feature/hte31-paper-epoch-reset
    paths:
      - .github/workflows/hte31-paper-epoch-reset-once.yml
      - scripts/apply-hte31-paper-epoch-reset.py

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hte31-paper-epoch-reset
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Apply paper epoch reset
        run: python3 scripts/apply-hte31-paper-epoch-reset.py
      - name: Install
        run: npm run install:ci
      - name: Focused reset tests
        run: node --test tests/hte31-paper-epoch-reset.test.mjs tests/hte31-clean-rebuild.test.mjs tests/human-trader-ui.test.mjs
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Remove bootstrap files
        run: rm scripts/apply-hte31-paper-epoch-reset.py .github/workflows/hte31-paper-epoch-reset-once.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[paper-epoch-reset-applied] Add paper capital reset epochs"
          git push origin HEAD:feature/hte31-paper-epoch-reset
