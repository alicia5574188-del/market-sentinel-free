name: Wide Passive Fill Markout Research

on:
  pull_request:
    paths:
      - 'scripts/research-wide-passive-fill-markout.mjs'
      - '.github/workflows/wide-passive-fill-markout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Syntax check
        run: node --check scripts/research-wide-passive-fill-markout.mjs
      - name: Run wide-passive fill/markout screen
        env:
          RESEARCH_OUTPUT: /tmp/wide-passive-fill-markout.json
        run: node scripts/research-wide-passive-fill-markout.mjs
      - name: Print result
        run: jq '{research,decision,protocol,validHours,invalidHours,preQualifiedOffsetsBps,evaluationOpened,evaluation,eraAggregates,sha256}' /tmp/wide-passive-fill-markout.json
      - uses: actions/upload-artifact@v4
        with:
          name: wide-passive-fill-markout
          path: /tmp/wide-passive-fill-markout.json
          retention-days: 7
