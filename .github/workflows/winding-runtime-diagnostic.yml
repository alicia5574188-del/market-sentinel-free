name: Winding runtime diagnostic

on:
  push:
    branches: [fix/winding-anchor-space-20260922]
    paths:
      - ".github/workflows/winding-runtime-diagnostic.yml"

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  DIAG_WORKER_NAME: market-sentinel-winding-diag-once

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Read production forward snapshot through isolated bridge
        run: |
          set -euo pipefail
          mkdir -p .ops-diag
          cat > .ops-diag/worker.mjs <<'JS'
          export default {
            async fetch(_request, env) {
              const stub = env.MARKET_STREAM.getByName("primary");
              return stub.fetch("https://market-stream/forward-export");
            },
          };
          JS
          cat > .ops-diag/wrangler.toml <<EOF
          name = "$DIAG_WORKER_NAME"
          main = "worker.mjs"
          compatibility_date = "2026-09-22"
          workers_dev = true

          [[durable_objects.bindings]]
          name = "MARKET_STREAM"
          class_name = "MarketStream"
          script_name = "market-sentinel-free"
          EOF
          cleanup() {
            npx wrangler delete --config .ops-diag/wrangler.toml --force >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          npx wrangler deploy --config .ops-diag/wrangler.toml >/dev/null
          url="https://$DIAG_WORKER_NAME.alicia5574188.workers.dev/"
          code=""
          for attempt in {1..15}; do
            code="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/forward.json" -w '%{http_code}' "$url" || true)"
            [[ "$code" == "200" ]] && break
            sleep 2
          done
          [[ "$code" == "200" ]]
          jq -c '{
            exportedAt,
            account:{
              startedAt:.forward.startedAt,
              equity:.forward.equity,
              resolved:.forward.resolved,
              open:(.forward.positions|length),
              turnover:.forward.turnover
            },
            fit:.forward.fitDiagnostics,
            diagnostics:.forward.entryDiagnostics,
            candidateCount:(.forward.entryOpportunities|length),
            eligibleCount:([.forward.entryOpportunities[]?|select(.eligible==true)]|length),
            top:[.forward.entryOpportunities[]?|{
              symbol,timeframe,side,score,eligible,
              anchorPrice,anchorQuality,
              backToAnchor:.distanceFromAnchorRate,
              targetPrice,targetType,targetDistanceRate,
              edgeRatio,netRemainingSpaceRate,executionScore,reason
            }][0:16]
          }' "$RUNNER_TEMP/forward.json"
