name: Anomaly Clean Lab
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/anomaly-clean-lab.yml"
permissions:
  contents: read
jobs:
  active-research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Fetch canonical 44-month Gate 5m core universe
        env:
          RESEARCH_INTERVAL: 5m
          RESEARCH_DATASET: /tmp/gate-history-route-44m-5m.json
          RESEARCH_MONTHS: 202301,202302,202303,202304,202305,202306,202307,202308,202309,202310,202311,202312,202401,202402,202403,202404,202405,202406,202407,202408,202409,202410,202411,202412,202501,202502,202503,202504,202505,202506,202507,202508,202509,202510,202511,202512,202601,202602,202603,202604,202605,202606,202607,202608
          RESEARCH_SYMBOLS: BTC_USDT,ETH_USDT,SOL_USDT,XRP_USDT,BNB_USDT,DOGE_USDT,ADA_USDT,LINK_USDT,LTC_USDT,AVAX_USDT,BCH_USDT
          RESEARCH_MIN_CONTRACTS: 11
          RESEARCH_MIN_MONTH_COVERAGE: 0.70
          RESEARCH_CONCURRENCY: 16
        run: node scripts/fetch-gate-history.mjs
      - name: Aggregate canonical 1h signal dataset
        env:
          RESEARCH_DATASET: /tmp/gate-history-route-44m-5m.json
          RESEARCH_OUTPUT: /tmp/gate-history-route-44m-1h.json
          RESEARCH_MAX_FILL_HOURS: 3
        run: node scripts/aggregate-gate-history.mjs
      - name: Assert canonical hashes
        run: |
          test "$(jq -r .sha256 /tmp/gate-history-route-44m-5m.json)" = "9e5fd7d06eeee420d60318bee72de3b16e7e877247102a2b505453ab0b8a4522"
          test "$(jq -r .sha256 /tmp/gate-history-route-44m-1h.json)" = "185bd97b968f96373bef6a174c8258d8ad5606a0d1ed824eaa2cc1ace1efa053"
      - name: Prepare frozen regime engine with research export hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/research-regime-system-portfolios.mjs')
          s=p.read_text()
          marker='const report = { generatedAt: new Date().toISOString(),'
          if marker not in s:
              raise SystemExit('report marker not found')
          hook=r'''
          function routeRelax(config, factor, suffix) {
            const row = { ...config, id: `${config.id}__${suffix}` };
            for (const key of ["relative7","relative24","confirm24","confirm6","symbol24","symbol30","volume","resume6","reversal6","rebound6","impulse6","drop24","pullbackMin","sweep","reclaim"]) {
              if (Number.isFinite(row[key]) && row[key] > 0) row[key] *= factor;
            }
            if (Number.isFinite(row.pullbackMax) && row.pullbackMax > 0) row.pullbackMax *= (2 - factor);
            if (Number.isFinite(row.breadth) && row.breadth > 0.5) row.breadth = 0.5 + (row.breadth - 0.5) * factor;
            if (Number.isFinite(row.edge) && row.edge > 0) row.edge = Math.min(0.49, row.edge * (2 - factor));
            return row;
          }
          const slimConfig = (c) => ({ id:c.id, tactic:c.tactic, system:c.system, riskRate:c.riskRate,
            notionalMultiple:c.notionalMultiple, minNotionalMultiple:c.minNotionalMultiple, cooldownHours:c.cooldownHours });
          const routeSystems = candidateSystems.map((system) => {
            const baseConfigs = system.selectedStrategies;
            const relax10 = baseConfigs.map((c) => routeRelax(c, 0.90, "RELAX10"));
            const relax20 = baseConfigs.map((c) => routeRelax(c, 0.80, "RELAX20"));
            return { system:system.system,
              configs:[...baseConfigs,...relax10,...relax20].map(slimConfig),
              baseline:baseConfigs.flatMap((c) => rawTrades(c, toMs)),
              relax10:relax10.flatMap((c) => rawTrades(c, toMs)),
              relax20:relax20.flatMap((c) => rawTrades(c, toMs)),
              expected:{ discovery:{trades:system.discovery.trades,netPnl:system.discovery.netPnl,profitFactor:system.discovery.profitFactor},
                validation:{trades:system.validation.trades,netPnl:system.validation.netPnl,profitFactor:system.validation.profitFactor},
                evaluation:{trades:system.evaluation.trades,netPnl:system.evaluation.netPnl,profitFactor:system.evaluation.profitFactor} } };
          });
          writeFileSync('/tmp/anomaly-route-export.json', JSON.stringify({ months:signalRaw.months, fromMs, toMs, discoveryEnd, validationEnd, systems:routeSystems }));
          '''
          s=s.replace(marker,hook+'\n'+marker,1)
          Path('/tmp/regime-route-base.mjs').write_text(s)
          PY
      - name: Run frozen regime engine and export candidate trades
        env:
          RESEARCH_SIGNAL_DATASET: /tmp/gate-history-route-44m-1h.json
          RESEARCH_EXECUTION_DATASET: /tmp/gate-history-route-44m-5m.json
          RESEARCH_OUTPUT: /tmp/regime-route-base-report.json
        run: node /tmp/regime-route-base.mjs
      - name: Run anomaly-routed regime audit
        run: |
          cat > /tmp/anomaly-route-audit.mjs <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          const raw=JSON.parse(readFileSync('/tmp/gate-history-route-44m-5m.json','utf8'));
          const exp=JSON.parse(readFileSync('/tmp/anomaly-route-export.json','utf8'));
          const sum=xs=>xs.reduce((a,b)=>a+b,0);
          const median=xs=>{if(!xs.length)return 0;const ys=[...xs].sort((a,b)=>a-b),m=Math.floor(ys.length/2);return ys.length%2?ys[m]:(ys[m-1]+ys[m])/2;};
          const monthStart=m=>Date.UTC(Number(m.slice(0,4)),Number(m.slice(4,6))-1,1);
          const lowerBound=(rows,t)=>{let lo=0,hi=rows.length;while(lo<hi){const m=Math.floor((lo+hi)/2);if(rows[m].time<t)lo=m+1;else hi=m;}return lo;};
          const bySymbol=new Map(raw.datasets.map(d=>[d.symbol,d.rows]));
          const specialCache=new Map();
          function specialAt(openedAt){
            const signalTime=Math.floor(openedAt/1000)-300;
            if(specialCache.has(signalTime))return specialCache.get(signalTime);
            const xs=[];
            for(const [symbol,rows] of bySymbol){
              const i=lowerBound(rows,signalTime);
              if(rows[i]?.time!==signalTime||i<48||rows[i-12]?.time!==signalTime-3600||rows[i-48]?.time!==signalTime-14400)continue;
              xs.push({symbol,r1:rows[i].close/rows[i-12].close-1,r4:rows[i].close/rows[i-48].close-1});
            }
            if(xs.length<9){specialCache.set(signalTime,new Map());return specialCache.get(signalTime);}
            const m1=median(xs.map(x=>x.r1)),m4=median(xs.map(x=>x.r4));
            for(const x of xs){x.rel1=x.r1-m1;x.rel4=x.r4-m4;}
            const s1=Math.max(0.001,median(xs.map(x=>Math.abs(x.rel1)))),s4=Math.max(0.001,median(xs.map(x=>Math.abs(x.rel4))));
            const p1=[...xs].sort((a,b)=>Math.abs(b.rel1)-Math.abs(a.rel1))[0];
            const p4=[...xs].sort((a,b)=>Math.abs(b.rel4)-Math.abs(a.rel4))[0];
            const out=new Map(xs.map(x=>[x.symbol,{p1:x.symbol===p1.symbol&&Math.abs(x.rel1)>=0.006&&Math.abs(x.rel1)/s1>=1.8,
              p4:x.symbol===p4.symbol&&Math.abs(x.rel4)>=0.012&&Math.abs(x.rel4)/s4>=1.8,
              score:Math.max(Math.abs(x.rel1)/s1,Math.abs(x.rel4)/s4),rel1:x.rel1,rel4:x.rel4}]));
            specialCache.set(signalTime,out);return out;
          }
          const rootId=id=>id.replace(/__(RELAX10|RELAX20)$/,'');
          const configMap=new Map(exp.systems.flatMap(s=>s.configs).map(c=>[c.id,c]));
          function annotate(rows,source){return rows.map(t=>{const sp=specialAt(t.openedAt).get(t.symbol)??{p1:false,p4:false,score:0};return{...t,source,rootId:rootId(t.strategyId),specialP1:sp.p1,specialP4:sp.p4,specialUnion:sp.p1||sp.p4,specialScore:sp.score};});}
          function buildRows(pack,variant){
            const base=annotate(pack.baseline,'BASE');
            if(variant.relax===0)return base;
            const extra=annotate(variant.relax===10?pack.relax10:pack.relax20,`RELAX${variant.relax}`).filter(t=>t.specialUnion);
            const seen=new Map();
            for(const t of base)seen.set(`${t.rootId}|${t.symbol}|${t.openedAt}|${t.side}`,t);
            for(const t of extra){const k=`${t.rootId}|${t.symbol}|${t.openedAt}|${t.side}`;if(!seen.has(k))seen.set(k,t);}
            return [...seen.values()];
          }
          function replay(pack,variant,scenario='base'){
            let equity=1000,peak=equity,maxDrawdown=0;const open=[],accepted=[],cooldown=new Map();
            const rows=buildRows(pack,variant).sort((a,b)=>a.openedAt-b.openedAt||b.strength-a.strength);
            const settle=time=>{for(const t of open.filter(x=>x.closedAt<=time).sort((a,b)=>a.closedAt-b.closedAt)){equity+=t.netPnl;peak=Math.max(peak,equity);maxDrawdown=Math.max(maxDrawdown,(peak-equity)/peak);open.splice(open.indexOf(t),1);const c=configMap.get(t.strategyId);cooldown.set(`${t.rootId}:${t.symbol}`,t.closedAt+(c?.cooldownHours??24)*3600000);}};
            for(let i=0;i<rows.length;){const openedAt=rows[i].openedAt;settle(openedAt);const same=[];while(i<rows.length&&rows[i].openedAt===openedAt)same.push(rows[i++]);
              same.sort((a,b)=>variant.priority?(Number(b.specialUnion)-Number(a.specialUnion)||b.specialScore-a.specialScore||b.strength-a.strength):(b.strength-a.strength));
              for(const t of same){const c=configMap.get(t.strategyId);if(!c||equity<=100||open.some(x=>x.symbol===t.symbol)||(cooldown.get(`${t.rootId}:${t.symbol}`)??0)>t.openedAt)continue;
                const sameSide=open.filter(x=>x.side===t.side);const friction=scenario==='stress'?0.0022:0.0014;const penalty=scenario==='stress'?0.0008:scenario==='adverse'?0.00025:0;
                const multiple=Math.min(c.notionalMultiple,c.riskRate/Math.max(t.stopRate+friction,1e-9));if(multiple<c.minNotionalMultiple)continue;const notional=equity*multiple,plannedRisk=notional*(t.stopRate+friction);
                if(sum(open.map(x=>x.plannedRisk))+plannedRisk>equity*0.10||sum(sameSide.map(x=>x.plannedRisk))+plannedRisk>equity*0.065)continue;
                const at={...t,notional,plannedRisk,netPnl:notional*(t.netReturnRate-penalty)};open.push(at);accepted.push(at);
              }}settle(Infinity);return{trades:accepted,endEquity:equity,maxDrawdown};
          }
          function period(account,start,end,startEq=1000){const rows=account.trades.filter(t=>t.openedAt>=start&&t.openedAt<end),g=rows.filter(t=>t.netPnl>0),l=rows.filter(t=>t.netPnl<=0);let eq=startEq,pk=eq,dd=0;for(const t of [...rows].sort((a,b)=>a.closedAt-b.closedAt)){eq+=t.netPnl;pk=Math.max(pk,eq);dd=Math.max(dd,(pk-eq)/Math.max(pk,1e-9));}return{trades:rows.length,tradesPerDay:rows.length/Math.max(1,(end-start)/86400000),netPnl:sum(rows.map(t=>t.netPnl)),profitFactor:l.length?sum(g.map(t=>t.netPnl))/Math.abs(sum(l.map(t=>t.netPnl))):g.length?99:0,maxDrawdown:dd};}
          function combined(variant,scenario){const accounts=exp.systems.map(p=>({system:p.system,account:replay(p,variant,scenario)}));const trades=accounts.flatMap(x=>x.account.trades.map(t=>({...t,systemOwner:x.system}))).sort((a,b)=>a.closedAt-b.closedAt);return{accounts,trades};}
          function combinedPeriod(row,start,end){const rows=row.trades.filter(t=>t.openedAt>=start&&t.openedAt<end),g=rows.filter(t=>t.netPnl>0),l=rows.filter(t=>t.netPnl<=0);let eq=5000,pk=eq,dd=0;for(const t of [...rows].sort((a,b)=>a.closedAt-b.closedAt)){eq+=t.netPnl;pk=Math.max(pk,eq);dd=Math.max(dd,(pk-eq)/Math.max(pk,1e-9));}return{trades:rows.length,tradesPerDay:rows.length/Math.max(1,(end-start)/86400000),netPnl:sum(rows.map(t=>t.netPnl)),profitFactor:l.length?sum(g.map(t=>t.netPnl))/Math.abs(sum(l.map(t=>t.netPnl))):g.length?99:0,maxDrawdown:dd,positiveSystems:row.accounts.filter(x=>period(x.account,start,end).netPnl>0).length};}
          const variants=[{id:'BASE',relax:0,priority:false},{id:'PRIORITY',relax:0,priority:true},{id:'RELAX10',relax:10,priority:false},{id:'RELAX10_PRIORITY',relax:10,priority:true},{id:'RELAX20',relax:20,priority:false},{id:'RELAX20_PRIORITY',relax:20,priority:true}];
          const scenarios=['base','stress','adverse'];
          const results={};
          for(const v of variants){results[v.id]={variant:v};for(const sc of scenarios){const c=combined(v,sc);results[v.id][sc]={discovery:combinedPeriod(c,exp.fromMs,exp.discoveryEnd),validation:combinedPeriod(c,exp.discoveryEnd,exp.validationEnd),evaluation:combinedPeriod(c,exp.validationEnd,exp.toMs),full:combinedPeriod(c,exp.fromMs,exp.toMs)};}}
          const base=results.BASE.base.discovery;
          const discoveryQualified=variants.filter(v=>v.relax>0).map(v=>{const r=results[v.id],d=r.base.discovery,ds=r.stress.discovery,da=r.adverse.discovery;const uplift=d.trades/Math.max(base.trades,1)-1;const ok=uplift>=0.10&&d.netPnl>=base.netPnl*0.95&&d.profitFactor>=Math.max(1.05,base.profitFactor*0.90)&&d.maxDrawdown<=Math.max(0.20,base.maxDrawdown*1.25)&&d.positiveSystems>=4&&ds.netPnl>0&&ds.profitFactor>=1&&da.netPnl>0&&da.profitFactor>=1;const score=ok?uplift*2+Math.log(Math.max(d.profitFactor,1)):null;return{id:v.id,ok,uplift,score};}).filter(x=>x.ok).sort((a,b)=>b.score-a.score);
          const selected=discoveryQualified[0]?.id??null;
          let heldOut=null,decision='NO_RELEASE';
          if(selected){const r=results[selected],b=results.BASE;const gate=(x,s)=>x.trades>0&&x.netPnl>0&&x.profitFactor>=(s?1:1.03)&&x.maxDrawdown<=0.20;const valU=r.base.validation.trades/Math.max(b.base.validation.trades,1)-1,evalU=r.base.evaluation.trades/Math.max(b.base.evaluation.trades,1)-1;heldOut={validationUplift:valU,evaluationUplift:evalU,validationPass:valU>=0.05&&gate(r.base.validation,false)&&gate(r.stress.validation,true)&&gate(r.adverse.validation,true),evaluationPass:evalU>=0.05&&gate(r.base.evaluation,false)&&gate(r.stress.evaluation,true)&&gate(r.adverse.evaluation,true)};if(heldOut.validationPass&&heldOut.evaluationPass)decision='FORWARD_CANDIDATE';}
          const parity=Object.fromEntries(exp.systems.map(p=>{const a=replay(p,{id:'BASE',relax:0,priority:false},'base');return[p.system,{expected:p.expected,actual:{discovery:period(a,exp.fromMs,exp.discoveryEnd),validation:period(a,exp.discoveryEnd,exp.validationEnd),evaluation:period(a,exp.validationEnd,exp.toMs)}}];}));
          const out={research:'anomaly-routed-regime-engine',selector:'validated PRICE1 or PRICE4 top cross-sectional outlier at the last completed 5m bar',variants,protocol:'relax 10% or 20% only for extra signals on current special coins; select one candidate using discovery only; validation/evaluation are pass-fail',parity,results,discoveryQualified,selected,heldOut,decision,stressNote:'quick audit approximates higher friction by subtracting 8bp and using 22bp in sizing; doubled-entry adverse is approximated by an additional 2.5bp return penalty. Exact stress replay is required if a candidate survives.'};
          writeFileSync('/tmp/anomaly-route-result.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({decision,selected,heldOut,discoveryQualified,summary:Object.fromEntries(Object.entries(results).map(([k,v])=>[k,{discovery:v.base.discovery,validation:v.base.validation,evaluation:v.base.evaluation,stressValidation:v.stress.validation,stressEvaluation:v.stress.evaluation}]))},null,2));
          EOF
          node /tmp/anomaly-route-audit.mjs
      - name: Print compact result
        run: jq '{decision,selected,heldOut,discoveryQualified,summary:(.results|with_entries(.value={discovery:.value.base.discovery,validation:.value.base.validation,evaluation:.value.base.evaluation,stressValidation:.value.stress.validation,stressEvaluation:.value.stress.evaluation}))}' /tmp/anomaly-route-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: anomaly-routed-regime-engine-44m
          path: |
            /tmp/anomaly-route-result.json
            /tmp/regime-route-base-report.json
          retention-days: 7
