name: Regime Satellite Layer Research

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-regime-satellite-layer.mjs"
      - ".github/workflows/regime-satellite-layer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Fetch coverage-qualified current 12-month Gate 5m universe
        env:
          RESEARCH_INTERVAL: 5m
          RESEARCH_DATASET: /tmp/gate-history-expanded-12m.json
          RESEARCH_MONTHS: 202509,202510,202511,202512,202601,202602,202603,202604,202605,202606,202607,202608
          RESEARCH_SYMBOLS: BTC_USDT,ETH_USDT,SOL_USDT,XRP_USDT,BNB_USDT,DOGE_USDT,ADA_USDT,LINK_USDT,LTC_USDT,AVAX_USDT,BCH_USDT,SUI_USDT,UNI_USDT,DOT_USDT,ZEC_USDT,STORJ_USDT,LSK_USDT
          RESEARCH_MIN_CONTRACTS: 12
          RESEARCH_MIN_MONTH_COVERAGE: 0.98
          RESEARCH_CONCURRENCY: 12
        run: node scripts/fetch-gate-history.mjs
      - name: Run isolated satellite execution research
        env:
          RESEARCH_DATASET: /tmp/gate-history-expanded-12m.json
          SATELLITE_OUTPUT: /tmp/regime-satellite-layer.json
        run: node --experimental-strip-types scripts/research-regime-satellite-layer.mjs
      - name: Print satellite decision
        run: jq '{satelliteLayerCandidate,coreContextSymbols,satelliteSymbols,base,stress,adverse,tradesPerDay,combinedLogicalTradesPerDay,gates}' /tmp/regime-satellite-layer.json
      - uses: actions/upload-artifact@v4
        with:
          name: regime-satellite-layer-research
          path: /tmp/regime-satellite-layer.json
          retention-days: 7
