name: Anomaly Clean Lab
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/anomaly-clean-lab.yml"
permissions:
  contents: read
jobs:
  active-research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Fetch canonical 44-month Gate 5m core universe
        env:
          RESEARCH_INTERVAL: 5m
          RESEARCH_DATASET: /tmp/gate-history-router-44m-5m.json
          RESEARCH_MONTHS: 202301,202302,202303,202304,202305,202306,202307,202308,202309,202310,202311,202312,202401,202402,202403,202404,202405,202406,202407,202408,202409,202410,202411,202412,202501,202502,202503,202504,202505,202506,202507,202508,202509,202510,202511,202512,202601,202602,202603,202604,202605,202606,202607,202608
          RESEARCH_SYMBOLS: BTC_USDT,ETH_USDT,SOL_USDT,XRP_USDT,BNB_USDT,DOGE_USDT,ADA_USDT,LINK_USDT,LTC_USDT,AVAX_USDT,BCH_USDT
          RESEARCH_MIN_CONTRACTS: 11
          RESEARCH_MIN_MONTH_COVERAGE: 0.70
          RESEARCH_CONCURRENCY: 16
        run: node scripts/fetch-gate-history.mjs
      - name: Aggregate canonical 1h signal dataset
        env:
          RESEARCH_DATASET: /tmp/gate-history-router-44m-5m.json
          RESEARCH_OUTPUT: /tmp/gate-history-router-44m-1h.json
          RESEARCH_MAX_FILL_HOURS: 3
        run: node scripts/aggregate-gate-history.mjs
      - name: Assert canonical hashes
        run: |
          test "$(jq -r .sha256 /tmp/gate-history-router-44m-5m.json)" = "9e5fd7d06eeee420d60318bee72de3b16e7e877247102a2b505453ab0b8a4522"
          test "$(jq -r .sha256 /tmp/gate-history-router-44m-1h.json)" = "185bd97b968f96373bef6a174c8258d8ad5606a0d1ed824eaa2cc1ace1efa053"
      - name: Export exact frozen hourly regime ownership and context
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/research-regime-system-portfolios.mjs').read_text()
          marker='const common = { riskRate: 0.015, notionalMultiple: 0.5, minNotionalMultiple: 0.05,'
          hook=r'''
          const routeStateMap = [];
          const routeSeen = new Set();
          for (const row of observations) {
            if (routeSeen.has(row.time)) continue;
            routeSeen.add(row.time);
            routeStateMap.push({ time: row.time, system: row.system, context: row.context });
          }
          writeFileSync('/tmp/regime-state-map.json', JSON.stringify({ states: routeStateMap }));
          process.exit(0);
          '''
          if marker not in s: raise SystemExit('state marker not found')
          Path('/tmp/regime-state-only.mjs').write_text(s.replace(marker,hook+'\n'+marker,1))
          PY
      - name: Build hourly state map
        env:
          RESEARCH_SIGNAL_DATASET: /tmp/gate-history-router-44m-1h.json
          RESEARCH_EXECUTION_DATASET: /tmp/gate-history-router-44m-5m.json
          RESEARCH_OUTPUT: /tmp/unused.json
        run: node /tmp/regime-state-only.mjs
      - name: Recover validated router and add cadence layer
        run: |
          git show HEAD^:.github/workflows/anomaly-clean-lab.yml > /tmp/previous-lab.yml
          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/previous-lab.yml').read_text()
          start="cat > /tmp/anomaly-router.mjs <<'EOF'\n"
          a=text.index(start)+len(start)
          b=text.index("\n          EOF",a)
          js=text[a:b]
          js='\n'.join(line[10:] if line.startswith('          ') else line for line in js.splitlines())+'\n'
          old="function portfolio(selector,friction=0.0014,slippage=0.00025){const rows=candidates.filter(x=>selector==='P1'?x.p1:selector==='P4'?x.p4:(x.p1||x.p4)).sort((a,b)=>a.openedAt-b.openedAt||b.specialScore-a.specialScore||b.strength-a.strength);"
          new="function portfolio(key,friction=0.0014,slippage=0.00025){const [selector,cadenceText]=key.split('_'),cadence=Number(cadenceText);const rows=candidates.filter(x=>(selector==='P1'?x.p1:selector==='P4'?x.p4:(x.p1||x.p4))&&Math.floor(x.openedAt/1000)%cadence===0).sort((a,b)=>a.openedAt-b.openedAt||b.specialScore-a.specialScore||b.strength-a.strength);"
          if old not in js: raise SystemExit('portfolio marker not found')
          js=js.replace(old,new,1)
          old2="const selectors=['P1','P4','UNION'],scenarios={base:[0.0014,0.00025],stress:[0.0022,0.00025],adverse:[0.0014,0.0005]},results={},accounts={};"
          new2="const selectors=['P1_900','P4_900','UNION_900','P1_1800','P4_1800','UNION_1800','P1_3600','P4_3600','UNION_3600'],scenarios={base:[0.0014,0.00025],stress:[0.0022,0.00025],adverse:[0.0014,0.0005]},results={},accounts={};"
          if old2 not in js: raise SystemExit('selector marker not found')
          js=js.replace(old2,new2,1)
          js=js.replace("d.tradesPerDay>=1.5","d.tradesPerDay>=0.35")
          js=js.replace("research:'5m-anomaly-routed-regime-system'","research:'cadence-anomaly-routed-regime-system'")
          js=js.replace("premise:'keep frozen hourly regime ownership and frozen selected tactics; use repaired 1h regime context for long-history parity while scanning validated PRICE1/PRICE4 special candidates on completed 5m bars'","premise:'keep frozen hourly regime ownership, frozen selected tactics and validated PRICE1/PRICE4 specialness; compare the identical candidate stream at 15m, 30m and 60m admission boundaries'")
          js=js.replace("protocolNote:'No strategy parameter is tuned. Long-horizon regime context comes from the canonical aggregated 1h dataset; raw 5m data supplies specialness, current-symbol returns and execution. The router is an independent sixth system; production/PAPER/LIVE are unchanged.'","protocolNote:'No strategy parameter or specialness threshold is tuned. Discovery selects among preregistered 15m/30m/60m cadence and P1/P4/union variants; validation/evaluation are pass-fail. The router remains an independent sixth system; production/PAPER/LIVE are unchanged.'")
          Path('/tmp/anomaly-cadence-router.mjs').write_text(js)
          PY
      - name: Run cadence audit
        run: node /tmp/anomaly-cadence-router.mjs
      - name: Print compact result
        run: jq '{decision,selected,heldOut,synchronizedBars,specialBars,candidateSignals,discoveryQualified,summary:(.results|with_entries(.value={discovery:.value.base.discovery,validation:.value.base.validation,evaluation:.value.base.evaluation,stressValidation:.value.stress.validation,stressEvaluation:.value.stress.evaluation}))}' /tmp/anomaly-router-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: anomaly-cadence-router-44m
          path: /tmp/anomaly-router-result.json
          retention-days: 7
