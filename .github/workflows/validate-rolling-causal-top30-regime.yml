name: Validate Rolling Causal Top30 Regime
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-rolling-causal-top30-regime.mjs"
      - ".github/workflows/validate-rolling-causal-top30-regime.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Run rolling causal Top30 frozen-regime audit
        run: node --max-old-space-size=6144 scripts/research-rolling-causal-top30-regime.mjs
      - name: Print summary
        run: jq '{decision,activeByMonth,systems,combined:{external:.combined.external.base,stress:.combined.external.higherCost,core11Baseline:.combined.core11Baseline.base}}' /tmp/rolling-top30-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: rolling-causal-top30-regime
          path: |
            /tmp/rolling-top30-summary.json
            /tmp/rolling-top30-selection.json
            /tmp/rolling-regime-result.json
          retention-days: 7