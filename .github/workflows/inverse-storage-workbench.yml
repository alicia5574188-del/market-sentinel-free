name: Inverse storage envelope verification
on:
  push:
    branches: [fix/20261001-inverse-storage-envelope]
    paths: [.github/workflows/inverse-storage-workbench.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20261001-inverse-storage-envelope
          fetch-depth: 0
      - name: Apply exact bounded envelope and regression edits
        id: apply
        run: |
          python3 - <<'PY'
          import pathlib,subprocess
          p=pathlib.Path('lib/forward-store.ts')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='fcaf99744d9ee28d967289a873282161f79a80b0'
          s=p.read_text()
          def replace(old,new):
              global s
              assert s.count(old)==1,old
              s=s.replace(old,new)
          replace('export const FORWARD_ACCOUNT_TARGET_BYTES = 640*1024;', '''export const FORWARD_ACCOUNT_TARGET_BYTES = 640*1024;
          // A paired trial owns both source and inverse wallets plus draining
          // legacy positions. Its logical JSON envelope is not one old account.
          // Keep the existing compressed-byte, chunk-count and per-value limits;
          // the explicit head mode is checked again against the decoded ledger.
          export const FORWARD_PAIRED_ACCOUNT_MAX_BYTES = 4*1024*1024;''')
          replace('inline?: Uint8Array; sampleManifestSha256?:string };','inline?: Uint8Array; sampleManifestSha256?:string; accountMode?:"shadow-inverse-v1" };')
          replace('  if(!head)return normalizeForward(null,now);','''  if(!head)return normalizeForward(null,now);
            const accountLimit=head.accountMode==="shadow-inverse-v1"?FORWARD_PAIRED_ACCOUNT_MAX_BYTES:FORWARD_ACCOUNT_MAX_BYTES;
            if(head.accountMode!==undefined&&(head.accountMode!=="shadow-inverse-v1"||head.version!==FORWARD_PAGED_STATE_VERSION))
              throw new Error("前向账户存储模式异常；保留原账户");''')
          replace('head.version===FORWARD_PAGED_STATE_VERSION?FORWARD_ACCOUNT_MAX_BYTES:MAX_STATE_BYTES','head.version===FORWARD_PAGED_STATE_VERSION?accountLimit:MAX_STATE_BYTES')
          replace('if(head.version===FORWARD_PAGED_STATE_VERSION&&raw.length>FORWARD_ACCOUNT_MAX_BYTES)','if(head.version===FORWARD_PAGED_STATE_VERSION&&raw.length>accountLimit)')
          replace('  const decoded=JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(raw)) as ForwardState;','''  const decoded=JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(raw)) as ForwardState;
            if(head.accountMode!==undefined&&decoded.inverseTrial?.version!==head.accountMode)
              throw new Error("前向双账户存储头与配对账本不一致；保留原账户");''')
          replace('''  const hot=hotProjection(next,false),raw=hot.raw;
            if(raw.length>FORWARD_ACCOUNT_MAX_BYTES)
              throw new Error("Forward活跃金融状态本身超过硬上限；历史已自动冷分层，拒绝截断当前持仓或资金状态");
            const compressed=await gzip(raw),useGzip=compressed.length<raw.length,bytes=useGzip?compressed:raw;''','''  const hot=hotProjection(next,false),raw=hot.raw,
              accountBudgetBytes=next.inverseTrial?FORWARD_PAIRED_ACCOUNT_MAX_BYTES:FORWARD_ACCOUNT_MAX_BYTES;
            if(raw.length>accountBudgetBytes)
              throw new Error(`Forward活跃金融状态超过已声明账户预算（${raw.length}/${accountBudgetBytes}字节）；拒绝截断当前持仓或资金状态`);
            const compressed=await gzip(raw),useGzip=compressed.length<raw.length,bytes=useGzip?compressed:raw;
            if(bytes.length>MAX_STATE_BYTES)
              throw new Error("Forward压缩账户超过分片总预算；拒绝写入不能恢复的金融状态");''')
          replace('''    ...(useGzip?{encoding:"gzip" as const,rawLength:raw.length}:{}),...(inline?{inline:bytes.slice(0,FORWARD_COMPACT_BYTES)}:{})} satisfies Head;''','''    ...(next.inverseTrial?{accountMode:"shadow-inverse-v1" as const}:{}),
              ...(useGzip?{encoding:"gzip" as const,rawLength:raw.length}:{}),...(inline?{inline:bytes.slice(0,FORWARD_COMPACT_BYTES)}:{})} satisfies Head;''')
          replace('''    accountBudgetBytes:FORWARD_ACCOUNT_MAX_BYTES,
              utilization:raw.length/FORWARD_ACCOUNT_MAX_BYTES,...hot.meta,''','''    accountBudgetBytes,
              utilization:raw.length/accountBudgetBytes,...hot.meta,''')
          p.write_text(s)
          tests=pathlib.Path('tests/shadow-inverse.test.ts')
          tests.write_text(tests.read_text()+'''
          test('paired logical JSON above the old single-account cap roundtrips through bounded compressed chunks',async()=>{
            const {s}=fixture();s.storage.persistedAt=T;
            // Deterministic high-entropy active text exercises real external
            // chunks, not a tiny compressed run of repeated padding. No user data.
            const payload=Array.from({length:18000},(_,i)=>createHash('sha256').update('active-evidence-'+i).digest('hex')).join('');
            s.positions[0]!.rule.reason=payload;
            s.inverseTrial!.source.positions[0]!.rule.reason=payload;
            const before=structuredClone(s),write=await prepareForwardWrite(before,s,T,{compact:true});
            assert.ok(write.compression.rawBytes>2*1024*1024);
            assert.equal(write.compression.accountBudgetBytes,4*1024*1024);
            assert.ok(write.compression.storedBytes<=2*1024*1024);
            assert.ok(write.compression.chunks>0);
            const headKey='forward-relations:v1:head',head=write.entries[headKey] as {accountMode?:string;inline?:Uint8Array};
            assert.equal(head.accountMode,'shadow-inverse-v1');
            for(const value of Object.values(write.entries))if(value instanceof Uint8Array)assert.ok(value.byteLength<=112*1024);
            const db=new Map(Object.entries(write.entries)),reader={get:async<T>(k:string)=>structuredClone(db.get(k)) as T|undefined};
            const restored=await readForwardStore(reader,T+1);
            near(restored.balance,s.balance);near(restored.inverseTrial!.source.balance,s.inverseTrial!.source.balance);
            assert.equal(restored.positions[0]!.quantity,s.positions[0]!.quantity);
            assert.equal(restored.inverseTrial!.source.positions[0]!.quantity,s.inverseTrial!.source.positions[0]!.quantity);
            assert.deepEqual(restored.positions[0]!.inverseCopy,s.positions[0]!.inverseCopy);
            assert.equal(restored.positions[0]!.rule.reason,payload);
            assert.equal(restored.inverseTrial!.source.positions[0]!.rule.reason,payload);
            assertInverseTrial(restored);
            // Old or unknown heads may not silently obtain the larger envelope.
            const valid=structuredClone(db.get(headKey)) as Record<string,unknown>;
            db.set(headKey,{...valid,accountMode:undefined});await assert.rejects(()=>readForwardStore(reader,T+1),/预算/);
            db.set(headKey,{...valid,accountMode:'arbitrary'});await assert.rejects(()=>readForwardStore(reader,T+1),/模式/);
          });
          test('a single account retains its old raw limit and oversized paired accounts fail before publication',async()=>{
            const single=initialForward(T-B);single.latestReason='x'.repeat(1100*1024);
            await assert.rejects(()=>prepareForwardWrite(structuredClone(single),single,T,{compact:true}),/账户预算/);
            const {s}=fixture();s.positions[0]!.rule.reason='x'.repeat(4200*1024);
            await assert.rejects(()=>prepareForwardWrite(structuredClone(s),s,T,{compact:true}),/账户预算/);
          });
          test('declared paired storage requires an actual matching dual ledger after verified decoding',async()=>{
            const s=initialForward(T-B),write=await prepareForwardWrite(null,s,T,{compact:true}),key='forward-relations:v1:head';
            const db=new Map(Object.entries(write.entries));db.set(key,{...(db.get(key) as object),accountMode:'shadow-inverse-v1'});
            await assert.rejects(()=>readForwardStore({get:async<T>(k:string)=>structuredClone(db.get(k)) as T|undefined},T+1),/配对账本不一致/);
          });
          ''')
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','lib/forward-store.ts','tests/shadow-inverse.test.ts'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Declare and validate bounded paired-account storage envelope without dropping active financial state'
          git push origin HEAD:refs/heads/fix/20261001-inverse-storage-envelope
          mkdir -p "$RUNNER_TEMP/inverse-storage"
          git rev-parse HEAD | tee "$RUNNER_TEMP/inverse-storage/head.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Locked install
        run: npm ci
      - name: Frozen baseline, dual ledger and full regressions
        run: |
          set -uo pipefail
          failed=0
          for suite in test:direct test:live-parity test:members test:equity; do
            npm run "$suite" 2>&1 | tee "$RUNNER_TEMP/inverse-storage/${suite//:/-}.log" || failed=1
          done
          exit "$failed"
      - name: Build types lint and architecture
        if: always() && steps.apply.outcome == 'success'
        run: |
          set -uo pipefail
          failed=0
          for suite in build typecheck lint; do
            npm run "$suite" 2>&1 | tee "$RUNNER_TEMP/inverse-storage/$suite.log" || failed=1
          done
          node --test tests/architecture.test.mjs tests/migration.test.mjs 2>&1 | tee "$RUNNER_TEMP/inverse-storage/architecture.log" || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inverse-storage-verification
          path: ${{ runner.temp }}/inverse-storage
          retention-days: 3
