name: Audit live winding entry

on:
  push:
    branches: ["fix/winding-anchor-space-20260922"]
    paths:
      - ".github/workflows/audit-winding-entry.yml"

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  AUDIT_WORKER_NAME: market-sentinel-forward-audit-once

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Inspect live winding candidates through isolated binding bridge
        run: |
          set -euo pipefail
          mkdir -p .audit-forward
          cat > .audit-forward/index.mjs <<'JS'
          export default {
            async fetch(_request, env) {
              return env.MARKET_STREAM.getByName("primary").fetch("https://market-stream/forward-export");
            },
          };
          JS
          cat > .audit-forward/wrangler.toml <<EOF
          name = "$AUDIT_WORKER_NAME"
          main = "index.mjs"
          compatibility_date = "2026-09-22"
          workers_dev = true

          [[durable_objects.bindings]]
          name = "MARKET_STREAM"
          class_name = "MarketStream"
          script_name = "market-sentinel-free"
          EOF
          cleanup() {
            npx wrangler delete --config .audit-forward/wrangler.toml --force >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          npx wrangler deploy --config .audit-forward/wrangler.toml >/dev/null
          url="https://$AUDIT_WORKER_NAME.alicia5574188.workers.dev/"
          for attempt in {1..8}; do
            curl -fsS --max-time 20 "$url" > "$RUNNER_TEMP/forward.json"
            jq -c '{
              exportedAt,
              forward:{
                startedAt:.forward.startedAt,
                lastCycleAt:.forward.lastCycleAt,
                updatedAt:.forward.updatedAt,
                openCount:(.forward.positions|length),
                resolved:.forward.resolved,
                entryDiagnostics:.forward.entryDiagnostics,
                candidateCount:(.forward.entryOpportunities|length),
                v3Count:([.forward.entryOpportunities[]|select(.version=="winding-anchor-entry-v3")]|length),
                eligibleCount:([.forward.entryOpportunities[]|select(.version=="winding-anchor-entry-v3" and .eligible==true)]|length),
                candidates:[.forward.entryOpportunities[]|select(.version=="winding-anchor-entry-v3")|{
                  symbol,timeframe,side,score,eligible,anchorPrice,distanceFromAnchorRate,
                  targetPrice,targetType,targetDistanceRate,edgeRatio,netRemainingSpaceRate,reason
                }]
              }
            }' "$RUNNER_TEMP/forward.json"
            if jq -e '.forward.entryOpportunities | any(.version=="winding-anchor-entry-v3")' "$RUNNER_TEMP/forward.json" >/dev/null; then
              exit 0
            fi
            sleep 15
          done
          exit 0
