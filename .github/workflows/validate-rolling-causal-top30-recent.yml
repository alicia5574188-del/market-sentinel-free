name: Validate Rolling Causal Top30 Recent
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-rolling-causal-top30-recent.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Build recent-holdout runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('scripts/research-rolling-causal-top30-regime.mjs').read_text()
          p=p.replace("const TRADE_MONTHS=[]; for(let y=2023,m=2;y<2026||m<=8;){TRADE_MONTHS.push(`${y}${String(m).padStart(2,'0')}`);m++;if(m===13){m=1;y++;}}","const TRADE_MONTHS=[]; for(let y=2025,m=7;y<2026||m<=8;){TRADE_MONTHS.push(`${y}${String(m).padStart(2,'0')}`);m++;if(m===13){m=1;y++;}}")
          # Use Gate contract_type to remove stock/ETF/index/FX/commodity futures, including delisted metadata.
          marker="async function listMonthSymbols(month){"
          inject=r'''const contractTypeByName=new Map();
          for(let offset=0;;offset+=100){const a=await fetchJson(`https://api.gateio.ws/api/v4/futures/usdt/contracts_all?limit=100&offset=${offset}`);if(!Array.isArray(a))throw new Error('contracts_all unavailable');for(const x of a)contractTypeByName.set(x.name,String(x.contract_type||''));if(a.length<100)break;}
          const NONCRYPTO_TYPE=/stock|metal|indice|index|forex|commodit|tradfi|etf/i;
          const isCryptoStrict=s=>isCrypto(s)&&!NONCRYPTO_TYPE.test(contractTypeByName.get(s)||'');
          async function listMonthSymbols(month){'''
          if marker not in p: raise SystemExit('list marker missing')
          p=p.replace(marker,inject,1).replace('].map(x=>x[1]).filter(isCrypto))];','].map(x=>x[1]).filter(isCryptoStrict))];',1)
          # Batch daily history; each monthly rank still uses only its previous-month slice.
          repl=r'''const dailyHistoryCache=new Map();
          async function dailyHistory(symbol){
            if(!dailyHistoryCache.has(symbol))dailyHistoryCache.set(symbol,(async()=>{
              const chunks=[['202504','202512'],['202601','202608']];
              const out=[];
              for(const [a,b] of chunks){const from=monthStartSec(a),to=nextMonthSec(b)-1;const u=`https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=${encodeURIComponent(symbol)}&from=${from}&to=${to}&interval=1d`;const x=await fetchJson(u);if(Array.isArray(x))out.push(...x);}
              return out;
            })());
            return dailyHistoryCache.get(symbol);
          }
          async function quoteVolume(symbol,month){const from=monthStartSec(month),to=nextMonthSec(month);const a=await dailyHistory(symbol);if(!Array.isArray(a)||!a.length)return null;const rows=a.filter(x=>Number(x.t)>=from&&Number(x.t)<to&&Number(x.sum)>0);if(rows.length<7)return null;return {symbol,quoteVolume:rows.reduce((s,x)=>s+Number(x.sum||0),0),days:rows.length};}

          const rankMonths='''
          p,n=re.subn(r"async function quoteVolume\(symbol,month\)\{.*?\}\n\nconst rankMonths=",repl,p,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'quote patch failed {n}')
          # Allow this external-symbol holdout to run on only validation/evaluation months.
          anchor="let src=readFileSync('scripts/research-regime-system-portfolios.mjs','utf8');"
          replacement=anchor+"\nsrc=src.replace('if (signalRaw.months.length < 39) throw new Error(\\\"Requires at least 39 chronological months\\\");','');\nsrc=src.replace('const monthStart = (month) => Date.UTC(Number(month.slice(0, 4)), Number(month.slice(4, 6)) - 1, 1);','const monthStart = (month) => month ? Date.UTC(Number(month.slice(0, 4)), Number(month.slice(4, 6)) - 1, 1) : 0;');"
          if anchor not in p: raise SystemExit('source anchor missing')
          p=p.replace(anchor,replacement,1)
          p=p.replace("const D0=Date.UTC(2023,1,1)","const D0=Date.UTC(2025,6,1)")
          Path('/tmp/rolling-recent.mjs').write_text(p)
          PY
      - name: Run recent rolling causal audit
        run: node --max-old-space-size=6144 /tmp/rolling-recent.mjs
      - name: Build holdout decision
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/rolling-regime-result.json'))
          def c(x): return {k:x.get(k) for k in ['trades','netPnl','profitFactor','maxDrawdown','activeMonths','positiveMonths']}
          b=r['candidateCombined']['base'];s=r['candidateCombined']['higherCost'];a=r['candidateCombined']['doubledAdverseEntry']
          periods=['validation','evaluation']
          pass_period=lambda x,k: x[k]['trades']>0 and x[k]['netPnl']>0
          out={'research':'rolling-causal-top30-recent-frozen-regime','base':{k:b[k] for k in periods},'higherCost':{k:s[k] for k in periods},'doubledAdverseEntry':{k:a[k] for k in periods},'systems':[{ 'system':x['system'],'validation':c(x['validation']),'evaluation':c(x['evaluation'])} for x in r['systems']]}
          out['decision']='RECENT_HOLDOUT_PASS' if all(pass_period(x,k) for x in [b,s,a] for k in periods) else 'RECENT_HOLDOUT_FAIL'
          json.dump(out,open('/tmp/rolling-recent-summary.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rolling-causal-top30-recent
          path: |
            /tmp/rolling-recent-summary.json
            /tmp/rolling-top30-selection.json
          retention-days: 7