name: Verify Dark UI Integration
on:
  pull_request:
    branches: [main]
    paths: ['.release/ui-dark/**', '.github/workflows/ui-dark-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    if: github.head_ref == 'ui/dark-readable-live-console' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply exact verified UI edits
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib
          root=pathlib.Path('.release/ui-dark')
          encoded=''.join((root/f'{i:02}.b64').read_text() for i in range(10))
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='04ce644636d11740e91aa50feeb77faf77d57cd2bceb18eeccd384bf860ab94b','Transport checksum mismatch'
          entries=json.loads(gzip.decompress(packed));assert len(entries)==16
          for e in entries:
              p=pathlib.Path(e['path']);assert not p.is_absolute() and '..' not in p.parts
              old=p.read_bytes() if p.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None)==e['before'],f'Base mismatch: {p}'
              lines=(old or b'').decode().splitlines(keepends=True)
              for start,end,text in reversed(e['edits']):lines[start:end]=[text]
              new=''.join(lines).encode();assert hashlib.sha256(new).hexdigest()==e['after'],f'Target mismatch: {p}'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(new)
              print('Exact content verified:',p,e['after'])
          PY
      - name: Remove temporary transport helpers
        run: git rm -r --ignore-unmatch .release/ui-dark .github/workflows/ui-dark-stage.yml .github/workflows/ui-dark-workspace.yml
      - name: Verify UI and unchanged execution authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dark-ui-verification
          npm ci 2>&1 | tee /tmp/dark-ui-verification/install.log
          npm run test:direct 2>&1 | tee /tmp/dark-ui-verification/direct.log
          npm test 2>&1 | tee /tmp/dark-ui-verification/build-tests.log
          npm run typecheck 2>&1 | tee /tmp/dark-ui-verification/typecheck.log
          npm run lint 2>&1 | tee /tmp/dark-ui-verification/lint.log
          npx wrangler deploy --dry-run --config dist/server/wrangler.json 2>&1 | tee /tmp/dark-ui-verification/dry-run.log
          git diff --check
          git add -A
          git diff --cached --check
      - name: Store verified content blobs only; no branch movement or deployment
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');
            const {owner,repo}=context.repo,parent=context.payload.pull_request.head.sha;
            const branch=context.payload.pull_request.head.ref;
            const current=await github.rest.repos.getBranch({owner,repo,branch});
            if(current.data.commit.sha!==parent)throw new Error('PR head changed during verification');
            const base=await github.rest.git.getCommit({owner,repo,commit_sha:parent});
            const names=cp.execFileSync('git',['diff','--cached','--name-only','-z']).toString().split('\0').filter(Boolean);
            const tree=[];
            for(const path of names){
              if(!fs.existsSync(path)){tree.push({path,mode:'100644',type:'blob',sha:null});continue;}
              const bytes=fs.readFileSync(path),expected=crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex');
              const b=await github.rest.git.createBlob({owner,repo,content:bytes.toString('base64'),encoding:'base64'});
              if(b.data.sha!==expected)throw new Error('Blob mismatch '+path);
              tree.push({path,mode:'100644',type:'blob',sha:b.data.sha});
            }
            const evidence={parent,baseTree:base.data.tree.sha,tree,runId:context.runId,branchRefUnchanged:true,productionUnchanged:true};
            fs.writeFileSync('/tmp/dark-ui-verification/verified-tree-elements.json',JSON.stringify(evidence,null,2));
            console.log(JSON.stringify(evidence));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dark-ui-verification-${{ github.run_id }}
          path: /tmp/dark-ui-verification/
          retention-days: 7
          if-no-files-found: warn
