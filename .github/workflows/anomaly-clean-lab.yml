name: Anomaly Clean Lab
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/anomaly-clean-lab.yml"
permissions:
  contents: read
jobs:
  active-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Probe direct S3 monthly prefixes
        run: |
          cat > /tmp/probe.mjs <<'EOF'
          import { writeFileSync } from 'node:fs';
          const months=['202301','202401','202501','202601','202608'];
          const out=[];
          for(const month of months){
            const prefix=`futures_usdt/candlesticks_5m/${month}/`;
            const url=`https://gateio-public-data.s3.amazonaws.com/?list-type=2&prefix=${encodeURIComponent(prefix)}&max-keys=1000`;
            try{
              const r=await fetch(url),text=await r.text();
              const keys=[...text.matchAll(/<Key>([^<]+)<\/Key>/g)].map(m=>m[1]);
              const syms=[...new Set(keys.map(k=>k.match(/\/([^/]+_USDT)-\d{6}\.csv\.gz$/)?.[1]).filter(Boolean))];
              out.push({month,url,status:r.status,type:r.headers.get('content-type'),length:text.length,keyCount:keys.length,symbolCount:syms.length,symbols:syms.sort(),prefixReturned:text.match(/<Prefix>([^<]*)<\/Prefix>/)?.[1]??null,isTruncated:/<IsTruncated>true<\/IsTruncated>/.test(text),next:text.match(/<NextContinuationToken>([^<]+)<\/NextContinuationToken>/)?.[1]??null,head:text.slice(0,300)});
            }catch(e){out.push({month,error:String(e)});}
          }
          writeFileSync('/tmp/direct-prefix-probe.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));
          EOF
          node /tmp/probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gate-direct-prefix-probe
          path: /tmp/direct-prefix-probe.json
          retention-days: 3
