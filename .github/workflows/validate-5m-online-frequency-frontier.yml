name: Validate 5m Online Frequency Frontier
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-5m-online-state-ranker.mjs"
      - "scripts/research-5m-online-frequency-frontier.mjs"
      - ".github/workflows/validate-5m-online-frequency-frontier.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Check original and frontier syntax
        run: |
          node --check scripts/research-5m-online-state-ranker.mjs
          node --check scripts/research-5m-online-frequency-frontier.mjs
          PATCH_ONLY=1 node scripts/research-5m-online-frequency-frontier.mjs
          node --check /tmp/research-5m-online-frequency-frontier-runtime.mjs
      - name: Run 5m frequency-return frontier
        run: node --max-old-space-size=4096 scripts/research-5m-online-frequency-frontier.mjs
      - name: Print focused result
        run: jq '{decision,authority,goal,method,cost,fullMonthKeys,calibrationMonths,blindMonths,policyCount,feasibleAt5pctCount,maxTradesAt5pctCalibration,targetCandidate,diagnosticCandidate,bestReturn,bestPositiveFrequency,paretoFrontier}' /tmp/5m-online-frequency-frontier-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: 5m-online-frequency-frontier-report
          path: /tmp/5m-online-frequency-frontier-report.json
          retention-days: 7
