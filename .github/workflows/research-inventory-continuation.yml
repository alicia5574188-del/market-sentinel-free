name: Inventory Continuation Research Only
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/inventory_control_v1.py'
      - 'research/INVENTORY_V1_PROTOCOL.md'
      - '.github/workflows/research-inventory-continuation.yml'
permissions:
  contents: read
jobs:
  research:
    if: github.head_ref == 'research/inventory-continuation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install numpy==2.2.6
      - name: Test causality and accounting
        run: |
          python research/inventory_control_v1.py --self-test
          git diff --check
      - name: Read public production diagnostics without authentication or mutation
        run: |
          mkdir -p research-output/inventory-v1
          curl --fail --silent --show-error --retry 2 --max-time 20 'https://market-sentinel-free.alicia5574188.workers.dev/__health' > research-output/inventory-v1/production-health.json
          curl --fail --silent --show-error --retry 2 --max-time 20 'https://market-sentinel-free.alicia5574188.workers.dev/api/history' > research-output/inventory-v1/production-paper-history.json
          jq -c '{version,mode,runtime:{state:.runtime.state,stale:.runtime.stale,lastError:.runtime.lastError,lastSuccessAt:.runtime.lastSuccessAt,liveMode:.runtime.liveMode,strategyData:.runtime.strategyData,routeCheckCount:.runtime.strategyArena.routeCheckCount,formingRouteCount:.runtime.strategyArena.formingRouteCount,blockedRouteCount:.runtime.strategyArena.blockedRouteCount,openRouteCount:.runtime.strategyArena.openRouteCount}}' research-output/inventory-v1/production-health.json
          jq -c '{topLevelKeys:keys,itemCount:(.items|length),itemKeys:(.items[0]//{}|keys)}' research-output/inventory-v1/production-paper-history.json
      - name: Fetch official historical OHLCV using the existing verified data loader
        env:
          RESEARCH_INTERVAL: '1h'
          RESEARCH_SYMBOLS: 'BTC_USDT,ETH_USDT,SOL_USDT'
          RESEARCH_MIN_CONTRACTS: '3'
          RESEARCH_CONCURRENCY: '4'
          RESEARCH_DATASET: 'research-output/inventory-v1/dataset.json'
        run: |
          export RESEARCH_MONTHS="$(python -c 'print(",".join(f"{y}{m:02d}" for y in (2024,2025,2026) for m in range(1,13) if "202407" <= f"{y}{m:02d}" <= "202608"))')"
          node scripts/fetch-gate-history.mjs
      - name: Run fixed predeclared three-way ablation; no parameter search
        run: python research/inventory_control_v1.py --dataset research-output/inventory-v1/dataset.json
      - name: Retain reproducible research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-continuation-v1-${{ github.run_id }}
          path: research-output/inventory-v1/
          retention-days: 3
          if-no-files-found: error
