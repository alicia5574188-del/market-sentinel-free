name: Extremum Regime Stage 2

on:
  push:
    branches: [refactor-20260926]

permissions:
  contents: read

jobs:
  stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Execution interface typecheck
        run: npm run typecheck
      - name: Extremum PAPER to LIVE contract
        run: node --experimental-strip-types --test tests/adaptive-ten-live.test.ts
      - name: Full serialized LIVE parity
        run: npm run test:live-parity
      - name: Storage and migration compatibility
        run: |
          node --experimental-strip-types --test tests/forward-compact-store.test.ts
          node --test tests/architecture.test.mjs tests/migration.test.mjs
      - name: Proven Gate execution modules remain untouched
        run: |
          git diff --exit-code origin/main -- lib/gate-live.ts lib/live-session.ts lib/gate-quantity.ts LIVE_MIRROR_CONTRACT.md
      - name: Diff integrity
        run: git diff --check
