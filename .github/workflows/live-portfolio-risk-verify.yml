name: Verify directional live exposure cap

on:
  push:
    branches:
      - chatgpt/live-directional-exposure-cap

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/live-directional-exposure-cap
      - name: Use Node.js 22.15
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
      - name: Apply portfolio risk cap
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          replace_exact(
              "lib/risk-policy.ts",
              '  maxLiveOpenPositions: 3,\n',
              '  maxLiveOpenPositions: 3,\n  maxSameSideLivePositions: 2,\n',
          )
          replace_exact(
              "lib/risk-policy.ts",
              '    maxLiveOpenPositions: RISK_POLICY.maxLiveOpenPositions,\n',
              '    maxLiveOpenPositions: RISK_POLICY.maxLiveOpenPositions,\n    maxSameSideLivePositions: RISK_POLICY.maxSameSideLivePositions,\n',
          )
          replace_exact(
              "lib/live-trading-engine.ts",
              'import { getSettings, getTrade } from "./repository";\n',
              'import { liveDirectionalExposureBlockReason } from "./live-portfolio-risk";\nimport { getSettings, getTrade } from "./repository";\n',
          )
          replace_exact(
              "lib/live-trading-engine.ts",
              '''        const candidates = await listLiveEntryCandidates(updatedControl.enabledAt);\n        const candidate = candidates[0];\n        if (candidate) {''',
              '''        const candidates = await listLiveEntryCandidates(updatedControl.enabledAt);\n        const activeSides = trackedAfterReconcile.map((order) => order.side);\n        const candidate = candidates.find((item) => !liveDirectionalExposureBlockReason(activeSides, item.side));\n        if (candidate) {''',
          )
          replace_exact(
              "app/page.tsx",
              'riskPolicy: { singleTradeLossPct: number; minimumTp2NetProfitPct: number; maxMarginAllocationPct: number; dailyRealizedLossPausePct: number; peakDrawdownPct: number; maxLiveOpenPositions: number };',
              'riskPolicy: { singleTradeLossPct: number; minimumTp2NetProfitPct: number; maxMarginAllocationPct: number; dailyRealizedLossPausePct: number; peakDrawdownPct: number; maxLiveOpenPositions: number; maxSameSideLivePositions: number };',
          )
          replace_exact(
              "app/page.tsx",
              '<b>保证金 ≤ {settings?.riskPolicy.maxMarginAllocationPct ?? 20}% · TP2 ≥ {settings?.riskPolicy.minimumTp2NetProfitPct ?? 1.5}%</b>',
              '<b>保证金 ≤ {settings?.riskPolicy.maxMarginAllocationPct ?? 20}% · TP2 ≥ {settings?.riskPolicy.minimumTp2NetProfitPct ?? 1.5}% · 同方向 ≤ {settings?.riskPolicy.maxSameSideLivePositions ?? 2} 仓</b>',
          )
          replace_exact(
              "tests/risk-policy.test.ts",
              'assert.deepEqual(publicRiskPolicy(), { singleTradeLossPct: 1, minimumTp2NetProfitPct: 1.5, maxMarginAllocationPct: 20, dailyRealizedLossPausePct: 3, peakDrawdownPct: 10, maxLiveOpenPositions: 3 });',
              'assert.deepEqual(publicRiskPolicy(), { singleTradeLossPct: 1, minimumTp2NetProfitPct: 1.5, maxMarginAllocationPct: 20, dailyRealizedLossPausePct: 3, peakDrawdownPct: 10, maxLiveOpenPositions: 3, maxSameSideLivePositions: 2 });',
          )
          replace_exact(
              "package.json",
              'tests/live-entry-freshness.test.ts tests/live-deployment-safety.test.ts tests/live-trading.test.ts',
              'tests/live-entry-freshness.test.ts tests/live-deployment-safety.test.ts tests/live-portfolio-risk.test.ts tests/live-trading.test.ts',
          )
          replace_exact(
              "README.md",
              '- 全部资金风控统一按权益比例计算，不再使用固定 U 门槛：单笔结构止损风险 ≤ 当前权益 1%，单笔保证金 ≤ 当前权益 20%，保守 TP2 预计净利润 ≥ 当前权益 1.5%；Gate 当日已实现亏损达到当日参考权益 3% 或权益较实盘峰值回撤达到 10% 后锁定新开仓。真实成交后会按成交价和当前权益再次复核。\n',
              '- 全部资金风控统一按权益比例计算，不再使用固定 U 门槛：单笔结构止损风险 ≤ 当前权益 1%，单笔保证金 ≤ 当前权益 20%，保守 TP2 预计净利润 ≥ 当前权益 1.5%；Gate 当日已实现亏损达到当日参考权益 3% 或权益较实盘峰值回撤达到 10% 后锁定新开仓。最多同时 3 个实盘仓位，但同一方向最多 2 个，避免三个高度相关的 LONG 或 SHORT 同时叠满止损风险。真实成交后会按成交价和当前权益再次复核。\n',
          )
          PY
      - name: Install
        run: npm ci
      - name: Signal and risk tests
        run: npm run test:signals
      - name: Build and UI tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Commit verified final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/live-portfolio-risk-verify.yml
          git add lib/risk-policy.ts lib/live-trading-engine.ts app/page.tsx tests/risk-policy.test.ts package.json README.md
          git commit -m "Cap same-direction live exposure"
          git push origin HEAD:chatgpt/live-directional-exposure-cap
