name: Dark UI Workspace
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ui-dark-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    if: github.head_ref == 'ui/dark-readable-live-console'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Export source and public pre-release state only
        run: |
          mkdir -p /tmp/ui-workspace
          git archive HEAD -o /tmp/ui-workspace/source.tar
          curl -fsS --retry 2 --max-time 20 'https://market-sentinel-free.alicia5574188.workers.dev/api/runtime' > /tmp/ui-workspace/runtime-before.json
          curl -fsS --retry 2 --max-time 20 'https://market-sentinel-free.alicia5574188.workers.dev/__health' > /tmp/ui-workspace/health-before.json
          date -u +'%Y-%m-%dT%H:%M:%SZ' > /tmp/ui-workspace/fetched-at.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dark-ui-workspace-${{ github.run_id }}
          path: /tmp/ui-workspace/
          retention-days: 7
