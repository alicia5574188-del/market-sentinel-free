name: LIVE Session Public Production Receipt
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/live-session-production-receipt.yml']
permissions:
  contents: read
jobs:
  receipt:
    if: github.head_ref == 'verify/live-session-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for reviewed main without private access, toggles or presumed OFF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-session-receipt
          base='https://market-sentinel-free.alicia5574188.workers.dev'
          ready=0
          for attempt in {1..45}; do
            code="$(curl -sS --max-time 12 -o live-session-receipt/health-first.json -w '%{http_code}' "$base/__health" || true)"
            if [[ "$code" == 200 ]] && jq -e '.runtime.buildSha == "e1ab9d830e52455344d8d40a5dc8b4d19b5295ee" and .runtime.liveMirror.executionPolicy == "new-orders-decimal-pnl-v1" and .runtime.liveMirror.newOrdersOnly == true and .runtime.forward.storage.error == null' live-session-receipt/health-first.json >/dev/null;then ready=1;break;fi
            sleep 10
          done
          [[ "$ready" == 1 ]]
          curl -fsS --retry 2 --max-time 20 "$base/api/runtime" > live-session-receipt/runtime-first.json
          curl -fsS --retry 2 --max-time 20 "$base/api/forward/export" > live-session-receipt/export-first.json
          curl -sS --max-time 20 -o live-session-receipt/private-source-denied.json -w '%{http_code}' "$base/api/live/source?id=verification-no-parent" > live-session-receipt/private-source-status.txt
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path('live-session-receipt');r=json.loads((p/'runtime-first.json').read_text());m=r['liveMirror'];f=r['forward']
          assert r['buildSha']=='e1ab9d830e52455344d8d40a5dc8b4d19b5295ee'
          assert m['connected'] is True and m['newOrdersOnly'] is True and m['ownerControlled'] is True
          assert m['source']=='CURRENT_FORWARD_ACCOUNT' and m['executionPolicy']=='new-orders-decimal-pnl-v1'
          assert r.get('live') is None
          assert f['startedAt']==1789556791436 and f['initialEquity']==1000 and f['policyVersion']=='participation-execution-v1.2'
          assert f['storage']['error'] is None and f['resolved']>=165
          assert (p/'private-source-status.txt').read_text()=='401'
          by={t['id']:t for t in f['positions']};assert len(by)==m['sourceCount']==len(m['rows'])
          assert {x['sourceId'] for x in m['rows']}==set(by)
          if r['liveMode']['requestedEnabled']:
              assert m['enabledAt']>0
              for row in m['rows']:
                  if by[row['sourceId']]['openedAt']<=m['enabledAt']:assert row['eligible'] is False
                  if row['eligible']:assert by[row['sourceId']]['openedAt']>m['enabledAt']
          assert 0<=m['exchangePnlHoldingCount']<=m['actualLiveHoldingCount']
          print(json.dumps({'build':r['buildSha'],'owner':r['liveMode'],'mirror':m,'paper':{'start':f['startedAt'],'closed':f['resolved'],'open':len(f['positions'])}},ensure_ascii=False))
          PY
      - name: Exercise native dark public UI without owner login or mutations
        shell: bash
        run: |
          python -m pip install playwright==1.55.0
          python - <<'PY'
          import pathlib,json,shutil
          from playwright.sync_api import sync_playwright
          pth=pathlib.Path('live-session-receipt');results=[];chrome=shutil.which('google-chrome') or shutil.which('chromium');assert chrome
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path=chrome,headless=True,args=['--no-sandbox'])
              for width in [320,393,768,1440]:
                  page=b.new_page(viewport={'width':width,'height':900});errors=[];dialogs=[];mutations=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.on('dialog',lambda d:(dialogs.append(d.message),d.dismiss()))
                  def guard(route):
                      if route.request.method not in ['GET','HEAD','OPTIONS']:
                          mutations.append(route.request.method+' '+route.request.url);route.abort()
                      else:route.continue_()
                  page.route('**/*',guard)
                  response=page.goto('https://market-sentinel-free.alicia5574188.workers.dev',wait_until='domcontentloaded',timeout=45000)
                  assert response and response.status==200
                  page.wait_for_selector('.fr-app[data-ui-version="dark-live-v1"]',timeout=25000)
                  page.wait_for_timeout(1800)
                  for name in ['总览','规则','模拟','实盘','演变','系统']:
                      page.locator('nav.fr-nav button').filter(has_text=name).click();page.wait_for_timeout(400)
                      assert page.locator('nav.fr-nav button[aria-current="page"] b').inner_text()==name
                      assert not page.evaluate('document.documentElement.scrollWidth>innerWidth+1'),(width,name)
                      if name=='实盘':
                          page.get_by_text('开启前旧单不跟随',exact=True).wait_for(timeout=15000)
                          assert page.get_by_text('低于真实最低量',exact=True).is_visible()
                          if width in [393,1440]:page.screenshot(path=str(pth/f'{width}-LIVE-public.png'),full_page=True)
                      results.append({'width':width,'tab':name,'pageErrors':list(errors),'dialogs':list(dialogs),'mutationRequests':list(mutations)})
                  assert not errors and not dialogs and not mutations,(errors,dialogs,mutations)
                  page.close()
              b.close()
          (pth/'browser-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2));print('24 public deployed tab/viewport checks passed; no owner/private numeric account view claimed')
          PY
      - name: Confirm another saved cycle and native PnL metadata without private values
        shell: bash
        run: |
          set -euo pipefail
          base='https://market-sentinel-free.alicia5574188.workers.dev'
          first="$(jq -r '.forward.lastCycleAt' live-session-receipt/runtime-first.json)"
          done=0
          for attempt in {1..32}; do
            code="$(curl -sS --max-time 12 -o live-session-receipt/runtime-final.json -w '%{http_code}' "$base/api/runtime" || true)"
            if [[ "$code" == 200 ]] && jq -e --argjson first "$first" '.forward.lastCycleAt > $first and .forward.storage.persistedAt >= .forward.lastCycleAt and .forward.storage.error == null and .liveMirror.executionPolicy == "new-orders-decimal-pnl-v1"' live-session-receipt/runtime-final.json >/dev/null;then done=1;break;fi
            sleep 10
          done
          [[ "$done" == 1 ]]
          curl -fsS --retry 2 --max-time 20 "$base/__health" > live-session-receipt/health-final.json
          curl -fsS --retry 2 --max-time 20 "$base/api/forward/export" > live-session-receipt/export-final.json
          python - <<'PY'
          import json,pathlib,time
          p=pathlib.Path('live-session-receipt');first=json.loads((p/'runtime-first.json').read_text());r=json.loads((p/'runtime-final.json').read_text());h=json.loads((p/'health-final.json').read_text());m=r['liveMirror'];f=r['forward']
          assert r['liveMode']['requestedEnabled']==first['liveMode']['requestedEnabled'],'Owner intent changed during receipt; inspect owner action, never override'
          assert h['runtime']['state']=='LIVE' and h['runtime']['stale'] is False and h['runtime']['lastError'] is None
          assert h['runtime']['lastSuccessAt']>first['lastSuccessAt']
          assert f['storage']['error'] is None
          before={x['id']:x for x in first['forward']['history']};after={x['id']:x for x in f['history']}
          matched=set(before)&set(after)
          for key in matched:assert before[key]==after[key],key
          native={'holdings':m['actualLiveHoldingCount'],'withNativePnl':m['exchangePnlHoldingCount'],'lastNativePnlAt':m['lastExchangePnlAt'],'allCurrentHoldingsHaveValue':m['actualLiveHoldingCount']==m['exchangePnlHoldingCount']}
          specs={s:r['contractMeta'].get(s) for s in ['SOL_USDT','XRP_USDT','ETH_USDT','ZEC_USDT']}
          assert all(isinstance(x.get('enableDecimal'),bool) and float(x['orderSizeMin'])>0 for x in specs.values() if x)
          receipt={'checkedAt':int(time.time()*1000),'build':r['buildSha'],'owner':r['liveMode'],'mirror':m,'nativePnlCoverage':native,'specs':specs,'unchangedClosedObjectsInBothSnapshots':len(matched),'paper':{'start':f['startedAt'],'policy':f['policyVersion'],'resolved':f['resolved'],'open':len(f['positions']),'equity':f['equity'],'storage':f['storage']},'privateNumericAccountViewed':False,'realTestOrdersSubmitted':0,'ownerToggleRequests':0}
          (p/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2));print(json.dumps(receipt,ensure_ascii=False))
          PY
          date -u +'%Y-%m-%dT%H:%M:%SZ' > live-session-receipt/time.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-session-production-${{ github.run_id }}
          path: live-session-receipt/
          retention-days: 7
          if-no-files-found: error
