name: Verify Final Equity Navigation
on:
  pull_request:
    branches: [main]
    paths: ['scripts/equity-navigation-apply.py', '.github/workflows/equity-navigation-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    if: github.head_ref == 'feat/equity-curve-advisory' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: |
          python scripts/equity-navigation-apply.py
          git rm scripts/equity-navigation-apply.py .github/workflows/equity-navigation-stage.yml
      - name: Verify final tree with all source and UI authority checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/equity-final-verified
          npm ci 2>&1 | tee /tmp/equity-final-verified/install.log
          npm run test:direct 2>&1 | tee /tmp/equity-final-verified/direct.log
          npm test 2>&1 | tee /tmp/equity-final-verified/build-test.log
          npm run typecheck 2>&1 | tee /tmp/equity-final-verified/typecheck.log
          npm run lint 2>&1 | tee /tmp/equity-final-verified/lint.log
          npx wrangler deploy --dry-run --config dist/server/wrangler.json 2>&1 | tee /tmp/equity-final-verified/dry-run.log
          git diff --check
          git add -A
          git diff --cached --check
      - name: Store verified content blobs only
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');
            const {owner,repo}=context.repo,parent=context.payload.pull_request.head.sha,branch=context.payload.pull_request.head.ref;
            const current=await github.rest.repos.getBranch({owner,repo,branch});
            if(current.data.commit.sha!==parent)throw new Error('Head changed');
            const base=await github.rest.git.getCommit({owner,repo,commit_sha:parent}),tree=[],sha256={};
            for(const path of cp.execFileSync('git',['diff','--cached','--name-only','-z']).toString().split('\0').filter(Boolean)){
              if(!fs.existsSync(path)){tree.push({path,mode:'100644',type:'blob',sha:null});continue;}
              const bytes=fs.readFileSync(path),blob=await github.rest.git.createBlob({owner,repo,content:bytes.toString('base64'),encoding:'base64'});
              if(blob.data.sha!==crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex'))throw new Error('Hash mismatch');
              tree.push({path,mode:'100644',type:'blob',sha:blob.data.sha});sha256[path]=crypto.createHash('sha256').update(bytes).digest('hex');
            }
            fs.writeFileSync('/tmp/equity-final-verified/verified-tree.json',JSON.stringify({parent,baseTree:base.data.tree.sha,tree,sha256,runId:context.runId,branchRefUnchanged:true,productionUnchanged:true},null,2));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equity-final-verified-${{ github.run_id }}
          path: /tmp/equity-final-verified/
          retention-days: 7
