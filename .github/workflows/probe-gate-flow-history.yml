name: Gate Flow History Probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/replacement-engine-scan-20260914
    paths:
      - 'scripts/probe-gate-flow-history.mjs'
      - '.github/workflows/probe-gate-flow-history.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe Gate historical flow endpoints
        run: node scripts/probe-gate-flow-history.mjs
