name: Validate Funding Premium Dynamics
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-funding-premium-dynamics.mjs"
      - ".github/workflows/validate-funding-premium-dynamics.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Check syntax
        run: node --check scripts/research-funding-premium-dynamics.mjs
      - name: Run funding premium dynamics audit
        run: node --max-old-space-size=4096 scripts/research-funding-premium-dynamics.mjs
      - name: Print focused result
        run: jq '{decision,splits,availability,selection,accepted}' /tmp/funding-premium-dynamics.json
      - uses: actions/upload-artifact@v4
        with:
          name: funding-premium-dynamics
          path: |
            /tmp/funding-premium-dynamics.json
            /tmp/funding-premium-dynamics-trades.json
          retention-days: 7