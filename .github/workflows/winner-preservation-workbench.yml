name: Winner preservation isolated verification
on:
  push:
    branches: [fix/20261001-winner-preservation]
    paths:
      - scripts/winner-edits-*.b64
      - .github/workflows/winner-preservation-workbench.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/20261001-winner-preservation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20261001-winner-preservation
          fetch-depth: 0
      - name: Validate and apply exact source edits
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path('.')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          payload=''.join(''.join((root/f'scripts/winner-edits-{i}.b64').read_text().split()) for i in (1,2,3))
          assert sha(payload.encode())=='9b022629190f1b1713ca4e52312ddd1fe4a642b9f1af8145c90fb631b8bddfc7','Transport digest mismatch'
          raw=lzma.decompress(base64.b64decode(payload,validate=True))
          assert sha(raw)=='990301ea3b19e56d057b1b850bd90849a68fe7f5aca47a88f036b01287f0d8c7','Edit digest mismatch'
          edits=json.loads(raw)
          allowed=set('WINNER_PRESERVATION.md app/forward-dashboard.tsx app/market-intelligence-execution.tsx lib/forward-protection-checkpoint.ts lib/forward-relations.ts lib/gate-live.ts lib/live-parity.ts lib/live-reduction.ts lib/live-settlement.ts lib/market-intelligence-engine.ts lib/position-intelligence-engine.ts lib/review-trace.ts lib/trade-realization.ts lib/winner-policy.ts lib/winner-risk.ts package.json tests/live-parity.test.ts tests/live-reduction.test.ts tests/market-intelligence-engine.test.ts tests/winner-policy.test.ts worker/index-clean.ts worker/member-executor.ts'.split())
          assert len(edits)==22 and {e['path'] for e in edits}==allowed
          ready=[]
          for e in edits:
              p=root/e['path']; prior=p.read_bytes() if p.exists() else None
              assert (sha(prior) if prior is not None else None)==e['before'],f"Preimage mismatch: {p}"
              lines=(prior or b'').decode().splitlines(keepends=True)
              for i,j,text in reversed(e['edits']):
                  assert 0<=i<=j<=len(lines)
                  lines[i:j]=text.splitlines(keepends=True)
              new=''.join(lines).encode()
              assert sha(new)==e['after'],f"Postimage mismatch: {p}"
              ready.append((p,new))
          for p,new in ready:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(new)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          print(f'All {len(ready)} preimages and postimages verified; source edits staged.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore independent winner discovery and causal realization with range and event-risk plans'
          git push origin HEAD:refs/heads/fix/20261001-winner-preservation
          mkdir -p "$RUNNER_TEMP/winner-checks"
          git rev-parse HEAD | tee "$RUNNER_TEMP/winner-checks/head.txt"
          git diff 5be83ed3d51c7fd3d9db50a8d9b7ec01f07d4f4c --stat > "$RUNNER_TEMP/winner-checks/diff-stat.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Strategy, money, LIVE, members and equity regressions
        run: |
          set -uo pipefail
          failed=0
          for suite in test:direct test:live-parity test:members test:equity test:feed:workerd; do
            npm run "$suite" 2>&1 | tee "$RUNNER_TEMP/winner-checks/${suite//:/-}.log" || failed=1
          done
          exit "$failed"
      - name: Build, types, lint, architecture and deployment dry-run
        if: always() && steps.apply.outcome == 'success' && steps.install.outcome == 'success'
        run: |
          set -uo pipefail
          failed=0
          for suite in build typecheck lint; do
            npm run "$suite" 2>&1 | tee "$RUNNER_TEMP/winner-checks/$suite.log" || failed=1
          done
          node --test tests/architecture.test.mjs tests/migration.test.mjs 2>&1 | tee "$RUNNER_TEMP/winner-checks/architecture.log" || failed=1
          git diff --check || failed=1
          npx wrangler deploy --dry-run --config dist/server/wrangler.json 2>&1 | tee "$RUNNER_TEMP/winner-checks/dry-run.log" || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winner-preservation-checks
          path: ${{ runner.temp }}/winner-checks
          retention-days: 3
