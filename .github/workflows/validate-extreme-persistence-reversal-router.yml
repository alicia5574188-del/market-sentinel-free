name: Validate Extreme Persistence Reversal Router
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-extreme-persistence-reversal-router.mjs"
      - ".github/workflows/validate-extreme-persistence-reversal-router.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Check syntax
        run: node --check scripts/research-extreme-persistence-reversal-router.mjs
      - name: Run extreme persistence versus reversal router
        run: node --max-old-space-size=4096 scripts/research-extreme-persistence-reversal-router.mjs
      - name: Print focused result
        run: jq '{decision,candidateConfirmed,selection,accepted,combined}' /tmp/extreme-persistence-reversal-router.json
      - uses: actions/upload-artifact@v4
        with:
          name: extreme-persistence-reversal-router
          path: |
            /tmp/extreme-persistence-reversal-router.json
            /tmp/extreme-persistence-reversal-events.json
          retention-days: 7
