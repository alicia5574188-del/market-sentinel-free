name: Stage Verified Forward Release
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/forward-apply-release.py'
      - '.github/workflows/forward-relation-stage.yml'
permissions:
  contents: write
jobs:
  stage:
    if: github.head_ref == 'feature/forward-relation-engine-v1' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply exact SHA256-guarded verified source edits
        run: python scripts/forward-apply-release.py
      - name: Remove temporary release-transfer helpers
        run: git rm --ignore-unmatch scripts/forward-apply-release.py .github/workflows/forward-relation-stage.yml .github/workflows/forward-relation-bootstrap.yml
      - name: Independently verify functional release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/forward-verification
          npm ci 2>&1 | tee /tmp/forward-verification/install.log
          npm run test:direct 2>&1 | tee /tmp/forward-verification/direct.log
          npm test 2>&1 | tee /tmp/forward-verification/test-build.log
          npm run typecheck 2>&1 | tee /tmp/forward-verification/typecheck.log
          npm run lint 2>&1 | tee /tmp/forward-verification/lint.log
          npx wrangler deploy --dry-run --config dist/server/wrangler.json 2>&1 | tee /tmp/forward-verification/dry-run.log
          git diff --check
          git add -A
          git diff --cached --check
      - name: Store verified content only; connector handles workflow-authorized tree and ref changes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const crypto = require('crypto');
            const {owner, repo} = context.repo;
            const parent = context.payload.pull_request.head.sha;
            const branch = context.payload.pull_request.head.ref;
            const current = await github.rest.repos.getBranch({owner,repo,branch});
            if (current.data.commit.sha !== parent) throw new Error('Head changed during verification');
            const base = await github.rest.git.getCommit({owner,repo,commit_sha:parent});
            const names = cp.execFileSync('git',['diff','--cached','--name-only','-z']).toString().split('\0').filter(Boolean);
            const tree = [];
            for (const path of names) {
              if (!fs.existsSync(path)) { tree.push({path,mode:'100644',type:'blob',sha:null}); continue; }
              const bytes = fs.readFileSync(path);
              const blob = await github.rest.git.createBlob({owner,repo,content:bytes.toString('base64'),encoding:'base64'});
              const expected = crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex');
              if (blob.data.sha !== expected) throw new Error('Blob digest mismatch: '+path);
              tree.push({path,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            const evidence = {parent,baseTree:base.data.tree.sha,tree,runId:context.runId,branchRefUnchanged:true,productionUnchanged:true};
            fs.writeFileSync('/tmp/forward-verification/verified-tree-elements.json',JSON.stringify(evidence,null,2));
            console.log('VERIFIED_TREE_ELEMENTS='+JSON.stringify(evidence));
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-verified-stage-${{ github.run_id }}
          path: /tmp/forward-verification/
          retention-days: 7
          if-no-files-found: warn
