name: Validate Rolling Causal Top30 Regime Fast
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-rolling-causal-top30-regime-fast.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Build accelerated rolling runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('scripts/research-rolling-causal-top30-regime.mjs').read_text()
          repl=r'''const dailyHistoryCache=new Map();
          async function dailyHistory(symbol){
            if(!dailyHistoryCache.has(symbol))dailyHistoryCache.set(symbol,(async()=>{
              const chunks=[['202301','202312'],['202401','202412'],['202501','202512'],['202601','202608']];
              const out=[];
              for(const [a,b] of chunks){
                const from=monthStartSec(a),to=nextMonthSec(b)-1;
                const u=`https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=${encodeURIComponent(symbol)}&from=${from}&to=${to}&interval=1d`;
                const x=await fetchJson(u);
                if(Array.isArray(x))out.push(...x);
              }
              return out;
            })());
            return dailyHistoryCache.get(symbol);
          }
          async function quoteVolume(symbol,month){
            const from=monthStartSec(month),to=nextMonthSec(month);
            const a=await dailyHistory(symbol);
            if(!Array.isArray(a)||!a.length)return null;
            const rows=a.filter(x=>Number(x.t)>=from&&Number(x.t)<to&&Number(x.sum)>0);
            if(rows.length<7)return null;
            return {symbol,quoteVolume:rows.reduce((s,x)=>s+Number(x.sum||0),0),days:rows.length};
          }

          const rankMonths='''
          q,n=re.subn(r"async function quoteVolume\(symbol,month\)\{.*?\}\n\nconst rankMonths=",repl,p,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'quoteVolume patch failed {n}')
          Path('/tmp/rolling-fast.mjs').write_text(q)
          PY
      - name: Run accelerated rolling causal audit
        run: node --max-old-space-size=6144 /tmp/rolling-fast.mjs
      - name: Print summary
        run: jq '{decision,activeByMonth,systems,combined:{external:.combined.external.base,stress:.combined.external.higherCost,core11Baseline:.combined.core11Baseline.base}}' /tmp/rolling-top30-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: rolling-causal-top30-regime-fast
          path: |
            /tmp/rolling-top30-summary.json
            /tmp/rolling-top30-selection.json
            /tmp/rolling-regime-result.json
          retention-days: 7