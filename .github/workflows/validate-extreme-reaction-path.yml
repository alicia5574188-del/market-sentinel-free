name: Validate Extreme Reaction Path
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-extreme-reaction-path.mjs"
      - ".github/workflows/validate-extreme-reaction-path.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Check syntax
        run: node --check scripts/research-extreme-reaction-path.mjs
      - name: Run frozen reaction path audit
        run: node --max-old-space-size=4096 scripts/research-extreme-reaction-path.mjs
      - name: Print focused result
        run: jq '{decision,eventCounts,signalCounts,selection,accepted,combined}' /tmp/extreme-reaction-path.json
      - uses: actions/upload-artifact@v4
        with:
          name: extreme-reaction-path
          path: |
            /tmp/extreme-reaction-path.json
            /tmp/extreme-reaction-path-signals.json
            /tmp/extreme-reaction-path-trades.json
          retention-days: 7