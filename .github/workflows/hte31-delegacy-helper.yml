name: HTE31 de-legacy branch helper

on:
  push:
    branches: [refactor/hte31-delegacy-final]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[delegacy-helper-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/hte31-delegacy-final
          fetch-depth: 0
      - name: Apply deterministic edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/live-trading-engine.ts')
          text = path.read_text()
          old = '''  getLiveControl,\n  getLiveCredentialRecord,'''
          new = '''  getLiveControl,\n  getLiveCredentialRecord,\n  getLiveLinkedTrade,'''
          if old not in text:
              raise SystemExit('live repository import insertion point not found')
          text = text.replace(old, new, 1)

          old = 'import { getSettings, getTrade } from "./repository";'
          new = 'import { getSettings } from "./settings-repository";'
          if old not in text:
              raise SystemExit('legacy repository import not found')
          text = text.replace(old, new, 1)

          old = 'const linkedTrade = await getTrade(order.tradeCaseId);'
          new = 'const linkedTrade = await getLiveLinkedTrade(order.tradeCaseId);'
          if old not in text:
              raise SystemExit('linked trade lookup not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          for dead in [
              'app/human-trader.css',
              'app/live-orders-inline.tsx',
              'app/bottom-nav-viewport-fix.css',
              'app/polish.css',
          ]:
              p = Path(dead)
              if p.exists():
                  p.unlink()
          PY
          rm .github/workflows/hte31-delegacy-helper.yml
      - name: Commit branch edits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: complete HTE31 de-legacy cutover [delegacy-helper-done]"
          git push origin HEAD:refactor/hte31-delegacy-final
