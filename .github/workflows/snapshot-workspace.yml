name: Snapshot diagnostics workspace
on:
  push:
    branches: [diagnostics/snapshot-v2-20260930]
    paths: [.github/workflows/snapshot-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-source
          path: source.tar
          retention-days: 1
