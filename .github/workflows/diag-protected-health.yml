name: Diagnose protected realtime health

on:
  push:
    branches: [ops/diag-protected-health-20260922]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read production health
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/health.json" -w '%{http_code}'             "https://market-sentinel-free.alicia5574188.workers.dev/__health" || true)"
          echo "http=$code"
          jq -c '{
            ok,ready,version,mode,
            runtime:{
              buildSha:.runtime.buildSha,
              state:.runtime.state,
              stale:.runtime.stale,
              lastError:.runtime.lastError,
              lastSuccessAt:.runtime.lastSuccessAt,
              symbols:.runtime.symbols,
              realtimeReadiness:.runtime.realtimeReadiness,
              feedQuality:.runtime.feedQuality,
              liveMode:.runtime.liveMode,
              forward:.runtime.forward,
              strategyData:.runtime.strategyData
            }
          }' "$RUNNER_TEMP/health.json"
