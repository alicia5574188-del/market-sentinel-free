name: Verify deployment disarm boundary

on:
  push:
    branches:
      - chatgpt/disarm-live-on-deploy

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/disarm-live-on-deploy
      - name: Use Node.js 22.15
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
      - name: Apply deployment safety boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          replace_exact(
              "worker/index.ts",
              'import { resolveVapidConfig } from "../lib/vapid-config";\nimport {',
              'import { resolveVapidConfig } from "../lib/vapid-config";\nimport { workerVersionChanged } from "../lib/live-deployment-safety";\nimport {',
          )
          replace_exact(
              "worker/index.ts",
              '  OWNER_ACCESS_TOKEN?: string;\n  POSITION_MONITOR?:',
              '  OWNER_ACCESS_TOKEN?: string;\n  CF_VERSION_METADATA?: { id: string; tag?: string; timestamp?: string };\n  POSITION_MONITOR?:',
          )
          replace_exact(
              "worker/index.ts",
              '''  private initializeRuntime() {\n    setRuntimeDb(this.env.DB);\n    setRuntimeBindings(this.env);\n  }\n\n  private async schedule(delayMs = 1_000) {''',
              '''  private initializeRuntime() {\n    setRuntimeDb(this.env.DB);\n    setRuntimeBindings(this.env);\n  }\n\n  private async enforceDeploymentBoundary() {\n    const versionId = this.env.CF_VERSION_METADATA?.id?.trim();\n    if (!versionId) return;\n    const previousVersionId = await this.ctx.storage.get<string>("workerVersionId");\n    if (!workerVersionChanged(previousVersionId, versionId)) return;\n    const snapshot = await getLiveTradingSnapshot();\n    if (snapshot.control.entryEnabled && snapshot.control.state === "armed") {\n      await setAutomaticEntry(false, "system-worker-deployment");\n    }\n    await this.ctx.storage.put("workerVersionId", versionId);\n  }\n\n  private async schedule(delayMs = 1_000) {''',
          )
          replace_exact(
              "worker/index.ts",
              '      this.initializeRuntime();\n      return await operation();',
              '      this.initializeRuntime();\n      await this.enforceDeploymentBoundary();\n      return await operation();',
          )
          replace_exact(
              "tests/cloudflare-deployment-config.test.mjs",
              '    config.assets?.binding,\n    ...(config.d1_databases ?? [])',
              '    config.assets?.binding,\n    config.version_metadata?.binding,\n    ...(config.d1_databases ?? [])',
          )
          replace_exact(
              "tests/cloudflare-deployment-config.test.mjs",
              '  assert.ok((config.migrations ?? []).some(({ new_sqlite_classes: classes }) => classes?.includes("LiveTradingCoordinator")));\n});',
              '  assert.ok((config.migrations ?? []).some(({ new_sqlite_classes: classes }) => classes?.includes("LiveTradingCoordinator")));\n  assert.deepEqual(config.version_metadata, { binding: "CF_VERSION_METADATA" });\n});',
          )
          replace_exact(
              "app/page.tsx",
              '开启、部署或刷新页面都不会自动恢复交易。',
              'Worker 新版本部署后会自动关闭新开仓；普通重启和刷新页面不会改变当前开关状态。',
          )
          replace_exact(
              "tests/live-trading-ui.test.mjs",
              'assert.match(source, /开启、部署或刷新页面都不会自动恢复交易/);',
              'assert.match(source, /Worker 新版本部署后会自动关闭新开仓；普通重启和刷新页面不会改变当前开关状态/);',
          )
          replace_exact(
              "README.md",
              '- 自动实盘只接受本次开关开启后产生、且确认时间不超过 2 分钟的新策略订单；Worker 延迟、重启或排队后超过时限的旧信号不会补开仓，同一时间有多个新候选时优先处理最新确认的信号。\n',
              '- 自动实盘只接受本次开关开启后产生、且确认时间不超过 2 分钟的新策略订单；Worker 延迟、重启或排队后超过时限的旧信号不会补开仓，同一时间有多个新候选时优先处理最新确认的信号。\n- Cloudflare Worker 新版本部署会通过官方 Version Metadata 自动识别，并只关闭“新开仓”权限；已有 Gate 仓位、止盈止损和对账继续运行。普通同版本 Worker 重启不会误关开关。\n',
          )
          PY
      - name: Install
        run: npm ci
      - name: Signal and risk tests
        run: npm run test:signals
      - name: Build and UI tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Commit verified final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/deployment-disarm-verify.yml
          git add worker/index.ts app/page.tsx README.md tests/cloudflare-deployment-config.test.mjs tests/live-trading-ui.test.mjs
          git commit -m "Disarm live entry on Worker deployment"
          git push origin HEAD:chatgpt/disarm-live-on-deploy
