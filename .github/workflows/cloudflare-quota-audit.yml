name: Cloudflare Quota Read Only Audit
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/cloudflare-quota-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.head_ref == 'verify/cloudflare-quota-cache-20260919' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Read actual authorized plan and aggregate usage, never billing changes
        env:
          CF_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          mkdir -p quota-audit
          python3 - <<'PY'
          import os,json,pathlib,urllib.request,urllib.error,datetime,re
          out=pathlib.Path('quota-audit');token=os.environ.get('CF_READ_TOKEN','');base='https://api.cloudflare.com/client/v4';calls=[]
          now=datetime.datetime.now(datetime.timezone.utc);today=now.replace(hour=0,minute=0,second=0,microsecond=0);iso=lambda d:d.isoformat().replace('+00:00','Z')
          result={'checkedAt':iso(now),'readOnly':True,'billingChanges':0,'tradingRequests':0,'accountPlanConfirmed':False,'accountMetricsConfirmed':False}
          def save():
              result['calls']=calls;text=json.dumps(result,ensure_ascii=False,indent=2)
              if token:assert token not in text
              (out/'quota-audit.json').write_text(text)
          def request(url,payload=None,auth=True):
              headers={'Accept':'application/json','User-Agent':'sentinel-quota-audit'}
              if auth:headers['Authorization']='Bearer '+token
              body=json.dumps(payload).encode() if payload is not None else None
              if body:headers['Content-Type']='application/json'
              try:
                  req=urllib.request.Request(url,data=body,headers=headers,method='POST' if body else 'GET')
                  with urllib.request.urlopen(req,timeout=20) as r:status=r.status;raw=r.read(20000000)
              except urllib.error.HTTPError as e:status=e.code;raw=e.read(100000)
              except Exception as e:status=0;raw=json.dumps({'errors':[{'message':type(e).__name__}]}).encode()
              try:d=json.loads(raw)
              except Exception:d={'errors':[{'message':'Non-JSON response'}]}
              if not isinstance(d,dict):d={'result':d}
              d['_status']=status;calls.append({'path':url.split('/client/v4')[-1] if auth else '/__health','status':status,'errors':d.get('errors')});save();return d
          h=request('https://market-sentinel-free.alicia5574188.workers.dev/__health',auth=False);(out/'health-before.json').write_text(json.dumps(h))
          aa=request(base+'/accounts?per_page=50') if token else {};selected=None
          for a in (aa.get('result') or [])[:5]:
              sub=request(base+'/accounts/'+a['id']+'/workers/subdomain')
              if (sub.get('result') or {}).get('subdomain')=='alicia5574188':selected=a['id'];break
          result['targetAccountIdentified']=bool(selected);save()
          if selected:
              prefix=base+'/accounts/'+selected
              d=request(prefix+'/workers/account-settings');result['workersSettings']={'status':d['_status'],'data':d.get('result'),'errors':d.get('errors')};save()
              d=request(prefix+'/subscriptions');result['subscriptionsReadStatus']=d['_status'];result['subscriptionErrors']=d.get('errors')
              if d.get('success') and isinstance(d.get('result'),list):
                  result['subscriptions']=[{k:s.get(k) for k in ['state','rate_plan','current_period_start','current_period_end']} for s in d['result']];result['accountPlanConfirmed']=True
              save()
              for path,label,keys in [('/workers/durable_objects/namespaces?per_page=100','namespaces',['name','class','script','use_sqlite']),('/d1/database?per_page=100','databases',['name','file_size','num_tables','version'])]:
                  d=request(prefix+path);result[label]={'status':d['_status'],'items':[{k:n.get(k) for k in keys} for n in d['result']] if isinstance(d.get('result'),list) else None};save()
              def gql(q):return request(base+'/graphql',{'query':q})
              schema=gql('{__schema{queryType{name} types{name kind fields{name type{kind name ofType{kind name ofType{kind name ofType{kind name}}}}}}}}')
              (out/'schema-response.json').write_text(json.dumps(schema))
              s=(schema.get('data') or {}).get('__schema') or {};types={t['name']:t for t in s.get('types',[])}
              def named(t):
                  while t and not t.get('name'):t=t.get('ofType')
                  return t.get('name') if t else None
              def field(t,n):return next((f for f in (t or {}).get('fields',[]) or [] if f['name']==n),None)
              def child(t,n):
                  f=field(t,n);return types.get(named(f['type'])) if f else None
              root=types.get((s.get('queryType') or {}).get('name'));account=child(child(root,'viewer'),'accounts')
              result['introspectionAccessible']=bool(account);result['metrics']={};save()
              datasets=['workersInvocationsAdaptive','durableObjectsInvocationsAdaptiveGroups','durableObjectsPeriodicGroups','durableObjectsStorageGroups','d1AnalyticsAdaptiveGroups','d1StorageAdaptiveGroups']
              windows={'previousUTCday':(today-datetime.timedelta(days=1),today),'todayUTC':(today,now)}
              for dataset in datasets:
                  dt=child(account,dataset);parts=[]
                  for agg in ['sum','max']:
                      at=child(dt,agg);fs=[]
                      for f in (at or {}).get('fields',[]) or []:
                          if (types.get(named(f['type'])) or {}).get('kind')=='SCALAR' and re.search('request|duration|wall|cpu|read|writ|row|storage|byte|error|bill',f['name'],re.I):fs.append(f['name'])
                      if fs:parts.append(agg+'{'+ ' '.join(fs)+'}')
                  if not parts:
                      fallback={'workersInvocationsAdaptive':'sum{requests errors subrequests}','durableObjectsInvocationsAdaptiveGroups':'sum{requests}','durableObjectsPeriodicGroups':'sum{cpuTime wallTime}','durableObjectsStorageGroups':'sum{readUnits writeUnits}','d1AnalyticsAdaptiveGroups':'sum{rowsRead rowsWritten}','d1StorageAdaptiveGroups':'max{databaseSizeBytes}'}
                      parts=[fallback[dataset]]
                  result['metrics'][dataset]={}
                  for label,(lo,hi) in windows.items():
                      q='{viewer{accounts(filter:{accountTag:'+json.dumps(selected)+'}){'+dataset+'(limit:1,filter:{datetime_geq:'+json.dumps(iso(lo))+',datetime_lt:'+json.dumps(iso(hi))+'}){'+ ' '.join(parts)+'}}}}'
                      d=gql(q);accounts=((d.get('data') or {}).get('viewer') or {}).get('accounts');value=accounts[0].get(dataset) if accounts else None
                      result['metrics'][dataset][label]={'start':iso(lo),'end':iso(hi),'data':value,'errors':d.get('errors'),'status':d['_status']};save()
              result['accountMetricsConfirmed']=all(isinstance(result['metrics'].get(ds,{}).get('todayUTC',{}).get('data'),list) for ds in datasets[:4])
          save();print((out/'quota-audit.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-quota-audit-${{ github.run_id }}
          path: quota-audit/
          retention-days: 7
          if-no-files-found: error
