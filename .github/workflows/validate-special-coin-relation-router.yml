name: Validate Special Coin Relation Router
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-special-coin-relation-router.mjs"
      - ".github/workflows/validate-special-coin-relation-router.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Run special coin relation event study
        run: node scripts/research-special-coin-relation-router.mjs
      - name: Print focused summary
        run: |
          jq '{decision,rawEvents,dedupedEvents,selectedCounts,gates,allZ2:.matrix.all.both.z2,leaderZ2:.matrix.all.leader.z2,loserZ2:.matrix.all.loser.z2}' /tmp/special-coin-relation-router.json
      - uses: actions/upload-artifact@v4
        with:
          name: special-coin-relation-router
          path: |
            /tmp/special-coin-relation-router.json
            /tmp/special-coin-relation-events.json
          retention-days: 7
