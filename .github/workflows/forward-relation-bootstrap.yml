name: Forward Relation Workspace
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/forward-relation-bootstrap.yml']
permissions:
  contents: read
jobs:
  workspace:
    if: github.head_ref == 'feature/forward-relation-engine-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Export clean workspace with no credentials
        run: |
          set -euo pipefail
          mkdir -p /tmp/forward-workspace
          git archive HEAD -o /tmp/forward-workspace/source.tar
          npm ci
          tar -czf /tmp/forward-workspace/node-modules.tar.gz node_modules
          curl -fsS --retry 2 --max-time 20 'https://market-sentinel-free.alicia5574188.workers.dev/api/runtime' > /tmp/forward-workspace/runtime-before.json
          curl -fsS --retry 2 --max-time 20 'https://market-sentinel-free.alicia5574188.workers.dev/__health' > /tmp/forward-workspace/health-before.json
          date -u +'%Y-%m-%dT%H:%M:%SZ' > /tmp/forward-workspace/fetched-at.txt
          git rev-parse HEAD > /tmp/forward-workspace/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: forward-workspace-${{ github.run_id }}
          path: /tmp/forward-workspace/
          retention-days: 3
