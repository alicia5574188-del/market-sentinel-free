name: Verify Bounded Release Health Retry
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/release-health-window-stage.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.head_ref == 'fix/release-health-window' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify one-line retry-only amendment
        run: |
          mkdir -p /tmp/health-retry-verified
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('.github/workflows/sentinel-v2-ci.yml');old=p.read_bytes()
          assert hashlib.sha256(old).hexdigest()=='08e76920d2a40d120dd7810ead22c1822dca5c4157684eae7e372f0e8669b142'
          a=b'curl -fsS --retry 2 --max-time 20 "$WORKER_BASE_URL/__health" > "$RUNNER_TEMP/owner-intent-before.json"'
          b=b'curl -fsS --retry 30 --retry-delay 5 --retry-max-time 180 --max-time 20 "$WORKER_BASE_URL/__health" > "$RUNNER_TEMP/owner-intent-before.json"'
          assert old.count(a)==1
          new=old.replace(a,b)
          assert hashlib.sha256(new).hexdigest()=='cdcfc9e75fc25fb59516ed41ba310396274d164c167a1712c498e987f1bf7d08'
          assert new.replace(b,a)==old
          assert b'--fail-with-body' not in b and b' -f' not in b
          p.write_bytes(new)
          import yaml
          config=yaml.safe_load(p.read_text());assert config['jobs']['deploy']['timeout-minutes']==20
          text=new.decode();assert 'before="$(jq -r' in text and '[[ "$before" == "$after" ]]' in text
          Path('/tmp/health-retry-verified/amendment.json').write_text(json.dumps({'before':hashlib.sha256(old).hexdigest(),'after':hashlib.sha256(new).hexdigest(),'changedLines':1,'httpFailureStillRejected':True,'postDeployChecksUnchanged':True,'tradingSourceUnchanged':True,'maxRetryElapsedSeconds':180},indent=2))
          PY
          git diff --check
          git diff -- .github/workflows/sentinel-v2-ci.yml > /tmp/health-retry-verified/change.patch
      - name: Store verified workflow blob only, connector handles review and release
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),{owner,repo}=context.repo;
            const bytes=fs.readFileSync('.github/workflows/sentinel-v2-ci.yml');
            const blob=await github.rest.git.createBlob({owner,repo,encoding:'base64',content:bytes.toString('base64')});
            const parent=context.payload.pull_request.head.sha;
            const c=await github.rest.git.getCommit({owner,repo,commit_sha:parent});
            const expected=crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex');
            if(blob.data.sha!==expected)throw Error('blob mismatch');
            const result={parent,baseTree:c.data.tree.sha,blobSha:blob.data.sha,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),branchUnchanged:true,productionUnchanged:true};
            fs.writeFileSync('/tmp/health-retry-verified/verified-tree.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-health-retry-${{ github.run_id }}
          path: /tmp/health-retry-verified/
          retention-days: 7
