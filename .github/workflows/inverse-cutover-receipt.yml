name: Inverse PAPER public cutover receipt
on:
  push:
    branches: [verify/20261001-inverse-cutover]
    paths: [.github/workflows/inverse-cutover-receipt.yml]
permissions: {}
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Public GET health diagnostics and continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,time
          from datetime import datetime,timezone
          url='https://market-sentinel-free.alicia5574188.workers.dev/__health'
          expected='bb439660877ae311fc5c82174d3f416258aaaf03'
          source='2b4fd60f77c9b78526bd5087940945fe7e86fab8'
          # Actual PRE_RELEASE from run 36813145157/job 110212367710, 04:01:36 UTC.
          baselineEpoch=1790816669059;baselineResolved=31
          receipts=[]
          for n in range(3):
              if n:time.sleep(15)
              raw=subprocess.check_output(['curl','--silent','--show-error','--max-time','20','--write-out','\n%{http_code}',url],text=True)
              body,status=raw.rsplit('\n',1)
              try:data=json.loads(body)
              except json.JSONDecodeError:
                  print('NON_JSON_HEALTH '+json.dumps({'http':status,'body':body[:4000]}),flush=True);raise
              r=data.get('runtime') or {};f=r.get('forward') or {};multi=r.get('multiSourceMarket') or {};si=f.get('shadowInverse')
              receipt={'sample':n+1,'observedAt':datetime.now(timezone.utc).isoformat(),'http':int(status),
                  'topLevel':{k:v for k,v in data.items() if k!='runtime'},'ok':data.get('ok'),'buildSha':r.get('buildSha'),
                  'authorityReady':r.get('authorityReady'),'stale':r.get('stale'),'lastError':r.get('lastError'),
                  'runtimeAt':r.get('lastSuccessAt'),'feedAt':multi.get('lastSuccessAt'),'healthySources':multi.get('healthySources'),
                  'accountStartedAt':f.get('startedAt'),'initialEquity':f.get('initialEquity'),'resolved':f.get('resolved'),
                  'openCount':f.get('openCount'),'storage':f.get('storage'),'researchAt':f.get('lastCycleAt'),
                  'entryEvaluatedAt':(f.get('entryDiagnostics') or {}).get('at'),'liveMode':r.get('liveMode'),
                  'readiness':r.get('realtimeReadiness'),'scanned':(r.get('radar') or {}).get('scanned'),
                  'shadowInverse':{k:v for k,v in si.items() if k!='curve'} if isinstance(si,dict) else si,
                  'runtimeDiagnostics':{k:v for k,v in r.items() if any(s in k.lower() for s in ['error','health','budget','blocked','storage'])}}
              print('PUBLIC_RECEIPT '+json.dumps(receipt,ensure_ascii=False),flush=True);receipts.append(receipt)
          for r in receipts:
              assert r['http']==200 and r['ok'] and r['buildSha']==expected and r['authorityReady'] is True and r['stale'] is False and r['lastError'] is None
              assert r['storage']['error'] is None and r['accountStartedAt']==baselineEpoch and r['initialEquity']==1000 and r['resolved']>=baselineResolved
              assert r['liveMode']=={'requestedEnabled':False,'operational':False}
              assert r['readiness']['protectedMarketsReady'] is True and r['healthySources']>=3
              x=r['shadowInverse'];assert x['sourceBuild']==source and x['version']=='shadow-inverse-v1'
              assert x['independentDecisions'] is False and x['liveExecution']=='PAPER_ONLY'
              assert x['pairedOpened']-x['pairedClosed']==x['pairedOpen'] and abs(x['settledAttributionResidual'])<1e-7
          a,b=receipts[0],receipts[-1]
          assert b['runtimeAt']>a['runtimeAt'] and b['feedAt']>a['feedAt']
          assert b['shadowInverse']['cutoverAt']==a['shadowInverse']['cutoverAt']
          print('CONTINUITY_PASS '+json.dumps({'buildSha':expected,'sourceBuild':source,'accountEpochPreserved':True,
              'runtimeAdvanceMs':b['runtimeAt']-a['runtimeAt'],'feedAdvanceMs':b['feedAt']-a['feedAt'],
              'pairedOpened':b['shadowInverse']['pairedOpened'],'pairedClosed':b['shadowInverse']['pairedClosed'],
              'legacyOpen':b['shadowInverse']['legacyOpen'],'sourceCalls':'PUBLIC_HEALTH_GET_ONLY',
              'privateGateRequests':0,'productionWrites':0,'liveIntentUnchanged':True}),flush=True)
          PY
