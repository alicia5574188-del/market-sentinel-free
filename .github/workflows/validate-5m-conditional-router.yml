name: Validate 5m Conditional Router
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-5m-conditional-router.mjs"
      - ".github/workflows/validate-5m-conditional-router.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Check syntax
        run: node --check scripts/research-5m-conditional-router.mjs
      - name: Run nonlinear conditional router
        run: node --max-old-space-size=4096 scripts/research-5m-conditional-router.mjs
      - name: Print focused result
        run: jq '{decision,authority,goal,method,cost,featureRows,evalDays,families,windows,horizons,quantiles,maxSteps,fullMonthKeys,calibrationMonths,blindMonths,policyCount,feasibleAt5pctCount,maxTradesAt5pctCalibration,targetCandidate,bestReturn,bestPositiveFrequency,paretoFrontier}' /tmp/5m-conditional-router-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: 5m-conditional-router-report
          path: /tmp/5m-conditional-router-report.json
          retention-days: 7
