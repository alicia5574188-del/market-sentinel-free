name: LIVE Copy Coverage Diagnostic
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/live-copy-diagnostic.yml']
permissions:
  contents: read
jobs:
  capture:
    if: github.head_ref == 'fix/live-copy-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Capture public current-source status twice, no private requests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/live-copy-diagnostic
          git archive HEAD -o /tmp/live-copy-diagnostic/source.tar
          base='https://market-sentinel-free.alicia5574188.workers.dev'
          curl -fsS --retry 2 --max-time 20 "$base/api/runtime" > /tmp/live-copy-diagnostic/runtime-first.json
          curl -fsS --retry 2 --max-time 20 "$base/api/forward/export" > /tmp/live-copy-diagnostic/export-first.json
          sleep 15
          curl -fsS --retry 2 --max-time 20 "$base/api/runtime" > /tmp/live-copy-diagnostic/runtime-second.json
          curl -fsS --retry 2 --max-time 20 "$base/__health" > /tmp/live-copy-diagnostic/health.json
          date -u +'%Y-%m-%dT%H:%M:%SZ' > /tmp/live-copy-diagnostic/time.txt
          jq '{buildSha,liveMode,liveMirror,contractMeta}' /tmp/live-copy-diagnostic/runtime-second.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-copy-diagnostic-${{ github.run_id }}
          path: /tmp/live-copy-diagnostic/
          retention-days: 7
