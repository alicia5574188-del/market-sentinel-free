name: Verify Forward Production Read Only
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verify-forward-production.yml']
permissions:
  contents: read
jobs:
  verify-production:
    if: github.head_ref == 'verify/forward-production-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test library
        run: python -m pip install playwright==1.55.0
      - name: Confirm actual deployed build and heartbeat through verified curl transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-receipt
          base='https://market-sentinel-free.alicia5574188.workers.dev'
          curl -fsS --retry 2 --max-time 20 "$base/__health" > production-receipt/health-first.json
          sleep 12
          curl -fsS --retry 2 --max-time 20 "$base/__health" > production-receipt/health-second.json
          curl -fsS --retry 2 --max-time 20 "$base/api/runtime" > production-receipt/runtime-first.json
          curl -fsS --retry 2 --max-time 20 "$base/api/forward/export" > production-receipt/export.json
          curl -fsS --retry 2 --max-time 20 "$base/api/forward/archive" > production-receipt/archive.json
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('production-receipt');h=json.loads((root/'health-first.json').read_text());h2=json.loads((root/'health-second.json').read_text());r=h2['runtime']
          assert r['buildSha']=='3de5572d521231c427c82a0ba3980147d2ae833d'
          assert r['lastSuccessAt']>h['runtime']['lastSuccessAt']
          assert r['legacyRetired'] is True
          assert r['forward']['liveEligible'] is False
          assert r['forward']['storage']['persistedAt']>0 and r['forward']['storage']['error'] is None
          assert r['liveMode']['requestedEnabled'] is False
          a=json.loads((root/'archive.json').read_text());assert a['immutable'] is True and len(a['items'])>0
          print(json.dumps({'buildSha':r['buildSha'],'heartbeatAdvances':True,'liveMode':r['liveMode'],'forward':r['forward']},ensure_ascii=False),flush=True)
          PY
      - name: Exercise deployed desktop and mobile UI without mutations
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,shutil
          from playwright.sync_api import sync_playwright
          root=pathlib.Path('production-receipt');results=[];base='https://market-sentinel-free.alicia5574188.workers.dev'
          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          assert chrome,'Runner browser missing'
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=chrome,headless=True,args=['--no-sandbox'])
              for width in [320,393,1440]:
                  page=browser.new_page(viewport={'width':width,'height':900});errors=[];dialogs=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.on('dialog',lambda d:(dialogs.append(d.message),d.dismiss()))
                  response=page.goto(base,wait_until='domcontentloaded',timeout=45000)
                  assert response and response.status==200
                  page.wait_for_selector('.fr-app',timeout=20000);page.wait_for_timeout(2500)
                  for tab in ['总览','规则','交易','演变','系统']:
                      page.locator('nav.fr-nav button').filter(has_text=tab).click();page.wait_for_timeout(400)
                      overflow=page.evaluate('document.documentElement.scrollWidth > innerWidth + 1')
                      assert not overflow,(width,tab,'horizontal overflow')
                      assert page.locator('nav.fr-nav button[aria-current="page"] b').inner_text()==tab
                      if width in [393,1440]:page.screenshot(path=str(root/f'{width}-{tab}.png'),full_page=True)
                      results.append({'viewport':width,'tab':tab,'overflow':overflow,'pageErrors':list(errors),'dialogs':list(dialogs)})
                  assert not errors,errors
                  assert not dialogs,dialogs
                  page.locator('.fr-button').filter(has_text='进入旧账户').click();page.wait_for_timeout(400)
                  assert page.locator('.fr-return').is_visible()
                  page.locator('.fr-return').click();page.wait_for_timeout(300);assert page.locator('.fr-app').is_visible();page.close()
              browser.close()
          (root/'browser-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print(json.dumps({'browserChecks':len(results),'allPassed':True,'dialogs':0,'pageErrors':0},ensure_ascii=False))
          PY
      - name: Confirm a new completed-market observation is persisted
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..40}; do
            curl -fsS --retry 1 --max-time 15 'https://market-sentinel-free.alicia5574188.workers.dev/api/runtime' > production-receipt/runtime-final.json
            if jq -e '.forward.observations > 0 and .forward.marketCount > 0 and .forward.storage.persistedAt > 0 and .forward.storage.error == null' production-receipt/runtime-final.json >/dev/null; then break; fi
            sleep 5
          done
          jq -e '.forward.observations > 0 and .forward.marketCount > 0 and .forward.storage.error == null' production-receipt/runtime-final.json >/dev/null
          jq '{buildSha,legacyRetired,liveMode,forward:(.forward|{version,startedAt,lastCycleAt,marketCount,observations,measured,pending,resolved,equity,storage})}' production-receipt/runtime-final.json
          date -u +'%Y-%m-%dT%H:%M:%SZ' > production-receipt/fetched-at.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forward-production-receipt-${{ github.run_id }}
          path: production-receipt/
          retention-days: 7
          if-no-files-found: error
