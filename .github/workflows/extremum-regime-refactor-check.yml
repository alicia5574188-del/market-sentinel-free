name: Extremum Regime Stage 4 Regression

on:
  push:
    branches: [refactor-20260926]

permissions:
  contents: read

env:
  WORKER_BASE_URL: https://market-sentinel-free.alicia5574188.workers.dev

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci

      - name: Type and strategy regression
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:direct
          npm run test:forward

      - name: Build before workerd integration tests
        run: npm run build

      - name: LIVE, account and access regression
        run: |
          set -euo pipefail
          npm run test:live-parity
          npm run test:members
          member_ok=0
          for attempt in 1 2 3; do
            if npm run test:members:workerd; then member_ok=1; break; fi
            sleep 2
          done
          test "$member_ok" = "1"
          npm run test:equity
          npm run test:feed:workerd

      - name: Lint, architecture, migration and Cloudflare dry-run
        run: |
          set -euo pipefail
          npm run lint
          node --test tests/architecture.test.mjs tests/migration.test.mjs
          git diff --check
          npx wrangler deploy --dry-run --config dist/server/wrangler.json

      - name: Preserve execution, auth and member infrastructure
        run: |
          set -euo pipefail
          git diff --exit-code origin/main --             lib/gate-live.ts             lib/live-session.ts             lib/gate-quantity.ts             lib/credential-vault.ts             lib/owner-auth.ts             worker/member-executor.ts             LIVE_MIRROR_CONTRACT.md

      - name: Preserve all non-strategy dashboard capabilities
        run: |
          set -euo pipefail
          grep -q '"overview"' app/forward-dashboard.tsx
          grep -q '"execution"' app/forward-dashboard.tsx
          grep -q '"paper"' app/forward-dashboard.tsx
          grep -q '"live"' app/forward-dashboard.tsx
          grep -q '"journal"' app/forward-dashboard.tsx
          grep -q '"settings"' app/forward-dashboard.tsx
          grep -q '/api/forward/export' app/forward-dashboard.tsx
          grep -q 'livePanel' app/forward-dashboard.tsx
          grep -q 'accountPanel' app/forward-dashboard.tsx
          grep -q 'EquityCurve' app/forward-dashboard.tsx

      - name: Read-only production continuity observation
        run: |
          set -euo pipefail
          body="$(curl -sS --max-time 15 "$WORKER_BASE_URL/__health")"
          jq -e '
            .ok == true and
            .runtime.authorityReady == true and
            .runtime.stale == false and
            .runtime.lastError == null and
            .runtime.forward.strategyAuthorityVersion == "extremum-regime-v1" and
            .runtime.forward.storage.error == null and
            .runtime.forward.extremumTracked > 0 and
            .runtime.radar.scanned == 30 and
            .runtime.realtimeReadiness.capacity == 30 and
            .runtime.multiSourceMarket.healthySources >= 3 and
            (.runtime.liveMode.requestedEnabled|type) == "boolean"
          ' <<<"$body" >/dev/null
          jq -c '{ok,buildSha:.runtime.buildSha,state:.runtime.state,
            forward:.runtime.forward,realtimeReadiness:.runtime.realtimeReadiness,
            multiSourceMarket:.runtime.multiSourceMarket,liveMode:.runtime.liveMode,scanned:.runtime.radar.scanned}' <<<"$body"
