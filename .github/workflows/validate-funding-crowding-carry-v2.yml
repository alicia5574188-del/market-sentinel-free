name: Validate Funding Crowding Carry V2
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research-funding-crowding-carry-v2.mjs"
      - ".github/workflows/validate-funding-crowding-carry-v2.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Check syntax
        run: node --check scripts/research-funding-crowding-carry-v2.mjs
      - name: Run archived funding crowding carry audit
        run: node --max-old-space-size=4096 scripts/research-funding-crowding-carry-v2.mjs
      - name: Print focused result
        run: jq '{decision,dataSource,availability,eventCount,tradeCount,selection,accepted,combined}' /tmp/funding-crowding-carry-v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: funding-crowding-carry-v2
          path: |
            /tmp/funding-crowding-carry-v2.json
            /tmp/funding-crowding-events-v2.json
            /tmp/funding-crowding-trades-v2.json
          retention-days: 7